<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>تقييم الفريق</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
(function () {
  var emp = /[?&]e=/.test(location.search);
  document.write('<link rel="manifest" href="manifest-' + (emp ? 'emp' : 'admin') + '.json">' +
    '<meta name="apple-mobile-web-app-title" content="' + (emp ? 'تقييمي' : 'الفريق') + '">');
})();
</script>
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--fill:#F3F4F6;--fill2:#EBEDF0;--line:#EDEFF2;--line2:#E3E6EA;--text:#0F1419;--muted:#6B7280;--faint:#9CA3AF;
--acc:#1F3A5F;--acc-2:#2C5282;--acc-ink:#FFFFFF;--acc-soft:#EEF3F9;--acc-ring:#DCE6F2;
--green:#4F8463;--green-soft:#EDF4EF;--green-line:#CFE1D5;--red:#B05A52;--red-soft:#F9EEEC;--red-line:#EDCFCB;--red-row:#FDF8F7;
--amber:#C2954A;--amber-soft:#F8F1E4;--slate:#5E6B7D;
--r:12px;--r2:16px;--sh:0 1px 2px rgba(15,20,25,.04),0 4px 14px rgba(15,20,25,.04);--sh2:0 10px 30px rgba(15,20,25,.10);
--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Arabic','SF Pro Text','Segoe UI',Roboto,'Noto Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 170px)}
button{font:inherit;color:inherit}
svg.i{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:520px;margin:0 auto;padding:12px 18px 0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:30px 2px 4px}
h1{font-size:17px;font-weight:600;letter-spacing:0;margin:0;line-height:1.35}
.top .sub{margin-top:2px}
.sub{color:var(--muted);font-size:13px}
.rf,.ibtn{background:var(--surface);border:1px solid var(--line2);color:var(--text);width:42px;height:42px;border-radius:var(--r);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s var(--ease),background .15s}
.rf:active,.ibtn:active{transform:scale(.94);background:var(--fill)}
.rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:6px;margin:16px -18px 4px;padding:2px 18px 6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;border-radius:var(--r);font-size:12px;color:#4B5563;background:var(--fill);border:0;white-space:nowrap;cursor:pointer;transition:background .2s var(--ease),color .2s,transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs button.on{background:var(--text);color:#fff;font-weight:600}

#view{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.blk{animation:cardIn .4s var(--ease) both}
.card:nth-child(2),.blk:nth-child(2){animation-delay:.04s}.card:nth-child(3),.blk:nth-child(3){animation-delay:.08s}
.card:nth-child(4),.blk:nth-child(4){animation-delay:.12s}.card:nth-child(n+5),.blk:nth-child(n+5){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.blk{margin-top:20px}
.lab,.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 9px}
.blk>.lab{margin-top:0}
.lab svg,.lbl svg{color:var(--faint)}
.grp{color:var(--muted);font-size:12px;margin:10px 0 6px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ctitle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.ctitle .ci{width:30px;height:30px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.ctitle .sp{margin-right:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row+.row{margin-top:4px}
.hair{border-top:1px solid var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.emp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.emp::-webkit-scrollbar{display:none}
.empi{margin-top:8px;font-size:13px;color:var(--muted)}
.empc{flex:none;border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;cursor:pointer;transition:all .2s var(--ease)}
.empc:active{transform:scale(.98)}
.empc b{display:block;font-size:15px;font-weight:600}.empc small{color:var(--muted);font-size:12px}
.empc.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}

.segc{display:flex;background:var(--fill);border-radius:var(--r);padding:3px;gap:2px}
.segc button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-size:14px;color:#4B5563;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.segc button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(15,20,25,.10)}

.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.gr{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;position:relative;width:100%;background:none;border:0;text-align:right;cursor:pointer;transition:background .2s}
.gr+.gr:before{content:"";position:absolute;top:0;right:58px;left:0;height:1px;background:var(--line)}
.gr:active{background:var(--fill)}
.gi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--acc);flex:none}
.gi.b{background:var(--slate)}.gi.s{background:var(--amber)}
.gr .n{flex:1;font-size:15px}
.gr .n small{display:block;font-size:12px;color:var(--muted)}
.gr.off{background:var(--red-row)}
.mk{flex:none;display:flex;transition:transform .2s var(--ease)}
.mk.ok{color:#4F8463}.mk.no{color:#B05A52}
.gr:active .mk{transform:scale(.85)}
.pill,.badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);color:var(--green)}
.pill.r,.badge.late{background:var(--red-soft);color:var(--red)}
.badge.wait{background:var(--acc-soft);color:var(--acc)}
.badge.n{background:var(--fill);color:#374151}
.badge.a{background:var(--amber-soft);color:#85642B}

.tg{width:50px;height:30px;border-radius:999px;background:var(--fill2);position:relative;flex:none;border:0;padding:0;cursor:pointer;transition:background .25s var(--ease)}
.tg:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:right .25s var(--ease)}
.tg.on{background:var(--acc)}.tg.on:after{right:23px}
.tg.st.on{background:var(--amber)}

textarea,input{width:100%;background:var(--fill);border:1.5px solid transparent;color:var(--text);font:inherit;border-radius:var(--r);padding:12px 14px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 3px var(--acc-ring)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:60px;resize:none}
input[type=date]{color-scheme:light;margin-top:8px}
.field{margin-bottom:12px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600}

.btn,.btn2{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);cursor:pointer;text-decoration:none;font-weight:600;transition:transform .12s var(--ease),opacity .2s,background .2s}
.btn:active,.btn2:active{transform:scale(.97)}
.btn{width:100%;max-width:484px;margin:0 auto;background:var(--acc);color:var(--acc-ink);border:0;font-size:15px;padding:15px;box-shadow:0 8px 20px rgba(31,58,95,.22)}
.btn2{background:transparent;color:var(--text);border:1.5px solid var(--line2);font-size:14px;padding:10px 12px;font-weight:500}
.btn2.cu{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn2.arm{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn2.soft{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.btn:disabled,.btn2:disabled{opacity:.45}

.dock,.save{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(15,20,25,.06)}
.dock .in{max-width:484px;margin:0 auto}
.sum{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sum .badge:last-child{margin-right:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--fill);border:1.5px solid transparent;color:var(--text);font-size:14px;border-radius:var(--r);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.chip .ck{display:inline-flex}
.chip.add{background:transparent;border:1.5px dashed var(--line2);color:var(--acc)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kpi{background:var(--fill);border-radius:var(--r);padding:12px 14px}
.kpi .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.3px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi.hero{background:linear-gradient(150deg,var(--acc),var(--acc-2));color:#fff}
.kpi.hero .k,.kpi.hero .v small{color:rgba(255,255,255,.75)}

.note{border-radius:var(--r);padding:10px 12px;font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.note svg{margin-top:2px}
.note.good{background:var(--green-soft);color:#3A6249}
.note.bad{background:var(--red-soft);color:#7E3F39}
.note.info{background:var(--acc-soft);color:#3F5A72}
.note.warn{background:#F8F1E4;color:#85642B}
.note b{font-weight:600}

.ent{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ent:first-child{border-top:0}
.ico{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.ico.s{background:var(--amber-soft);color:var(--amber)}
.ico.m{background:var(--red-soft);color:var(--red)}
.ico.f{background:var(--acc-soft);color:var(--acc)}
.ent .t{flex:1;min-width:0}
.ent .d{color:var(--muted);font-size:12px}
.ent .p{font-size:13px;font-weight:600;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.ent .p.amt{direction:rtl}
.del{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px;display:inline-flex;align-items:center;gap:4px;border-radius:8px}
.del:active{background:var(--fill)}
.del.arm{color:var(--red);font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}.cu{color:var(--acc)}

.tbl{width:100%;font-size:14px;border-collapse:collapse}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:left;white-space:nowrap;font-weight:600}
.tbl tr.tot td{font-weight:600;font-size:15px;border-top:1.5px solid var(--line2);padding-top:11px}
.hist{display:grid;grid-template-columns:1.4fr auto auto auto;gap:8px 14px;font-size:14px;align-items:center}
.hist .h{color:var(--muted);font-size:12px;font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}

.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.load{color:var(--muted);text-align:center;padding:90px 20px}
.load .ei{width:64px;height:64px;border-radius:20px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.link{direction:ltr;font-size:12px;word-break:break-all;color:var(--muted);background:var(--fill);border-radius:10px;padding:10px;margin:10px 0}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:4px 0;cursor:pointer;margin:18px 0 0;display:inline-flex;align-items:center;gap:6px}

.task{border-top:1px solid var(--line);padding:13px 0}
.task:first-of-type{border-top:0}
.task.late b{color:var(--red)}
.task.done b{color:var(--muted);font-weight:500}
.task b{font-weight:600}
.tact{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ph{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:var(--r);margin-top:10px;background:var(--fill)}
.upl{margin-top:10px}
.pgh{color:var(--acc);font-size:13px;font-weight:600;margin:16px 0 2px;display:flex;align-items:center;gap:6px}
.pgh+.task{border-top:0;padding-top:6px}
.mst{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mi{position:relative;width:74px;height:74px;border-radius:12px;background:var(--fill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.mi img{width:100%;height:100%;object-fit:cover}
.mi .x{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.mi.up{outline:1.5px dashed var(--acc)}
.madd{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--acc);font-size:12px;cursor:pointer;text-align:center;line-height:1.3}
.vid{display:block;width:100%;height:440px;border:0;border-radius:var(--r);margin-top:10px;background:var(--fill)}
.mbtn{background:var(--acc-soft);border:0;color:var(--acc);font-size:13px;font-weight:600;border-radius:10px;padding:7px 11px;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.titem{border-top:1px solid var(--line);margin-top:16px;padding-top:2px}
.titem-h{margin:12px 0 8px}
.titem-h b{font-size:14px;color:var(--acc)}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;min-width:0}
.inrow .btn2{flex:none;padding:0 16px}
.prow{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow input{flex:1;min-width:0;padding:10px 12px}
.trow{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.trow .n{flex:1}.trow .n b{display:block;font-size:14px;font-weight:600}.trow .n small{color:var(--muted);font-size:12px}

#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:200% 0}to{background-position:-200% 0}}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:height .15s}
.hide{display:none}
input,textarea,select{font-size:16px}
select{width:100%;background:var(--fill);border:1.5px solid transparent;color:var(--text);font:inherit;font-size:16px;border-radius:var(--r);padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.tqs{margin-top:14px}
.scards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sc{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;border-radius:14px;border:2px solid transparent;cursor:pointer;text-align:right;min-height:66px;background:var(--acc-soft);color:var(--acc);transition:transform .12s var(--ease)}
.sc:active{transform:scale(.97)}
.sc b{font-size:17px;line-height:1.2;font-weight:600}.sc span{font-size:12px;font-weight:600}
.sc.a{background:var(--amber-soft);color:#85642B}.sc.r{background:var(--red-soft);color:var(--red)}
.sc.on{border-color:currentColor}.sc.z{opacity:.55}
.tfil{display:flex;gap:6px;align-items:center;margin:12px 0 0}
.tfil select{flex:1;min-width:0;width:auto;padding:8px 12px;font-size:14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line2)}
.tfil select.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.tfil .chip{flex:none;border-radius:999px;padding:8px 12px}
.chip.on.u{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.tfil .ibtn{width:40px;height:40px}
.lnk{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--acc);padding:8px 0 0;cursor:pointer;align-self:flex-start}
.sech{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:20px 0 2px}
.sech span{font-size:12px;font-weight:600;color:#4B5563;background:var(--fill);border-radius:999px;padding:0 8px}
.sech.a{color:#85642B}.sech.r{color:var(--red)}.sech.m{color:var(--muted)}
.tli{border-bottom:1px solid var(--line)}
.tli.dn{display:flex;justify-content:space-between;gap:8px;padding:10px 0}
.trow2{display:flex;gap:11px;align-items:flex-start;width:100%;background:none;border:0;text-align:right;padding:12px 0;cursor:pointer}
.trow2:active{background:var(--fill)}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:2px;background:#fff}
.ring.r{border-color:var(--red)}.ring.a{border-color:var(--amber);background:var(--amber-soft)}.ring.g{border-color:var(--green);background:var(--green)}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.th .badge{flex:none}
.tt{font-size:15px;font-weight:600;line-height:1.45}.tt.l{color:var(--red)}.tt.d{color:var(--muted);font-weight:500;text-decoration:line-through}
.tm{font-size:13px;color:var(--muted)}
.mbs{display:flex;gap:6px;flex-wrap:wrap}
.mb{font-size:12px;border-radius:6px;padding:0 7px;background:var(--fill);color:#374151}.mb.u{background:var(--red-soft);color:var(--red);font-weight:600}
.racts{margin:0 33px 12px 0}
.btn2.rd{color:var(--red);border-color:var(--red-line);font-weight:600}
.dtog{width:100%;background:none;border:0;text-align:right;font-size:13px;font-weight:600;color:var(--green);padding:16px 0 6px;cursor:pointer}
.fab{position:fixed;left:18px;bottom:calc(26px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(31,58,95,.3);cursor:pointer;z-index:8;padding:0}
.fab.hide{display:none}

function zoomClose() { const z = $('#zv'); if (z) z.remove(); document.documentElement.classList.remove('zlock'); }
function zoomBind(z) {
  const img = z.querySelector('img');
  let s = 1, tx = 0, ty = 0, st = null;
  const apply = () => { img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')'; };
  const fit = () => {
    if (s <= 1.02) { s = 1; tx = 0; ty = 0; return; }
    const mx = Math.max(0, (img.offsetWidth * s - z.clientWidth) / 2), my = Math.max(0, (img.offsetHeight * s - z.clientHeight) / 2);
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
  };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => ({x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2});
  const begin = t => {
    if (t.length === 2) st = {k: 'p', d: dist(t) || 1, s: s, tx: tx, ty: ty, m: mid(t)};
    else if (t.length === 1 && s > 1) st = {k: 'm', x: t[0].clientX, y: t[0].clientY, tx: tx, ty: ty};
    else st = null;
  };
  z.addEventListener('touchstart', e => { img.style.transition = 'none'; const h = z.querySelector('.zh'); if (h) h.remove(); begin(e.touches); }, {passive: true});
  z.addEventListener('touchmove', e => {
    if (!st) return;
    e.preventDefault();
    const t = e.touches;
    if (st.k === 'p' && t.length === 2) {
      const r = z.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, m = mid(t);
      const qx = (st.m.x - cx - st.tx) / st.s, qy = (st.m.y - cy - st.ty) / st.s;
      s = Math.min(6, Math.max(1, st.s * dist(t) / st.d));
      tx = m.x - cx - s * qx; ty = m.y - cy - s * qy;
      apply();
    } else if (st.k === 'm' && t.length === 1) {
      tx = st.tx + t[0].clientX - st.x; ty = st.ty + t[0].clientY - st.y;
      apply();
    }
  }, {passive: false});
  const end = e => {
    if (e.touches.length) return begin(e.touches);
    st = null; img.style.transition = 'transform .2s ease-out'; fit(); apply();
  };
  z.addEventListener('touchend', end);
  z.addEventListener('touchcancel', end);
  z.addEventListener('gesturestart', e => e.preventDefault());
  z.addEventListener('click', e => { if (e.target === z && s === 1) zoomClose(); });
}

  const exp = okM.reduce((a, x) => a + x.amount, 0);
  const rv = c.items.filter(x => x.kind === 'inv' && x.status === 'review');
  const cnt = (n, one, two, many, sing) => n === 1 ? one : n === 2 ? two : n + ' ' + (n > 10 && sing ? sing : many);

  const seg = S.fx.seg === 'p' ? 'p' : 'i';
  h += `<div class="fseg"><div class="segc"><button class="${seg === 'i' ? 'on' : ''}" onclick="S.fx.seg='i';S.fx.ord=false;S.fx.all=false;S.armed=null;renderFin()">الفواتير</button><button class="${seg === 'p' ? 'on' : ''}" onclick="S.fx.seg='p';S.armed=null;renderFin()">المشاريع</button></div>${seg === 'p' && nAct > 1 && !S.fx.ord ? `<button class="ordb" onclick="S.fx.ord=true;renderFin()">${I('list-checks', 16)}رتّب</button>` : ''}</div>`;
  if (seg === 'i') {

      <select aria-label="الموظف" onchange="S.fx.fe=this.value;S.fx.all=false;renderFin()">${opt('', 'كل الموظفين', fe)}${d.employees.map(e => opt(e.id, esc(shortName(e.name)), fe)).join('')}${all.some(x => !x.emp) ? opt('-', 'أنا', fe) : ''}</select>
      <select aria-label="الحالة" onchange="S.fx.fs=this.value;S.fx.all=false;renderFin()">${opt('', 'كل الحالات', fs)}${opt('review', 'تنتظر اعتمادك', fs)}${opt('ok', 'معتمدة', fs)}${opt('returned', 'مرتجعة' + (nRt ? ' (' + nRt + ')' : ''), fs)}</select></div>`;
    h += `<div class="sub fvn">${L.length ? cnt(L.length, 'فاتورة وحدة', 'فاتورتين', 'فواتير', 'فاتورة') + ' · ' + M(Math.round(L.reduce((a, x) => a + x.amount, 0) * 100) / 100, '', 't') : ''}</div>`;
    h += L.length ? `<div class="fvl">${invDaysHtml(L, true, false, 12, 'كلها')}</div>` : emptyHtml('receipt', fp || fe || fs ? 'ما فيه فواتير بهذا الفلتر' : 'ما فيه فواتير للحين');
  } else {
    const act = (d.projects || []).filter(p => !p.archived);
    if (S.fx.ord && act.length > 1) {
      h += `<div class="fxt"><span>رتّبها مثل ما تبي، والترتيب يمشي على المهام بعد</span><button class="dn" onclick="S.fx.ord=false;renderFin()">تم</button></div>`
        + '<div class="tbl2 fxl2">' + act.map((p, i) => `<div class="tbr ordr"><span class="ic">${I('folder', 16)}</span><span class="k">${esc(p.name)}</span><span class="ord"><button ${i === 0 ? 'disabled' : ''} onclick="projMove('${p.id}',-1)" aria-label="فوق">${SV_UP}</button><button ${i === act.length - 1 ? 'disabled' : ''} onclick="projMove('${p.id}',1)" aria-label="تحت">${SV_DN}</button></span></div>`).join('') + '</div>';
    } else {
      const used = new Set(c.items.filter(x => x.kind === 'inv').map(x => x.project || ''));

      const tail = k => `<span class="am">${M(spent[k] || 0, '', 't')}<span class="cv">${I('chevron-left', 16)}</span></span>`;
      const arch = (d.projects || []).filter(p => p.archived && used.has(p.id));
      const pr = (k, nm, cls) => tbRow('folder', nm, M(spent[k] || 0, '', 't'), `openFinProj('${k}')`).replace('class="tbr"', 'class="tbr' + (cls ? ' ' + cls : '') + '"');
      h += '<div class="tbl2 fxl2">' + act.map(p => pr(p.id, esc(p.name))).join('')
        + (used.has('') ? pr('', 'بدون مشروع', 'ar') : '')
        + arch.map(p => pr(p.id, esc(p.name) + ' · مؤرشف', 'ar')).join('') + '</div>';
    }
  }
  $('#view').innerHTML = h;
}

async function projMove(id, dir) {
  const ps = (S.data.projects || []).slice(), act = ps.filter(p => !p.archived), i = act.findIndex(p => p.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= act.length) return;
  const t = act[i]; act[i] = act[j]; act[j] = t;
  const order = act.concat(ps.filter(p => p.archived));
  S.data.projects = order;
  renderFin();
  try { S.data = await call('apiProjOrder', BOOT.key, order.map(p => p.id)); renderFin(); }
  catch (e) { toastErr(e); refresh(true); }
}

/* الإصدار 99: الحركات مجمّعة حسب اليوم، فالسطر فيه الوقت بس والتاريخ في عنوان المجموعة */
function finLedger(c, e) {
  const L = [], mine = c.items.filter(x => x.emp === e.id);
  mine.filter(x => x.kind === 'give').forEach(x => L.push({ts: x.ts, k: 'c', dc: x.paidBy === 'own' ? 0 : x.paidBy === 'ret' ? -x.amount : x.amount, h: `<div class="str"><span><b style="font-weight:600">${x.paidBy === 'own' ? 'سدّدت له' : x.paidBy === 'ret' ? 'رجّع من العهدة' : 'عطيته عهدة'}</b>${x.desc && !['عهدة', 'سداد', 'رجّع الباقي'].includes(x.desc) ? ' · ' + esc(x.desc) : ''}<div class="tm">${t12(x.ts)}${x.method ? ' · ' + esc(x.method) : ''}%%B%%</div></span>
      <span style="display:flex;align-items:center;gap:4px"><b class="iva ${x.paidBy === 'ret' ? 'r' : 'g'}">${M(x.amount, x.paidBy === 'ret' ? '−' : '+', x.paidBy === 'ret' ? 'neg' : 'pos')}</b><button class="ed" onclick="askGiveEdit('${x.id}')" aria-label="تعديل">${I('pencil', 16)}</button></span></div>`}));
  mine.filter(x => x.kind === 'inv' && x.status === 'ok').forEach(x => {
    const fromC = (x.paidBy || 'cash') === 'cash';
    L.push({ts: x.ts, k: 'c', dc: fromC ? -x.amount : 0, h: `<button class="strb" onclick="openInvD('${x.id}')"><div class="str"><span><b style="font-weight:600">فاتورة · ${esc(x.desc)}</b>${wBadge(x)}<div class="tm">${t12(x.ts)} · ${esc(x.pname || 'عام')}%%B%%</div></span><b class="iva">${M(x.amount, fromC ? '−' : '', fromC ? 'neg' : '')} ‹</b></div></button>`});
  });
  (e.tx || []).forEach(t => {
    const armed = S.armed === 'tx_' + t.id;
    const canMv = t.kind === 'pay' && !t.via && !t.fromParts;
    L.push({ts: t.date || (t.ts || '').slice(0, 10), k: 's', h: `<div class="str"><span><b style="font-weight:600">${esc(txText(t))}</b>${t.note ? ' · ' + esc(t.note) : ''}</span>
      <span style="display:flex;align-items:center;gap:4px"><b class="iva">${M(t.amount, t.kind === 'ded' ? '−' : '', t.kind === 'ded' ? 'neg' : '')}</b>${canMv ? `<button class="ed" onclick="openMove('${e.id}','${t.id}')" aria-label="تصحيح الشهر">${I('pencil', 15)}</button>` : ''}<button class="ed ${armed ? 'arm' : ''}" style="${armed ? 'color:var(--red);font-size:13px' : ''}" onclick="armTx('${t.id}')" aria-label="حذف">${armed ? 'احذف؟' : I('trash-2', 15)}</button></span></div>`});
  });
  return L.sort((a, b) => a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : 0);
}

/* الإصدار 96: نفس صفحة الموظف المالية، تنفتح من ملفه في «الفريق»: «الراتب» (الكشف والصرف والسلف) أو «العهدة» (الرصيد والمرتجعة)، وكل وحدة على فلتر حركاتها */
function renderFinEmp(c, id, mode) {
  const d = c.d, e = d.employees.find(x => x.id === id), p = c.parts[id] || {c: 0, o: 0, g: 0, rt: 0, cash: 0};
  const mine = c.items.filter(x => x.emp === id);
  const f = S.form && S.form.emp === id && !['part', 'prev', 'move'].includes(S.form.kind) ? S.form : null, sal = mode !== 'cu';
  let h = `<button class="back" onclick="tsub(null)">${I('arrow-right', 17)}${esc(shortName(e.name))}</button><div class="fxh"><h2>${sal ? 'راتب' : 'عهدة'} ${esc(shortName(e.name))}</h2><span>${esc(d.month)}</span></div>`;
  /* الإصدار 92: الفواتير المرجّعة اللي ما صحّحها الموظف تبان هنا وتنحذف */
  const rt = mine.filter(x => x.kind === 'inv' && x.status === 'returned');
  if (!sal && rt.length) h += `<button class="dtog" style="padding:6px 2px 10px;color:var(--red)" onclick="S.fx.rt=!S.fx.rt;S.armed=null;renderFin()" aria-expanded="${!!S.fx.rt}">فواتير مرتجعة عنده (${rt.length}) · ${rt.reduce((a, x) => a + x.amount, 0).toLocaleString('en-US')}${S.fx.rt ? ' · إخفاء' : ''}</button>` + (S.fx.rt ? `<div class="sub" style="margin:0 2px 8px">رجّعتها له وما صحّحها. ما تنحسب في العهدة ولا المصاريف. الحذف نهائي.</div>` + rt.map(x => invRowHtml(x, false)).join('') + '<div style="height:12px"></div>' : '');
  if (sal) h += salCardHtml(e, true);
  if (sal) h += `<div class="card">${f ? formHtml(e, f) + '<div class="hair"></div>' : salActHtml(e)}${e.unpaid.length ? (pm => e.unpaid.map(u => u.month === pm ? payHtml(e, u) : payRowHtml(e, u)).join(''))((e.unpaid.find(u => S.fx.pm === e.id + u.month) || e.unpaid.find(u => S.armed === 'pay_' + e.id + u.month) || e.unpaid[0]).month) : `<div class="row"><b>الراتب</b><span class="badge">${I('check', 12, 3)} كل الرواتب منصرفة</span></div>`}
    ${e.loans.length ? `<div class="hair"></div><div class="lbl" style="margin-top:0">${I('hand-coins', 14)}السلف</div>
      ${e.loans.map(l => `<div class="row"><span>سلفة ${sar(l.amount)} <span class="sub">· ${dmy(l.date)}</span></span><span class="sub">باقي ${sar(l.remaining)}</span></div>`).join('')}` : ''}</div>`;
  if (!sal) h += `<div class="card"><div class="fxb">
      <div><b>${p.c < 0 ? 'صرف أكثر من عهدته' : 'معه عهدة'}</b>${M(Math.abs(p.c), p.c < 0 ? '−' : '', p.c < 0 ? 'neg' : '')}<small>عطيته ${M(p.g || 0, '', 't')}${p.rt ? ' · رجّع ' + M(p.rt, '', 't') : ''} · صرف ${M(p.cash || 0, '', 't')}</small></div>
      <div><b>له عندك من جيبه</b>${M(p.o || 0, '', p.o > 0 ? 'neg' : '')}${p.o > 0 ? `<button class="lnk" onclick="askSdad('${id}', ${p.o})">${I('check', 14, 2.5)} سدّدته</button>` : ''}</div></div></div>`;
  /* الإصدار 80: فلتر الحركات (الكل · العهدة · الراتب)، و«العهدة» فيها الرصيد بعد كل حركة */
  const lf = ['c', 's'].includes(S.fx.lf) ? S.fx.lf : 'all', LA = finLedger(c, e);
  let bal = 0, bOk = true;
  LA.slice().reverse().forEach(x => { if (x.k === 'c' && x.dc) { bal = Math.round((bal + x.dc) * 100) / 100; x.bal = bal; } });
  if (Math.abs(bal - (p.c || 0)) > 0.01) bOk = false;
  /* الإصدار 82: «العهدة» فيها بس اللي يغيّر العهدة (عطيته، رجّع، فواتير العهدة). فواتير «أنا» و«من جيبه» والسداد تطلع في «الكل» */
  const L = LA.filter(x => lf === 'all' || (x.k === lf && (lf !== 'c' || x.dc))).map(x => ({ts: x.ts, h: x.h.replace('%%B%%', lf === 'c' && bOk && x.bal !== undefined ? `<span class="rb">معه بعدها ${M(x.bal, x.bal < 0 ? '−' : '', 't')}</span>` : '')}));
  h += `<div class="sech">${lf === 'c' ? 'حركات العهدة' : lf === 's' ? 'حركات الراتب' : 'كل حركاته'}<span>${L.length}</span></div>`;
  h += `<div class="segc fxlf">${[['all', 'الكل'], ['c', 'العهدة'], ['s', 'الراتب']].map(o => `<button class="${lf === o[0] ? 'on' : ''}" onclick="S.fx.lf='${o[0]}';S.fx.all=false;renderFin()">${o[1]}</button>`).join('')}</div>`
    + (lf === 'c' && LA.some(x => x.k === 'c' && !x.dc) ? '<div class="sub fxln">فواتير «بطاقتي» و«من جيبه» ما تغيّر العهدة، تطلع في «الكل»</div>' : '');
  if (L.length) {
    const days = [], by = {};
    L.forEach(x => { const k = (x.ts || '').slice(0, 10); if (!by[k]) { by[k] = []; days.push(k); } by[k].push(x); });
    let n = 0, more = false, g = '';
    for (const k of days) {
      if (!S.fx.all && n >= 12) { more = true; break; }
      const D = by[k]; n += D.length;
      g += `<div class="dyh"><b>${k ? esc(invDayLabel(k, d.today)) : 'تاريخ غير محدد'}</b><span>${D.length === 1 ? 'حركة وحدة' : D.length === 2 ? 'حركتين' : D.length + (D.length > 10 ? ' حركة' : ' حركات')}</span></div><div class="card fxl dyc">${D.map(x => x.h).join('')}</div>`;
    }
    h += `<div class="fvl">${g}${more || (S.fx.all && L.length > 12 && days.length > 1) ? `<button class="dtog dya" onclick="S.fx.all=!S.fx.all;renderFin()">${S.fx.all ? 'أقل' : 'كلها (' + L.length + ')'}</button>` : ''}</div>`;
  } else h += emptyHtml('wallet', 'ما فيه حركات للحين');
  $('#view').innerHTML = h;
}

  $('#view').innerHTML = h;
}

/* الإصدار 98: الفواتير مجمّعة حسب اليوم: عنوان اليوم مرة وحدة بعدده ومجموعه، وتحته فواتيره بسطر مختصر فيه الوقت بس. الضغط يفتح التفاصيل */
function invDayLabel(dt, today) {

async function saveFin() {

  if (S.form.kind === 'ded' && S.form.reason === 'fine') {

/* الإصدار 75: صرف الراتب من قائمة «رواتب مستحقة» بالصافي المحسوب */
async function payQuick(emp, month) {
  const k = 'payq_' + emp + month;
  if (S.armed !== k) { S.armed = k; renderFin(); return; }
  lockBtn('جاري تسجيل الصرف…');
  try { S.data = await call('apiPay', BOOT.key, {emp, month, amount: ''}); S.armed = null; renderAdmin(); toast('تسجل الصرف'); }
  catch (e) { S.armed = null; renderFin(); toastErr(e); }
}
async function pay(emp, month) {
  const k = 'pay_' + emp + month;
  if (S.armed !== k) { S.armed = k; renderFin(); return; }
  const v = $('#pay_' + emp + month).value, dt = ($('#pd_' + emp + month) || {}).value || '';
  /* الإصدار 92: المبلغ أقل من الباقي له: الافتراضي يتسجل دفعة والشهر يبقى مفتوح، وإقفال الشهر بالمبلغ الناقص يحتاج اختيار صريح */
  const pe = empById(emp), pu = pe && (pe.unpaid || []).find(u => u.month === month), need = pu ? Math.max(0, Math.round((pu.net - (pu.credit || 0)) * 100) / 100) : 0;
  if (!pay.force && pu && Number(v) > 0 && Number(v) < need - 0.005) {
    const fm = n => (Math.round(n * 100) / 100).toLocaleString('en-US');
    S.payq = {emp, month, v: Number(v), dt};
    return ovOpen(`<label class="shh">المبلغ أقل من الباقي له</label>
      <div class="sub" style="margin:-6px 0 10px">راتب ${esc(pu.label)}: الباقي له ${fm(need)}، وكتبت ${fm(Number(v))}.</div>
      <button class="btn2 cu qbig" onclick="payPart()">${I('hand-coins', 17)}سجّلها دفعة</button>
      <div class="sub" style="margin:4px 0 12px">يتسجل ${fm(Number(v))} دفعة من الراتب، ويبقى له ${fm(need - Number(v))} والشهر مفتوح.</div>
      <button class="btn2 rd qbig" onclick="payClose()">اصرف ${fm(Number(v))} وأقفل الشهر</button>
      <div class="sub" style="margin:4px 0 12px">الشهر يتقفل «منصرف»، والفرق ${fm(need - Number(v))} ما ينحسب له بعدها.</div>
      <div class="err" id="pqerr"></div>
      <button class="btn2" style="width:100%" onclick="S.payq=null;S.armed=null;ovClose();renderFin()">إلغاء</button>`);
  }
  pay.force = false;
  lockBtn('جاري تسجيل الصرف…');
  try { S.data = await call('apiPay', BOOT.key, {emp, month, amount: v, date: dt}); S.armed = null; if (S.pd) delete S.pd[emp + month]; renderAdmin(); toast('تسجل الصرف' + (dt && dt !== S.data.today ? ' بتاريخ ' + dmy(dt) : '')); }
  catch (e) { S.armed = null; renderFin(); toastErr(e); }
}

async function payPart() {
  const q = S.payq; if (!q) return;
  const un = lockBtn('جاري الحفظ…');
  try {
    S.data = await call('apiSalPart', BOOT.key, {emp: q.emp, amount: q.v, date: q.dt, month: q.month, note: ''}); S.payq = null; S.armed = null; if (S.pd) delete S.pd[q.emp + q.month]; ovClose(); renderAdmin();
    const e = empById(q.emp); toast('انحفظت الدفعة، الباقي ' + ((e && e.sal ? e.sal.left : 0)).toLocaleString('en-US'));
  } catch (err) { if (un) un(); const x = $('#pqerr'); if (x) x.textContent = err; else toastErr(err); }
}
function payClose() { const q = S.payq; if (!q) return; S.payq = null; ovClose(); S.armed = 'pay_' + q.emp + q.month; pay.force = true; return pay(q.emp, q.month); }
function txText(t) {
  if (t.kind === 'part') return 'دفعة من الراتب';
  if (t.kind === 'pay' && t.via) return 'انسدد راتب ' + t.label + ' بالدفعات';
  if (t.kind === 'loan') return 'سلفة على ' + t.months + ' ' + (t.months <= 10 ? 'شهور' : 'شهر') + ' · الخصم من ' + t.label;
  if (t.kind === 'adv') return 'راتب مقدم من راتب ' + t.label;

/* الإصدار 83: كشف المستحقات والدفعات. للمدير: تسجيل دفعة وحذف آخر دفعة. للموظف: عرض بس */
function salCardHtml(e, admin) {
  const st = e.sal;

  const today = (S.data || {}).today || '', fut = admin ? (e.unpaid || []).filter(u => !(u.due && u.due <= today)).map(u => ({u, v: n(Math.max(0, u.net - (u.credit || 0)))})).filter(x => x.v > 0) : [];
  const late = n(st.left - fut.reduce((a, x) => a + x.v, 0));
  const nx = fut.length && st.left > 0 && late >= 0 ? `<div class="sub slnx">${late > 0 ? 'المتأخر الحين <b>' + late.toLocaleString('en-US') + '</b> · و' : 'ما فيه متأخر · '}${fut.map(x => x.v.toLocaleString('en-US') + ' راتب ' + esc(x.u.label) + (x.u.due ? ' يستحق ' + esc(dueL(x.u.due)) : '')).join(' و')}</div>` : '';
  const isCl = m => m.closed || m.left <= 0, nCl = admin ? st.months.filter(isCl).length : 0, fold = nCl > 1 && !S.fx.cm;
  let h = `<div class="card slc">${ctitle('receipt', 'كشف المستحقات والدفعات')}
    <div class="slst"><div><b>إجمالي المستحق</b><div class="v">${M(st.due)}</div></div><div><b>المدفوع</b><div class="v pos">${M(st.paid)}</div></div><div><b>المتبقي</b><div class="v ${st.left > 0 ? 'neg' : 'pos'}">${M(st.left)}</div></div></div>${nx}
    <div class="slms">${nCl > 1 ? `<button class="dtog" style="padding:10px 0 6px" onclick="S.fx.cm=!S.fx.cm;renderFin()" aria-expanded="${!fold}">شهور مسددة (${nCl})${fold ? '' : ' · إخفاء'}</button>` : ''}${st.months.filter(m => !(fold && isCl(m))).map(m => {
      const pc = m.due > 0 ? Math.round(m.paid / m.due * 100) : 100, stc = m.closed || m.left <= 0 ? ['g', m.closed ? 'مسدد' : 'لا شيء'] : m.paid > 0 ? ['a', 'جزئي'] : ['', 'غير مسدد'];
      return `<div class="slm"><div class="h"><b>راتب ${esc(m.label)}</b><span class="sltg ${stc[0]}">${stc[1]}</span></div>
        <div class="s"><span>مستحق ${M(m.due, '', 't')} · مدفوع ${M(m.paid, '', 't')}</span><span>${m.closed ? (m.via ? 'انسدد بالدفعات' : 'انصرف') + (m.date ? ' ' + dmy(m.date) : '') : 'باقي ' + M(m.left, '', 't')}</span></div>
        <div class="slbar"><i class="${!m.closed && m.paid > 0 ? 'p' : ''}" style="width:${pc}%"></i></div></div>`;
    }).join('')}</div>`;
  if (st.parts.length) h += `<div class="hair"></div><div class="lbl" style="margin-top:0">${I('history', 14)}سجل الدفعات<span class="sp">${st.parts.length}</span></div>` + st.parts.map(x => {
    const al = x.al.map(q => q.done ? `${q.rest ? 'غطّت باقي' : 'غطّت كامل'} راتب ${esc(q.label)} (${n(q.take).toLocaleString('en-US')}) <span class="pos">انسدد</span>` : `${n(q.take).toLocaleString('en-US')} من راتب ${esc(q.label)}${q.rest ? ' (تكملة)' : ''}`).join('<br>');
    const arm = S.armed === 'pt_' + x.id, can = admin && x.id === st.lastPart;
    return `<div class="slp"><div class="h"><b>${M(x.amount)}${x.month ? `<span class="sltg" style="margin-inline-start:6px">لشهر ${esc(MONTHS_AR[+x.month.slice(5, 7) - 1])}</span>` : ''}</b><span class="sub">${x.date ? dmy(x.date) : 'تاريخ غير محدد'}${can ? ` <button class="ed ${arm ? 'arm' : ''}" style="${arm ? 'color:var(--red);font-size:13px' : ''}" onclick="armPart('${x.id}')" aria-label="حذف">${arm ? 'احذف؟' : I('trash-2', 15)}</button>` : ''}</span></div>${x.note ? `<div class="sub">${esc(x.note)}</div>` : ''}
      <div class="al">${al || 'ما توزعت'}<div class="sub" style="margin-top:3px">الباقي له بعدها ${M(x.after, '', 't')}</div></div></div>`;
  }).join('');
  return h + '</div>';

/* الإصدار 85: أزرار الراتب: «دفعة راتب» (جزء من الراتب، تتوزع وتنعرض قبل الحفظ) و«راتب شهر سابق» (شهر قبل بداية الحساب) وتصحيح شهر حركة صرف */

  if (r.opened) return `<span class="badge wait">فتحه وما خلّصه</span><div class="gst">فتحه ${t12(r.opened)}${r.wrong ? ' · جاوب غلط ' + (r.wrong === 1 ? 'مرة' : r.wrong + ' مرات') : ''}</div>`;
  return `<span class="badge late">ما فتحه</span><div class="gst">انرسل ${dmy(r.sent.slice(0, 10))} ${t12(r.sent)}</div>`;
}

function openGForm() {
  S.gform = {title: '', points: ['', ''], q: false, qt: '', opts: ['', '', ''], ok: -1, emps: S.data.employees.filter(e => e.guide).map(e => e.id)};
  S.armed = null; renderTasks();
  setTimeout(() => { const x = $('#g_title'); if (x) x.focus(); }, 50);
}
function gPt(i) { const p = S.gform.points; if (i < 0) p.push(''); else p.splice(i, 1); renderTasks(); }
function gEmp(id) { const a = S.gform.emps, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); renderTasks(); }
async function sendGuide() {
  const f = S.gform;
  const x = {title: f.title, points: f.points, emps: f.emps, q: f.q ? {text: f.qt, opts: f.opts, ok: f.ok} : null};
  if (!f.title.trim()) return $('#gerr').textContent = 'اكتب عنوان التوجيه';
  if (!f.points.some(p => p.trim())) return $('#gerr').textContent = 'اكتب نقطة وحدة على الأقل';
  if (f.q && f.ok < 0) return $('#gerr').textContent = 'اضغط الدائرة جنب الجواب الصح';
  const un = lockBtn('جاري الإرسال…');
  try { S.data = await call('apiGuideAdd', BOOT.key, x); S.gform = null; renderAdmin(); toast('انرسل التوجيه'); }
  catch (e) { un(); $('#gerr').textContent = e; }
}
async function delGuide(id) {
  if (S.armed !== 'gd_' + id) { S.armed = 'gd_' + id; renderTasks(); return; }
  try { S.data = await call('apiGuideDel', BOOT.key, id); S.armed = null; renderAdmin(); toast('انحذف التوجيه'); }
  catch (e) { S.armed = null; renderTasks(); toastErr(e); }
}
function payDue(e, mk) {
  if (!mk) return '';
  let y = +mk.slice(0, 4), m = +mk.slice(5, 7);
  if (e.payNext) { m++; if (m > 12) { m = 1; y++; } }
  return y + '-' + String(m).padStart(2, '0') + '-' + String(e.payDay || 28).padStart(2, '0');
}
async function setPayday(id) {
  const dd = $('#pdd_' + id), dn = $('#pdn_' + id);
  if (!dd || !dn) return;
  dd.disabled = dn.disabled = true;
  try { S.data = await call('apiEmpPayday', BOOT.key, id, +dd.value, dn.value === '1'); renderAdmin(); toast('انحفظ موعد الصرف'); }
  catch (err) { renderAdmin(); toastErr(err); }
}
async function setLang(id, lang, sel) {
  const e = empById(id), old = e.lang || 'ar';
  if (sel) sel.disabled = true;
  try { S.data = await call('apiEmpLang', BOOT.key, id, lang); renderAdmin(); lgAdminContent(); toast('صفحته صارت بـ' + ((LANGS.find(l => l[0] === lang) || [])[1] || lang)); }

}
async function toggleGuide(id) {

function guideBannerHtml(d) {
  if (!d.guideOn) return '';
  return (d.guides || []).filter(g => !g.done).map(g => `<button class="gban" onclick="openGuide('${g.id}')">
    <span class="gbi">${I('clipboard-list', 20)}</span><span class="gbt"><small>توجيه جديد من المدير العام</small><b>${esc(g.title)}</b></span>${I('chevron-left', 18)}</button>`).join('');
}
function guideDoneHtml(d) {
  const done = (d.guides || []).filter(g => g.done);
  if (!d.guideOn || !done.length) return '';
  return `<div class="sech">التوجيهات</div><div class="card" style="padding:4px 14px">${done.map(g => `<button class="grow" onclick="openGuide('${g.id}')">
    ${I('circle-check', 17)}<span>${esc(g.title)}</span>${I('chevron-left', 16)}</button>`).join('')}</div>`;
}
function gWait(p) { return Math.max(3, Math.min(12, Math.ceil(String(p).length / 12) + 2)); }
function openGuide(id) {
  const g = (S.empData.guides || []).find(x => x.id === id);
  if (!g) return;
  S.gr = {id: id, i: 0, stage: 'points', t0: Date.now(), review: !!g.done};
  if (!g.done && !S.empPreview) API.apiGuideOpen(BOOT.token, id).catch(() => {});
  renderGuide(); toTop();
}
function closeGuide() { clearInterval(S.grT); S.gr = null; rerenderEmp(); toTop(); }
function renderGuide() {
  clearInterval(S.grT);
  const r = S.gr, g = (S.empData.guides || []).find(x => x.id === r.id);
  if (!g) { S.gr = null; return rerenderEmp(); }
  const n = g.points.length;
  let body;
  if (r.review) {
    body = `<ol class="gall">${g.points.map(p => `<li>${esc(p)}</li>`).join('')}</ol><button class="btn2" style="width:100%;margin-top:14px" onclick="closeGuide()">رجوع</button>`;
  } else if (r.stage === 'q') {
    body = `<div class="gbar"><div style="width:100%"></div></div>
      <div class="gqt">${esc(g.q.text)}</div>
      <div class="gopts">${g.q.opts.map((o, i) => `<button onclick="answerGuide(${i})">${esc(o)}</button>`).join('')}</div>`;
  } else {
    r.left = gWait(g.points[r.i]);
    body = `<div class="gbar"><div style="width:${Math.round(r.i / (n + (g.q ? 1 : 0)) * 100)}%"></div></div>
      ${g.points.slice(0, r.i).map(p => `<div class="gdone">${I('check', 15, 3)}<span>${esc(p)}</span></div>`).join('')}
      <div class="gcur"><small>${r.i + 1} من ${n}</small>${esc(g.points[r.i])}</div>
      <button class="btn2 cu gok" id="gok" disabled onclick="nextPoint()">فهمت (بعد ${r.left} ثواني)</button>`;
    S.grT = setInterval(() => {
      r.left--;
      const b = $('#gok');
      if (!b) return clearInterval(S.grT);
      if (r.left > 0) b.textContent = 'فهمت (بعد ' + r.left + ' ثواني)';
      else { clearInterval(S.grT); b.disabled = false; b.innerHTML = I('check', 16, 2.5) + 'فهمت'; }
    }, 1000);
  }
  $('#app').innerHTML = `<button class="back" onclick="closeGuide()">${I('arrow-right', 17)}رجوع</button>
    <div class="card gread"><div class="gtag">${I('clipboard-list', 14)}توجيه من المدير العام</div><h2>${esc(g.title)}</h2>${body}</div>`;
}
function nextPoint() {
  const r = S.gr, g = (S.empData.guides || []).find(x => x.id === r.id);
  if (r.left > 0) return;
  r.i++;
  if (r.i < g.points.length) return renderGuide();
  if (g.q) { r.stage = 'q'; return renderGuide(); }
  finishGuide(null);
}
function answerGuide(i) { finishGuide(i); }
async function finishGuide(ans) {
  const r = S.gr;
  if (S.empPreview) { toast('هذي معاينة، ما ينحفظ شي', null, 'in'); return closeGuide(); }
  const secs = Math.round((Date.now() - r.t0) / 1000);
  try {
    const res = await call('apiGuideDone', BOOT.token, r.id, secs, ans);
    S.empData = res.data;
    if (res.ok) { S.gr = null; rerenderEmp(); toTop(); toast('تم، يعطيك العافية'); }
    else { r.i = 0; r.stage = 'points'; r.t0 = Date.now(); renderGuide(); toTop(); toastErr('الجواب غلط، اقرا النقاط مرة ثانية'); }
  } catch (e) { toastErr(e); }
}

async function sendInv() {
  const f = S.inv, err = () => $('#ierr');
  if (!S.ishots.length && !(f.edit && (f.keep || []).length)) { err().textContent = 'صوّر الفاتورة'; return; }
  if (!(Number(String(f.amount).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^\d.]/g, '')) > 0)) { err().textContent = 'اكتب المبلغ'; return; }
  if (!f.desc.trim()) { err().textContent = 'اكتب وش اشتريت'; return; }
  if (!f.edit && f.wOn && !(f.w >= 1 && f.w <= 120)) { err().textContent = 'اكتب مدة الضمان بالأشهر'; return; }
  if (S.busy) return;
  S.busy = true; rerenderEmp();
  if (f.edit) {
    try {
      const d = await callT(120000, 'apiInvResend', BOOT.token, f.edit, {amount: f.amount, desc: f.desc, project: f.project, vendor: f.vendor || '', paidBy: f.paidBy || 'cash'}, S.ishots, f.keep || []);

    } catch (e) {
      S.busy = false; rerenderEmp(); const el = $('#ierr'); if (el) el.textContent = e;

  try {

    S.busy = false; S.invForm = false; S.ishots = []; S.inv = {amount: '', desc: '', project: f.project};
    renderEmp(d, false); toast('انرسلت الفاتورة');
  } catch (e) {
    S.busy = false; rerenderEmp(); const el = $('#ierr'); if (el) el.textContent = e;
  }
}

function rerenderEmp() { if (S.empData) renderEmp(S.empData, S.empPreview); }

function resizeImg(file, maxD, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, (maxD || 1280) / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q || 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej('ما قدرت أقرأ الصورة، جرّب صورة ثانية'); };
    img.src = url;
  });
}

async function sendDone(id) {
  const t = (S.empData.tasks || []).find(x => x.id === id) || {}, pf = t.proof || 'photo', err = m => { const el = $('#uperr'); if (el) el.textContent = m; };
  if (S.busy) return;
  if (pf === 'note' && (S.cm || '').trim().length < 3) return err('اكتب وش سوّيت');
  if (pf !== 'note' && !S.shots.length) return err(pf === 'invoice' ? 'صوّر الفاتورة' : 'لازم ترفق صورة');
  let extra = null;
  if (pf === 'invoice') {
    const f = S.dinv || {};
    if (!(Number(String(f.amount || '').replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^\d.]/g, '')) > 0)) return err('اكتب المبلغ');
    if (!String(f.vendor || '').trim()) return err('اكتب اسم المحل');
    extra = {amount: f.amount, vendor: f.vendor, paidBy: f.paidBy || 'cash'};
  }
  S.busy = true; S.upProg = ''; rerenderEmp();
  /* الإصدار 87: يبين كم صورة ارتفعت ونسبتها، ولو علّق الرفع يطلع خطأ واضح بعد مهلة قصيرة، والصور اللي ارتفعت ما تنعاد */
  const prog = (dn, n, pc) => { S.upProg = dn >= n ? 'جاري الإرسال…' : 'جاري رفع الصور: ' + dn + ' من ' + n + ' · ' + pc + '%'; const b = document.getElementById('sendb'); if (b) b.textContent = S.upProg; };
  try {
    const d = await callT(240000, 'apiTaskDone', BOOT.token, id, S.cm || '', pf === 'note' ? [] : S.shots, extra, prog);
    S.busy = false; S.upProg = ''; S.doing = null; S.shots = []; S.cm = ''; S.dinv = null;
    renderEmp(d, false); toast('انرسلت، يعطيك العافية');
  } catch (e) {
    S.busy = false; S.upProg = ''; rerenderEmp(); err(e);
  }
}
