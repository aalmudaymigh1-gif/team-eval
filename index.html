<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>إدارة الفريق</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
(function () {
  var emp = /[?&]e=/.test(location.search);
  document.write('<link rel="manifest" href="manifest-' + (emp ? 'emp' : 'admin') + '.json">' +
    '<meta name="apple-mobile-web-app-title" content="' + (emp ? 'صفحتي' : 'إدارة الفريق') + '">');
})();
</script>
<style>
:root{--green-line:#CFE1D5;--red-row:#FDF8F7;
--amber:#C2954A;--amber-soft:#F8F1E4;--slate:#5E6B7D;
--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
svg.i{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:520px;margin:0 auto;padding:12px 18px 0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:30px 2px 4px}
h1{margin:0;line-height:1.35}
.top .sub{margin-top:2px}
.sub{color:var(--muted);font-size:13px}
.rf{width:42px;height:42px;border-radius:var(--r);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s var(--ease),background .15s}
.rf:active{transform:scale(.94);background:var(--fill)}
.rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;white-space:nowrap;cursor:pointer;transition:background .2s var(--ease),color .2s,transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs button.on{background:var(--text);font-weight:600}

#view{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.blk{animation:cardIn .4s var(--ease) both}
.card:nth-child(2),.blk:nth-child(2){animation-delay:.04s}.card:nth-child(3),.blk:nth-child(3){animation-delay:.08s}
.card:nth-child(4),.blk:nth-child(4){animation-delay:.12s}.card:nth-child(n+5),.blk:nth-child(n+5){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.blk{margin-top:20px}
.lab,.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 9px}
.blk>.lab{margin-top:0}
.lab svg,.lbl svg{color:var(--faint)}
.grp{color:var(--muted);font-size:12px;margin:10px 0 6px;font-weight:600}

.card{margin-bottom:12px}
.ctitle{display:flex;align-items:center;gap:8px}
.ctitle .ci{border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.ctitle .sp{margin-right:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row+.row{margin-top:4px}
.hair{border-top:1px solid var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.emp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.emp::-webkit-scrollbar{display:none}
.empi{margin-top:8px;font-size:13px;color:var(--muted)}
.empc{flex:none;border-radius:999px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;transition:all .2s var(--ease)}
.empc:active{transform:scale(.98)}
.empc b{display:block;font-size:15px;font-weight:600}.empc small{color:var(--muted);font-size:12px}

.segc{display:flex;border-radius:var(--r)}
.segc button{font-size:14px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.segc button.on{font-weight:600}

.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.gr{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;position:relative;width:100%;background:none;border:0;text-align:right;cursor:pointer;transition:background .2s}
.gr+.gr:before{content:"";position:absolute;top:0;right:58px;left:0;height:1px;background:var(--line)}
.gr:active{background:var(--fill)}
.gi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.gi.b{background:var(--slate)}.gi.s{background:var(--amber)}
.gr .n{flex:1;font-size:15px}
.gr .n small{display:block;font-size:12px;color:var(--muted)}
.gr.off{background:var(--red-row)}
.mk{flex:none;display:flex;transition:transform .2s var(--ease)}
.mk.ok{color:#4F8463}.mk.no{color:#B05A52}
.gr:active .mk{transform:scale(.85)}
.pill,.badge{font-size:12px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);color:var(--green)}
.pill.r,.badge.late{background:var(--red-soft);color:var(--red)}
.badge.n{background:var(--fill);color:#374151}
.badge.a{background:var(--amber-soft);color:#85642B}

.tg{width:50px;height:30px;border-radius:999px;background:var(--fill2);position:relative;flex:none;border:0;padding:0;cursor:pointer;transition:background .25s var(--ease)}
.tg:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:right .25s var(--ease)}
.tg.on{background:var(--acc)}.tg.on:after{right:23px}
.tg.st.on{background:var(--amber)}

textarea,input{width:100%;border:1.5px solid transparent;color:var(--text);font:inherit;padding:12px 14px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 3px var(--acc-ring)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:60px;resize:none}
input[type=date]{color-scheme:light;margin-top:8px}
.field{margin-bottom:12px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600}

.btn,.btn2{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);cursor:pointer;text-decoration:none;font-weight:600;transition:transform .12s var(--ease),opacity .2s,background .2s}
.btn:active,.btn2:active{transform:scale(.97)}
.btn{width:100%;max-width:484px;margin:0 auto;background:var(--acc);color:var(--acc-ink);border:0;font-size:15px;padding:15px;box-shadow:0 8px 20px rgba(31,58,95,.22)}
.btn2{color:var(--text);font-size:14px;padding:10px 12px}
.btn2.arm{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}

.btn:disabled,.btn2:disabled{opacity:.45}

.dock,.save{position:fixed;left:0;right:0;z-index:6;border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
.dock .in{max-width:484px;margin:0 auto}
.sum{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sum .badge:last-child{margin-right:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--fill);border:1.5px solid transparent;color:var(--text);font-size:14px;border-radius:var(--r);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.chip .ck{display:inline-flex}
.chip.add{background:transparent;border:1.5px dashed var(--line2);color:var(--acc)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kpi{padding:12px 14px}
.kpi .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.kpi .v{line-height:1.3;letter-spacing:-.3px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}

.note{border-radius:var(--r);padding:10px 12px;font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.note svg{margin-top:2px}
.note.good{background:var(--green-soft);color:#3A6249}
.note.bad{background:var(--red-soft);color:#7E3F39}
.note.warn{background:#F8F1E4;color:#85642B}
.note b{font-weight:600}

.ent{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ent:first-child{border-top:0}
.ico{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.ico.s{background:var(--amber-soft);color:var(--amber)}
.ico.m{background:var(--red-soft);color:var(--red)}
.ico.f{background:var(--acc-soft);color:var(--acc)}
.ent .t{flex:1;min-width:0}
.ent .d{color:var(--muted);font-size:12px}
.ent .p{font-size:13px;font-weight:600;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.ent .p.amt{direction:rtl}
.del{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px;display:inline-flex;align-items:center;gap:4px;border-radius:8px}
.del:active{background:var(--fill)}
.del.arm{color:var(--red);font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}.cu{color:var(--acc)}

.tbl{width:100%;font-size:14px;border-collapse:collapse}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:left;white-space:nowrap;font-weight:600}
.tbl tr.tot td{font-weight:600;font-size:15px;border-top:1.5px solid var(--line2);padding-top:11px}
.hist{display:grid;grid-template-columns:1.4fr auto auto auto;gap:8px 14px;font-size:14px;align-items:center}
.hist .h{color:var(--muted);font-size:12px;font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}

.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.load{color:var(--muted);text-align:center;padding:90px 20px}
.load .ei{width:64px;height:64px;border-radius:20px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.link{direction:ltr;font-size:12px;word-break:break-all;color:var(--muted);background:var(--fill);border-radius:10px;padding:10px;margin:10px 0}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:4px 0;cursor:pointer;margin:18px 0 0;display:inline-flex;align-items:center;gap:6px}

.task{border-top:1px solid var(--line);padding:13px 0}
.task:first-of-type{border-top:0}
.task.late b{color:var(--red)}
.task.done b{color:var(--muted);font-weight:500}
.task b{font-weight:600}

.ph{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:var(--r);margin-top:10px;background:var(--fill)}

.mst{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mi{position:relative;width:74px;height:74px;border-radius:12px;background:var(--fill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.mi img{width:100%;height:100%;object-fit:cover}
.mi .x{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.mi.up{outline:1.5px dashed var(--acc)}
.madd{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--acc);font-size:12px;cursor:pointer;text-align:center;line-height:1.3}
.vid{display:block;width:100%;height:440px;border:0;border-radius:var(--r);margin-top:10px;background:var(--fill)}
.mbtn{background:var(--acc-soft);border:0;color:var(--acc);font-size:13px;font-weight:600;border-radius:10px;padding:7px 11px;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:6px}

.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;min-width:0}
.inrow .btn2{flex:none;padding:0 16px}
.prow{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow input{flex:1;min-width:0;padding:10px 12px}
.trow{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.trow .n{flex:1}.trow .n b{display:block;font-size:14px;font-weight:600}.trow .n small{color:var(--muted);font-size:12px}

#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:200% 0}to{background-position:-200% 0}}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:height .15s}
.hide{display:none}
input,textarea,select{font-size:16px}
select{width:100%;border:1.5px solid transparent;color:var(--text);font:inherit;font-size:16px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.sc{display:flex;border:2px solid transparent;cursor:pointer;text-align:right;background:var(--acc-soft);color:var(--acc);transition:transform .12s var(--ease)}
.sc:active{transform:scale(.97)}
.sc b{font-weight:600}.sc span{font-weight:600}
.sc.a{background:var(--amber-soft);color:#85642B}.sc.r{background:var(--red-soft);color:var(--red)}
.sc.on{border-color:currentColor}.sc.z{opacity:.55}

.chip.on.u{border-color:var(--red);background:var(--red-soft);color:var(--red)}

.lnk{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--acc);padding:8px 0 0;cursor:pointer;align-self:flex-start}
.sech{display:flex;align-items:center;gap:8px;font-size:15px;margin:20px 0 2px}
.sech span{font-size:12px;font-weight:600;color:#4B5563;background:var(--fill);border-radius:999px;padding:0 8px}
.sech.a{color:#85642B}.sech.r{color:var(--red)}.sech.m{color:var(--muted)}

.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.th .badge{flex:none}
.tt{font-size:15px;font-weight:600;line-height:1.45}.tt.l{color:var(--red)}.tt.d{color:var(--muted);font-weight:500;text-decoration:line-through}
.tm{font-size:13px;color:var(--muted)}

.btn2.rd{color:var(--red);border-color:var(--red-line);font-weight:600}
.dtog{width:100%;background:none;border:0;text-align:right;font-size:13px;font-weight:600;color:var(--green);padding:16px 0 6px;cursor:pointer}
.fab{position:fixed;left:18px;width:58px;height:58px;border-radius:50%;color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8;padding:0}
.fab.hide{display:none}
#ov{display:none}#ov.on{display:block;position:fixed;inset:0;z-index:20}
.ovl{position:absolute;inset:0;background:rgba(15,20,25,.38);display:flex;flex-direction:column;justify-content:flex-end;animation:ovIn .2s}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow-y:auto;animation:shIn .28s var(--ease)}
.ovl.na,.ovl.na .sheet{animation:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);align-self:center;margin-bottom:4px;flex:none}
@keyframes shIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.shh{font-size:13px;font-weight:600;color:var(--muted)}
.qtt{font-size:17px;font-weight:600;background:transparent;border:0;border-bottom:1.5px solid var(--acc);border-radius:0;padding:8px 2px}
.qtt:focus{background:transparent;box-shadow:none}

.g21{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.g21 .btn2{padding:13px;font-size:15px}
.tg.on.u{background:var(--red)}

.dprops{border:1px solid var(--line);border-radius:var(--r2);margin-top:12px;overflow:hidden}
.dp{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 14px;border-bottom:1px solid var(--line);min-height:52px}
.dp:last-child{border-bottom:0}
.dp>span{color:var(--muted);font-size:14px;flex:none}
.dp select,.dp input{width:auto;max-width:65%;background:transparent;border:0;padding:8px 4px;margin:0;font-weight:600;font-size:15px;text-align:left}
.dp input.lt{color:var(--red)}
.dnote{min-height:84px}

.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;display:block}
.pph{aspect-ratio:1;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.full{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000}
.etabs{margin-top:14px}

.bigdo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;font-size:14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.bigdo:active{transform:scale(.97)}
.note.a2{background:var(--amber-soft);color:#85642B}
.pform{margin-top:12px;background:var(--fill);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pform input{background:var(--surface)}
.pform .btn{box-shadow:none;max-width:none}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:78px;height:78px}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}

.scards{grid-template-columns:repeat(2,minmax(0,1fr))}
.ivr{padding:12px 0;border-bottom:1px solid var(--line)}
.ivr:last-child{border-bottom:0}
.ivr.rv{border:1px solid var(--amber-line,#EBDCBE);border-radius:var(--r2);padding:12px 14px;margin-top:10px;background:var(--surface)}
.iva{font-size:15px;font-weight:600;white-space:nowrap;flex:none}.iva.g{color:var(--green)}.iva.r{color:var(--red)}
.ivr .lnk.dl{color:var(--muted);font-size:13px;padding-top:6px}.ivr .lnk.dl.arm{color:var(--red)}
.shot .x{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:32px;padding:0;cursor:pointer}
video.vid{height:auto;max-height:70vh;background:#000}
.stc{border-radius:16px;padding:14px 16px;margin:12px 0}
.stc .l{font-size:13px;opacity:.85}.stc .v{font-size:17px;font-weight:600;margin:2px 0 6px}.stc .v small{font-size:13px;font-weight:500;opacity:.8}
.stc .r{display:flex;justify-content:space-between;font-size:13px;opacity:.92}
.str{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.str:last-child{border-bottom:0}.str .tm{margin-top:2px}
/* الإصدار 95: السطر اللي ينضغط كان ينشال خطه الفاصل بالغلط (هو آخر عنصر داخل زره دائماً) */
.strb .str{border-bottom:1px solid var(--line)}.strb:last-child .str{border-bottom:0}
/* الإصدار 95: سطور الحركات والفواتير أخف: العنوان 14 متوسط والمبلغ 14 */
.str{font-size:14px;padding:9px 0}.str>span>b:first-child{font-size:14px;font-weight:500!important}.str .iva{font-size:14px}
.str .ed{background:none;border:0;color:var(--muted);padding:4px;cursor:pointer}

/* ---------- نظام التصميم (الإصدار 36): مأخوذ من التطبيق المرجع ---------- */
:root{--bg:#FFFFFF;--surface:#FAFAF9;--fill:#F4F4F2;--fill2:#ECECEA;--line:#EFEFED;--line2:#E4E4E1;--text:#2A2A28;--muted:#8E8E89;--faint:#B9B9B4;
--acc:#7FA3C0;--acc-2:#6A8FAE;--acc-ink:#FFFFFF;--acc-soft:#EDF3F8;--acc-ring:#D3E1EC;--acc-dk:#4F7493;
--green:#4F8463;--green-soft:#EDF4EF;--red:#B05A52;--red-soft:#F9EEEC;--red-line:#EDCFCB;
--r:16px;--r2:24px;--sh:none;--sh2:0 12px 40px rgba(42,42,40,.10)}
html,body,button,input,select,textarea{font-family:-apple-system,BlinkMacSystemFont,'SF Arabic','SF Pro Text','Segoe UI',Roboto,'Noto Sans Arabic',system-ui,sans-serif!important;letter-spacing:0}
body{font-weight:300;padding-bottom:calc(env(safe-area-inset-bottom) + 190px)}
h1{font-size:17px;font-weight:600;letter-spacing:0}
.top{padding-top:34px}
.top .sub{color:var(--acc-dk);font-size:14px;font-weight:400}
.rf{border:0!important;background:none!important;box-shadow:none!important;color:var(--muted)}
/* شريط التنقل تحت */
.tabs{position:fixed!important;top:auto!important;bottom:0;left:0;right:0;margin:0!important;background:#fff!important;border-radius:30px 30px 0 0;box-shadow:0 -6px 30px rgba(42,42,40,.06);gap:0!important;justify-content:space-between}
.tabs button{background:none!important;color:var(--faint)!important;font-size:0!important;position:relative;border-radius:0!important}
.tabs button svg{stroke-width:1.5}
.tabs button.on{color:var(--text)!important}
.tabs button.on:after{content:'';position:absolute;bottom:0;left:50%;border-radius:50%;background:var(--acc)}
.dock,.save{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* البطاقات */
.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:none;padding:18px}
.ctitle{font-weight:500;font-size:15px}
.ctitle .ci{background:none!important;color:var(--muted)!important;width:auto;height:auto}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px}
.kpi.hero{background:#fff!important;color:var(--text)!important;border:1px solid var(--line)}
.kpi.hero .k{color:var(--muted)!important}
.kpi.hero .v small{color:var(--acc-dk)!important}

.tbrk{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 14px}

.tst b{font-weight:400!important}
/* الأزرار والكبسولات */
.empc,.dedch button,.wchips button{border:1px solid var(--line2)!important;background:#fff!important;color:var(--muted)!important;font-weight:400!important;padding:8px 20px!important}
.empc.on,.dedch button.on,.wchips button.on{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important}
.segc{background:none!important;padding:0!important;gap:8px!important;justify-content:flex-start}
.segc button{flex:0 0 auto!important;border:1px solid var(--line2)!important;background:#fff!important;border-radius:999px!important;padding:8px 20px!important;color:var(--muted)!important;font-weight:400!important}
.segc button.on{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important;box-shadow:none!important}
.segc.wr{flex-wrap:wrap}
.btn2{border-radius:999px!important;border:1px solid var(--line2)!important;background:#fff;font-weight:400}
.btn2.cu,.bigdo,.save .btn,.dock .btn{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important;border-radius:18px!important;font-weight:500!important}
.badge,.pill{font-weight:500;border-radius:999px}
.badge.wait{background:var(--acc-soft);color:var(--acc-dk)}
.attgo{background:var(--acc)!important;border-radius:var(--r2)!important}
.stc{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--line2)}
.gban{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--line2)!important;box-shadow:none!important}
.gbi{background:var(--acc-soft)!important;color:var(--acc-dk)}
.gbt small{color:var(--muted)!important;opacity:1}
.note.info{background:var(--fill);color:var(--muted)}
.sech{font-weight:500}
.ent{border-top-color:var(--line)}
input,textarea,select{border-radius:16px!important;background:#fff!important}
.ti{border-radius:22px}
.gi{background:var(--fill)!important;color:var(--muted)!important}
.dock{background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 38%)!important;padding-top:26px!important}
.fab{background:var(--acc)!important;box-shadow:0 8px 24px rgba(79,116,147,.30)!important}
.mn{display:inline-flex;align-items:center;gap:.22em;white-space:nowrap;direction:ltr;unicode-bidi:isolate;color:var(--text)!important;font-size:15px;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums;vertical-align:baseline}
span.mn.mn{color:var(--text)!important;opacity:1}
span.mn.mn.pos{color:var(--green)!important}
span.mn.mn.neg{color:var(--red)!important}
.mn .rs{height:.78em;width:auto;flex:none;opacity:.9}
.mn.big{font-size:17px;font-weight:500;gap:.2em}
.kpi .v{font-size:17px!important;font-weight:500!important}
.mn.big .rs{height:.66em}
.mn.t{font-size:inherit;font-weight:500}
.kpi .v,.stc .v,.ivd .amt{color:var(--text)!important}
.tvseg{margin:14px 0 4px}

.kpi .v small.gstar,.kpi .k .gstar{color:var(--amber)!important}.kpi .k .gstar{display:inline-flex}
.vrec{margin-top:10px;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line2);border-radius:14px;padding:12px 14px;color:var(--acc-dk);font:inherit;font-size:14px;font-weight:500;background:none;width:100%;cursor:pointer;text-align:start}
.vrec.on{border:1px solid var(--red);color:var(--red);background:var(--red-soft);cursor:default}
.vrec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:vpulse 1s infinite}
@keyframes vpulse{50%{opacity:.3}}
.vrec .tm{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--text)}.vrec .tm.h{color:var(--faint);font-size:12px}
.vrec .stp{background:var(--red);color:#fff;border:0;border-radius:999px;padding:6px 16px;font:inherit;font-size:13px;cursor:pointer}

.lsel{width:auto;min-width:118px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--text)}

/* الإصدار 102: التصميم «فاتح وناعم بألوان مطفية». طبقة مظهر فوق كل ما قبلها: نفس العناصر والمحتوى، ألوان وأشكال فقط */
html:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--fill:#F4F5F6;--fill2:#E9EBED;--line:#EFF0F2;--line2:#E0E3E6;
  --text:#252A31;--muted:#62676E;--faint:#6A6F76;
  --acc:#557896;--acc-2:#4F7391;--acc-dk:#3F617E;--acc-ink:#FFFFFF;--acc-soft:#EAF0F5;--acc-ring:#CFDAE4;
  --green:#44705A;--green-soft:#EAF2ED;--red:#9C5048;--red-soft:#F7ECEA;--red-line:#EBD5D2;
  --amber:#7D6236;--amber-soft:#F5EFE2;
  --r:16px;--r2:24px;
  --el:0 1px 2px rgba(37,42,49,.04),0 6px 20px rgba(37,42,49,.07);
}
html:root,html:root body{background:var(--bg)!important;color:var(--text)}
html:root body{font-weight:400!important;line-height:1.6}

/* ===== الرأس ===== */
html:root .top{padding:22px 2px 8px!important;align-items:center}

html:root .bellb,html:root .rf{width:44px!important;height:44px!important;border-radius:50%!important;background:var(--fill)!important;border:0!important;color:var(--text)!important}
html:root .bellb i{background:var(--red);font-weight:600}
html:root .top .back{color:var(--acc-dk)!important;font-size:13px;font-weight:500}
html:root .topr{gap:8px}

/* ===== شريط التنقل السفلي: كبسولة عايمة بأسماء التبويبات ===== */
html:root .tabs{left:12px!important;right:12px!important;bottom:max(10px,env(safe-area-inset-bottom))!important;border-radius:28px!important;border:0!important;box-shadow:0 2px 6px rgba(37,42,49,.06),0 12px 32px rgba(37,42,49,.14)!important;padding:6px!important;background:rgba(255,255,255,.97)!important;gap:2px!important}
html:root .tabs button{font-size:12px!important;color:var(--muted)!important;padding:6px 0 5px!important;gap:2px!important;min-height:52px;font-weight:400;border-radius:22px!important}
html:root .tabs button svg{width:22px;height:22px;stroke-width:1.7}
html:root .tabs button.on{color:var(--acc-dk)!important;font-weight:600!important;background:var(--acc-soft)!important}
html:root .tabs button.on:after{display:none!important}
html:root .fab{border-radius:50%!important;background:var(--acc)!important;box-shadow:0 10px 26px rgba(63,97,126,.28)!important}
html:root .dock,html:root .save{bottom:calc(78px + env(safe-area-inset-bottom))!important}

/* ===== العناوين الفرعية والنصوص ===== */
html:root .lbl,html:root .lab{color:var(--muted);font-size:13px;font-weight:600;margin:22px 4px 10px}
html:root .lbl svg,html:root .lab svg{color:var(--acc)}
html:root .sech{font-size:15px;font-weight:600;margin:24px 4px 8px}
html:root .sub{color:var(--muted)}
html:root .shh{color:var(--text);font-size:15px;font-weight:600}
html:root .field span{color:var(--muted);font-weight:500;font-size:13px}
html:root .mn{font-weight:600}
html:root .empty{color:var(--muted)}
html:root .tm,html:root .rpm2,html:root .rpmeta,html:root .fxh span,html:root .fxt,html:root .ent .d,html:root .gr .n small,html:root .tkt,html:root .rhint,html:root .empi,html:root .tbh2,html:root .dyh span{color:var(--muted)}

/* ===== البطاقات: بدون حدود ثقيلة، بظل خفيف ===== */
html:root .card,html:root .rpcard,html:root .tfc,html:root .tbl2,html:root .gcard,html:root .dprops,html:root .lbox,html:root .rpc,html:root .tbrk{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:24px!important;box-shadow:var(--el)!important}
html:root .card{padding:18px}

/* ===== الأزرار: دائرية ===== */
html:root .btn{border-radius:999px!important;min-height:52px;padding:13px 18px!important;font-size:15px!important;font-weight:600!important;box-shadow:0 8px 22px rgba(63,97,126,.22)!important;background:var(--acc)!important;color:#fff!important}
html:root .btn2{border-radius:999px!important;min-height:44px;font-weight:500!important;border:0!important;background:var(--fill)!important;color:var(--text)}
html:root .btn2.cu,html:root .bigdo,html:root .save .btn,html:root .dock .btn{border-radius:999px!important;font-weight:600!important;background:var(--acc)!important;color:#fff!important;box-shadow:0 6px 16px rgba(63,97,126,.20)!important}

html:root .lnk{color:var(--acc-dk)!important;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
html:root .mbtn{min-height:44px;border-radius:999px;color:var(--acc-dk);background:var(--acc-soft);font-weight:500;padding:0 14px}
html:root .del{color:var(--muted);min-height:44px;min-width:44px;justify-content:center;border-radius:50%}
html:root .del.arm{color:var(--red)}
html:root .fxt button,html:root .fseg .ordb,html:root .rchb{color:var(--acc-dk)!important;min-height:44px;font-weight:500}
html:root .fxt button.dn,html:root .rchb.dn.fl{background:var(--acc)!important;color:#fff!important;border-radius:999px!important}
html:root .tbh .rate{height:44px!important;border-radius:999px!important;background:var(--acc)!important;font-weight:600;box-shadow:0 6px 16px rgba(63,97,126,.20)}
html:root .lnkb{width:44px!important;height:44px!important;border-radius:50%!important;border:0!important;background:var(--acc-soft)!important;color:var(--acc-dk)!important}
html:root .tbr .ord button{width:44px;height:44px;border-radius:50%}

/* ===== مفتاح التبديل: مسار دائري والمختار أبيض بنص أزرق ===== */
html:root .segc{background:var(--fill)!important;padding:4px!important;gap:2px!important;border-radius:999px!important;justify-content:stretch}
html:root .segc button{flex:1 1 0!important;border:0!important;background:none!important;border-radius:999px!important;padding:0 8px!important;min-height:44px;color:var(--muted)!important;font-weight:500!important;font-size:14px}
html:root .segc button.on{background:var(--surface)!important;color:var(--acc-dk)!important;font-weight:600!important;box-shadow:0 1px 2px rgba(37,42,49,.06),0 3px 10px rgba(37,42,49,.10)!important}
html:root .fseg .segc{flex:1;max-width:260px}

/* ===== شرائح الاختيار: دائرية، والمختار خلفية فاتحة ونص أزرق ===== */
html:root .segc.wr{background:none!important;padding:0!important;gap:8px!important}
html:root .empc,html:root .qch button,html:root .wchips button,html:root .dedch button,html:root .segc.wr button,html:root .chip{flex:0 0 auto!important;border-radius:999px!important;min-height:44px;padding:0 16px!important;border:1.5px solid transparent!important;background:var(--fill)!important;color:var(--text)!important;font-weight:500!important;font-size:14px!important;display:inline-flex;align-items:center;justify-content:center;box-shadow:none!important}
html:root .qch button{min-height:40px}
html:root .empc.on,html:root .qch button.on,html:root .wchips button.on,html:root .dedch button.on,html:root .segc.wr button.on,html:root .chip.on{background:var(--acc-soft)!important;border-color:var(--acc)!important;color:var(--acc-dk)!important;font-weight:600!important}
html:root .qch button.nw,html:root .chip.add{background:transparent!important;border:1.5px dashed var(--line2)!important;color:var(--acc-dk)!important}
html:root .chip.on.u{background:var(--red-soft)!important;border-color:var(--red)!important;color:var(--red)!important}
html:root .qch,html:root .emp.wr{gap:8px}
html:root .qlab{color:var(--muted);font-weight:600;font-size:13px;margin:8px 4px -2px}

/* ===== الحقول: معبّاة ناعمة بدون إطار ===== */
html:root input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),html:root select,html:root textarea{border:1.5px solid transparent!important;background:var(--fill)!important;border-radius:16px!important;color:var(--text);min-height:48px}
html:root input::placeholder,html:root textarea::placeholder{color:var(--faint);opacity:1}
html:root .dp select,html:root .dp input,html:root .dprops input,html:root .dprops select{background:transparent!important;min-height:44px}
html:root .dp input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),html:root .dprops input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]){background:transparent!important}
html:root .qtt{padding:10px 14px!important;font-size:17px;font-weight:600}
html:root .fvf select{border-radius:999px!important;min-height:44px;padding:0 12px}
html:root .sheet .crow input,html:root .sheet .lrow input,html:root .prow input{min-height:44px}
html:root .vrec{border:0!important;border-radius:16px!important;min-height:48px;color:var(--text)!important;background:var(--fill)}
html:root .vrec svg{color:var(--acc)}
html:root .pform{background:var(--fill);border-radius:20px}
html:root .pform input,html:root .pform select,html:root .pform textarea,html:root .card input:not([type=checkbox]):not([type=radio]):not([type=file]),html:root .card select,html:root .card textarea{background:var(--fill)!important}
html:root .pform input:not([type=checkbox]):not([type=radio]):not([type=file]),html:root .pform select,html:root .pform textarea{background:var(--surface)!important}
html:root .err{color:var(--red)}

/* ===== النوافذ السفلية ===== */
html:root .sheet{border-radius:32px 32px 0 0!important;padding:10px 20px calc(20px + env(safe-area-inset-bottom))!important;gap:12px;max-height:92vh}
html:root .sheet h3{font-size:17px;font-weight:600}
html:root .grab{width:44px;height:5px;background:var(--fill2)}

/* ===== المهام ===== */
html:root .scards{gap:10px;margin-top:14px}
html:root .sc{border-radius:22px!important;min-height:58px!important;border:0!important}
html:root .sc.z{opacity:.8}
html:root .sc b{font-size:17px!important;font-weight:600}
html:root .sc span{font-weight:500!important}
html:root .sc:not(.a):not(.r){color:var(--acc-dk)}

html:root .dtog{color:var(--green);min-height:44px}

/* ===== بطاقات الأرقام: خلفية فاتحة بدون حدود ===== */
html:root .kpi,html:root .fxs div,html:root .fxs button.due{background:var(--fill)!important;border:0!important;border-radius:20px!important;box-shadow:none!important}
html:root .fxs button.due,html:root .fxs div.due{background:var(--red-soft)!important}
html:root .fxs b,html:root .kpi .k{color:var(--muted)!important;font-size:12px;font-weight:500!important}
html:root .fxs div.due b,html:root .fxs button.due b,html:root .fxs div.due small,html:root .fxs button.due small{color:var(--red)!important}
html:root .fxs small,html:root .kpi .v small{color:var(--faint)!important}
html:root .kpi .v,html:root .fxs .tv{font-weight:600!important;font-size:17px!important}

/* ===== القوائم داخل البطاقات ===== */
html:root .tbr{min-height:58px;padding:0 16px}
html:root .tbr .ic,html:root .gi{background:var(--acc-soft)!important;color:var(--acc-dk)!important;border-radius:50%;width:34px;height:34px}
html:root .tbr .k,html:root .gr .n,html:root .str .tt,html:root .str b{font-weight:500}
html:root .tbr .v{color:var(--muted)}
html:root .tbr .ch{color:var(--faint)}
html:root .tbh .n b{font-size:17px;font-weight:600}
html:root .tbh .n span,html:root .tbh .n .ls{color:var(--muted)}

html:root .tfile .fxbt button{border-radius:20px!important;border:0!important;background:var(--fill)!important;font-weight:500}
html:root .dyh b{font-size:14px;font-weight:600}
html:root .rst span{border-radius:999px;color:var(--text);background:var(--fill);border:0}
html:root .ibell{border-radius:50%;background:var(--fill)}

/* ===== الملاحظات والوسوم ===== */
html:root .note{border-radius:18px}
html:root .note.good{background:var(--green-soft);color:#3B5A48}
html:root .note.bad{background:var(--red-soft);color:#7A3F39}
html:root .note.warn,html:root .note.a2{background:var(--amber-soft);color:#5E4A28}
html:root .note.info{background:var(--fill);color:var(--muted)}
html:root .tg2,html:root .badge,html:root .pill,html:root .rchip{border-radius:999px!important;font-weight:500}
html:root .tg2.a,html:root .rchip.dec,html:root .badge.a,html:root .cb,html:root .sc.a{color:#5E4A28!important}
html:root .badge.n{color:var(--text)}
html:root .badge.wait,html:root .wb{color:var(--acc-dk)}
html:root .gb{color:#3B5A48}
html:root .wl.soon{color:var(--amber)}
html:root .wl.end{color:var(--muted)}
html:root .attc{border-radius:24px}
html:root .tg.on{background:var(--acc)}

/* ===== متفرقات ===== */
html:root .etabs.e4 button .nb{background:var(--fill2);color:var(--text)}
html:root .etabs.e4 button.on .nb{background:var(--acc-soft)!important;color:var(--acc-dk)!important}

html:root .tro{color:var(--acc-dk)}
html:root .pushb{background:var(--acc-soft);border-radius:24px;padding:14px 16px}html:root .pushb .ph1{color:var(--acc-dk)}html:root .pushb p{color:var(--muted)}html:root .pushb .later{min-height:44px}

html:root .btn2.rd{background:var(--red-soft)!important;color:var(--red)!important;font-weight:600!important}

/* ألوان ثابتة في كود التطبيق تتطفى مع الباقي */

  ios: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  standalone: window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches),
  busy: false
};
function pushLater() { try { localStorage.setItem('pushLater', String(Date.now())); } catch (e) {} redrawAny(); }
function pushSnoozed() { try { return Date.now() - Number(localStorage.getItem('pushLater') || 0) < 3 * 864e5; } catch (e) { return false; } }
function pushHtml() {
  if (PUSH.ok) {
    if (Notification.permission !== 'default') return '';
    return `<div class="pushb"><div class="ph1">${I('bell', 20)}<div><b>فعّل الإشعارات</b><p>${BOOT.page === 'admin' ? 'لتصلك التقارير والفواتير أولاً بأول' : 'لتصلك التقارير والتنبيهات أولاً بأول'}</p></div></div>
      <button class="bigdo" onclick="enablePush()">${PUSH.busy ? 'لحظة…' : 'فعّلها'}</button></div>`;
  }
  if (!PUSH.ios || PUSH.standalone || pushSnoozed()) return '';
  return `<div class="pushb"><div class="ph1">${I('bell', 20)}<div><b>لتصلك الإشعارات</b><p>من Safari اضغط زر المشاركة، بعدها «إضافة إلى الشاشة الرئيسية»، وافتح التطبيق من الأيقونة.</p></div></div>
    <button class="later" onclick="pushLater()">لاحقاً</button></div>`;
}
function b64u(s) {
  const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function pushSubscribe() {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(await API.pushKey())});
  await API.pushSave(BOOT.page === 'admin' ? BOOT.key : BOOT.token, BOOT.page, sub.toJSON());
}
async function enablePush() {
  if (PUSH.busy) return;
  PUSH.busy = true;
  try {
    const p = await Notification.requestPermission();
    if (p !== 'granted') throw new Error('لم يُسمح بالإشعارات. يمكنك تفعيلها من إعدادات الجوال');
    redrawAny();
    await pushSubscribe();
    toast('تفعّلت الإشعارات');
  } catch (e) { toastErr(e); }
  PUSH.busy = false;
  redrawAny();
}
if ('serviceWorker' in navigator && BOOT.page !== 'denied') {
  navigator.serviceWorker.register('sw.js').then(() => {
    if (PUSH.ok && Notification.permission === 'granted') pushSubscribe().catch(() => {});
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => {
    if (!ev.data) return;
    if (ev.data.type === 'open') { nfFromPush(ev.data.t || '', ev.data.b || ''); return; }
    if (ev.data.type === 'refresh' && typeof refresh === 'function') refresh();
  });
}

function snapCam() {

function call(fn, ...args) { return callT(30000, fn, ...args); }
/* الإصدار 74: عمليات الحفظ ما تعطي «فشل» بعد 30 ثانية، تنتظر الرد. والضغطة الثانية على نفس العملية وهي ماشية ما تسوي شي */
const READ_FN = ['apiAdmin', 'apiEmp', 'apiPreview', 'apiInvImgAdmin', 'apiInvImgEmp', 'apiFileUrls', 'apiRepList', 'apiNotifs', 'attPhoto', 'apiCleanup', 'pushKey', 'apiUploadImg', 'apiRepUpload', 'apiAdminLogin', 'apiAlertSeen'];
const INFL = {};
function callT(ms, fn, ...args) {
  const write = READ_FN.indexOf(fn) < 0;
  let key = '';
  if (write) {
    try { key = fn + '|' + JSON.stringify(args); } catch (e) { key = ''; }
    if (key && INFL[key]) return new Promise(() => {});
    if (key) INFL[key] = 1;
  }
  setBusy(1);
  const ld = LD_MSG[fn] ? toastLoad(LD_MSG[fn]) : null;
  return new Promise((res, rej) => {
    let done = false, slow = null, t2 = null;
    const fin = () => { done = true; clearTimeout(t); clearTimeout(t2); if (key) delete INFL[key]; setBusy(-1); toastDone(ld); toastDone(slow); };
    const t = setTimeout(() => {
      if (done) return;
      if (write) { slow = toastLoad('الاتصال بطيء، ما زلت أنتظر الرد…'); return; }
      fin(); rej('الاتصال تأخر، اسحب الصفحة للأسفل أو اضغط ↻');
    }, ms);
    if (write) t2 = setTimeout(() => { if (done) return; fin(); rej('لم يصل الرد بعد. أعد المحاولة، ولن يتكرر الحفظ'); }, Math.max(ms, 120000));
    Promise.resolve().then(() => API[fn](...args))
      .then(v => {
        if (done) return; fin(); res(v);
        if (v && v.__dup) setTimeout(() => toast('وصل من المحاولة الأولى، ولم يتكرر', null, 'in'), 900);
        if (v && v.__stale) setTimeout(() => toastErr('تم الحفظ، وتعذّر تحديث الصفحة. اسحب الصفحة للأسفل للتحديث'), 900);
      })
      .catch(e => { if (done) return; fin(); rej(e && e.message ? e.message : String(e)); });
  });
}

function lockBtn(txt) {
  const ev = window.event, b = ev && ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if (!b) return () => {};
  const h = b.innerHTML; b.disabled = true; b.innerHTML = txt || 'جاري الحفظ…';
  return () => { if (b.isConnected) { b.disabled = false; b.innerHTML = h; } };
}

const TST = [];
const TST_IC = {ok: 'check', er: 'x', in: 'info'};
function tHtml(t) {
  return `<span class="tic">${t.type === 'ld' ? '' : I(TST_IC[t.type], 14, 3)}</span><span class="ttx"><b>${esc(t.msg)}</b>${t.desc ? `<small>${esc(t.desc)}</small>` : ''}</span>${t.undo ? '<button class="tab">تراجع</button>' : ''}`;
}
function tPaint(t) {
  t.el.className = 'ti ' + t.type;
  t.el.innerHTML = tHtml(t);
  const b = t.el.querySelector('.tab');
  if (b) b.onclick = ev => { ev.stopPropagation(); const f = t.undo; tKill(t); f(); };
}
function tLay() {
  TST.forEach((t, i) => {
    t.el.style.transform = 'translateY(' + (i * 10) + 'px) scale(' + (1 - i * 0.05) + ')';
    t.el.style.opacity = i > 2 ? 0 : 1;
    t.el.style.zIndex = 60 - i;
    t.el.style.pointerEvents = i ? 'none' : 'auto';
  });
}
function tKill(t) {
  const i = TST.indexOf(t);
  if (i < 0) return;
  TST.splice(i, 1);
  clearTimeout(t.h);
  t.el.style.transform = 'translateY(-110%) scale(.92)';
  t.el.style.opacity = 0;
  setTimeout(() => t.el.remove(), 450);
  tLay();
}
function tTime(t) { clearTimeout(t.h); if (t.type !== 'ld') t.h = setTimeout(() => tKill(t), t.undo ? 6000 : t.type === 'er' ? 4500 : 2600); }
function tNew(type, msg, desc, undo) {
  const box = $('#tst');
  const t = {type, msg: String(msg == null ? '' : msg), desc: desc || '', undo: undo || null, el: document.createElement('div')};
  tPaint(t);
  t.el.style.transform = 'translateY(-110%) scale(.92)';
  t.el.style.opacity = 0;
  t.el.onclick = () => { if (t.type !== 'ld') tKill(t); };
  box.appendChild(t.el);
  TST.unshift(t);
  requestAnimationFrame(() => requestAnimationFrame(tLay));
  tTime(t);
  return t;
}
function toast(msg, undo, type, desc) {
  type = type || 'ok';
  const ld = TST.find(t => t.type === 'ld' && t.fin);
  if (ld) {
    Object.assign(ld, {type, msg: String(msg == null ? '' : msg), desc: desc || '', undo: undo || null, fin: false});
    tPaint(ld);
    ld.el.animate([{transform: ld.el.style.transform + ' scale(1.05)'}, {transform: ld.el.style.transform}], {duration: 380, easing: 'cubic-bezier(.34,1.56,.64,1)'});
    tTime(ld);
    return ld;
  }
  const same = !undo && TST.find(t => t.type === type && t.msg === String(msg == null ? '' : msg) && (t.desc || '') === (desc || ''));
  if (same) { same.n = (same.n || 1) + 1; tPaint(same); tTime(same); same.el.animate([{opacity: .6}, {opacity: 1}], {duration: 220}); return same; }
  return tNew(type, msg, desc, undo);
}
function toastErr(e) {
  const m = String(e && e.message ? e.message : e == null ? '' : e);
  const i = m.indexOf('، ');
  return i > 0 && i < 40 ? toast(m.slice(0, i), null, 'er', m.slice(i + 2)) : toast(m, null, 'er');
}
function toastLoad(msg) { return tNew('ld', msg); }
function toastDone(t) { if (!t) return; t.fin = true; setTimeout(() => { if (t.type === 'ld') tKill(t); }, 700); }
function toastClear() { TST.slice().forEach(tKill); }

function zoomClose() { const z = $('#zv'); if (z) z.remove(); document.documentElement.classList.remove('zlock'); }
function zoomBind(z) {

  const mid = t => ({x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2});
  const begin = t => {
    if (t.length === 2) st = {k: 'p', d: dist(t) || 1, s: s, tx: tx, ty: ty, m: mid(t)};
    else if (t.length === 1 && s > 1) st = {k: 'm', x: t[0].clientX, y: t[0].clientY, tx: tx, ty: ty};

  z.addEventListener('touchmove', e => {
    if (!st) return;
    e.preventDefault();
    const t = e.touches;
    if (st.k === 'p' && t.length === 2) {
      const r = z.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, m = mid(t);
      const qx = (st.m.x - cx - st.tx) / st.s, qy = (st.m.y - cy - st.ty) / st.s;
      s = Math.min(6, Math.max(1, st.s * dist(t) / st.d));
      tx = m.x - cx - s * qx; ty = m.y - cy - s * qy;
      apply();
    } else if (st.k === 'm' && t.length === 1) {
      tx = st.tx + t[0].clientX - st.x; ty = st.ty + t[0].clientY - st.y;
      apply();
    }
  }, {passive: false});
  const end = e => {
    if (e.touches.length) return begin(e.touches);

  };

  z.addEventListener('touchcancel', end);
  z.addEventListener('gesturestart', e => e.preventDefault());
  z.addEventListener('click', e => { if (e.target === z && s === 1) zoomClose(); });
}

function csvCell(v) { let s = String(v == null ? '' : v).replace(/\s*[\r\n]+\s*/g, ' '); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
function exportCsv(k, scope) {
  const mk = S.data.today.slice(0, 7), PB = {card: 'بطاقتي', own: 'من حسابه الخاص', cash: 'العهدة'};
  const list = S.data.inv.items.filter(x => x.kind === 'inv' && x.status === 'ok' && (x.project || '') === k && (scope !== 'm' || x.ts.slice(0, 7) === mk)).sort((a, b) => a.ts < b.ts ? -1 : 1);

async function pay(emp, month) {
  const k = 'pay_' + emp + month;
  if (S.armed !== k) { S.armed = k; renderFin(); return; }
  const v = $('#pay_' + emp + month).value, dt = ($('#pd_' + emp + month) || {}).value || '';
  /* الإصدار 92: المبلغ أقل من الباقي له: الافتراضي يتسجل دفعة والشهر يبقى مفتوح، وإقفال الشهر بالمبلغ الناقص يحتاج اختيار صريح */
  const pe = empById(emp), pu = pe && (pe.unpaid || []).find(u => u.month === month), need = pu ? Math.max(0, Math.round((pu.net - (pu.credit || 0)) * 100) / 100) : 0, nv = API.parseAmt(v);
  if (!pay.force && pu && nv > 0 && nv < need - 0.005) {
    const fm = n => (Math.round(n * 100) / 100).toLocaleString('en-US');
    S.payq = {emp, month, v: nv, dt};
    return ovOpen(`<label class="shh">المبلغ أقل من المتبقي له</label>
      <div class="sub" style="margin:-6px 0 10px">راتب ${esc(pu.label)}: المتبقي له ${fm(need)}، وكتبت ${fm(nv)}.</div>
      <button class="btn2 cu qbig" onclick="payPart()">${I('hand-coins', 17)}سجّلها دفعة</button>
      <div class="sub" style="margin:4px 0 12px">يتسجل ${fm(nv)} دفعة من الراتب، ويبقى له ${fm(need - nv)} والشهر مفتوح.</div>
      <button class="btn2 rd qbig" onclick="payClose()">اصرف ${fm(nv)} وأقفل الشهر</button>
      <div class="sub" style="margin:4px 0 12px">يُقفل الشهر بحالة «مصروف»، والفرق ${fm(need - nv)} لا يُحتسب له بعد ذلك.</div>
      <div class="err" id="pqerr"></div>
      <button class="btn2" style="width:100%" onclick="S.payq=null;S.armed=null;ovClose();renderFin()">إلغاء</button>`);
  }
  pay.force = false;
  lockBtn('جاري تسجيل الصرف…');
  try { S.data = await call('apiPay', BOOT.key, {emp, month, amount: v, date: dt}); S.armed = null; if (S.pd) delete S.pd[emp + month]; if (S.pv) delete S.pv[emp + month]; renderAdmin(); toast('تسجل الصرف' + (dt && dt !== S.data.today ? ' بتاريخ ' + dmy(dt) : '')); }
  catch (e) { S.armed = null; renderFin(); toastErr(e); }
}

async function payPart() {
  const q = S.payq; if (!q) return;

    S.data = await call('apiSalPart', BOOT.key, {emp: q.emp, amount: q.v, date: q.dt, month: q.month, note: ''}); S.payq = null; S.armed = null; if (S.pd) delete S.pd[q.emp + q.month]; if (S.pv) delete S.pv[q.emp + q.month]; ovClose(); renderAdmin();
    const e = empById(q.emp); toast('تم حفظ الدفعة، والمتبقي ' + ((e && e.sal ? e.sal.left : 0)).toLocaleString('en-US'));

function payClose() { const q = S.payq; if (!q) return; S.payq = null; ovClose(); S.armed = 'pay_' + q.emp + q.month; pay.force = true; return pay(q.emp, q.month); }
function txText(t) {

function txHtml(t, canDelete) {

/* الإصدار 131: صفحة الراتب عندي: الملخص، وتحته الأزرار مباشرة، وقائمة شهور وحدة (كل شهر سطر بحالته وشريطه، والمختار مفتوح بتفاصيله و«تم الصرف»)،
   والشهور المسددة مطوية، والسلف. «سجل الدفعات» و«حركات الراتب» تحت «السجل» مطويين (حركات الراتب في renderFinEmp) */
function salAdminHtml(e, f) {
  const st = e.sal || {}, n = x => Math.round(x * 100) / 100, today = S.data.today, unp = e.unpaid || [];
  let h = '';
  if (st.show) {
    const fut = unp.filter(u => !(u.due && u.due <= today)).map(u => ({u, v: n(Math.max(0, u.net - (u.credit || 0)))})).filter(x => x.v > 0);

    const nx = fut.length && st.left > 0 && late >= 0 ? `<div class="sub slnx">${late > 0 ? 'المتأخر حالياً <b>' + late.toLocaleString('en-US') + '</b> · و' : 'لا يوجد متأخر · '}${fut.map(x => x.v.toLocaleString('en-US') + ' راتب ' + esc(x.u.label) + (x.u.due ? ' يستحق ' + esc(dueL(x.u.due)) : '')).join('، ')}</div>` : '';
    h += `<div class="card slc">${ctitle('receipt', 'كشف المستحقات والدفعات')}
    <div class="slst"><div><b>إجمالي المستحق</b><div class="v">${M(st.due)}</div></div><div><b>المدفوع</b><div class="v pos">${M(st.paid)}</div></div><div><b>المتبقي</b><div class="v ${st.left > 0 ? 'neg' : 'pos'}">${M(st.left)}</div></div></div>${nx}</div>`;
  }
  const act = f ? formHtml(e, f) : salActHtml(e).replace(/<div class="hair"><\/div>$/, '');
  if (act) h += `<div class="card slac">${act}</div>`;
  const uBy = {}; unp.forEach(u => { uBy[u.month] = u; });
  const pmU = unp.length ? (unp.find(u => S.fx.pm === e.id + u.month) || unp.find(u => S.armed === 'pay_' + e.id + u.month) || unp[0]) : null;
  const ms = st.show ? st.months.slice() : [];
  unp.forEach(u => { if (!ms.some(m => m.month === u.month)) ms.push({month: u.month, label: u.label, due: Math.max(0, u.net), paid: u.credit || 0, left: n(Math.max(0, u.net - (u.credit || 0))), closed: false}); });
  ms.sort((a, b) => a.month < b.month ? -1 : a.month > b.month ? 1 : 0);
  const isCl = m => m.closed || (!uBy[m.month] && m.left <= 0);
  const head = m => {
    const u = uBy[m.month], ds = u ? dueState(u, today) : '', pc = m.due > 0 ? Math.round(m.paid / m.due * 100) : 100;
    const stc = m.closed || m.left <= 0 ? ['g', m.closed ? 'مسدد' : 'لا شيء'] : m.paid > 0 ? ['a', 'جزئي'] : ['', 'غير مسدد'];
    return `<div class="h"><b>راتب ${esc(m.label)}</b>${u ? `<span class="sltg ${ds === 'late' ? 'w' : ds === 'today' ? 'a' : ''}">${ds === 'late' ? 'متأخر' : ds === 'today' ? 'مستحق اليوم' : 'لم يُصرف'}</span>` : ''}<span class="sltg ${stc[0]}">${stc[1]}</span></div>
        <div class="s"><span>مستحق ${M(m.due, '', 't')} · مدفوع ${M(m.paid, '', 't')}</span><span>${m.closed ? (m.via ? 'سُدّد بالدفعات' : 'صُرف') + (m.date ? ' ' + dmy(m.date) : '') : 'المتبقي ' + M(m.left, '', 't')}</span></div>
        <div class="slbar"><i class="${!m.closed && m.paid > 0 ? 'p' : ''}" style="width:${pc}%"></i></div>`;
  };
  const row = m => {
    const u = uBy[m.month];
    if (u && pmU && u.month === pmU.month) return `<div class="slm on">${head(m)}</div><div class="slpay">${payHtml(e, u, true)}</div>`;
    if (u) return `<button class="slm slmb" onclick="S.fx.pm='${e.id}${u.month}';S.armed=null;renderFin()" aria-label="راتب ${esc(m.label)}">${head(m)}</button>`;
    return `<div class="slm">${head(m)}</div>`;
  };
  const op = ms.filter(m => !isCl(m)), cl = ms.filter(isCl), fold = cl.length > 1 && !S.fx.cm;
  h += `<div class="card slms2">${ctitle('calendar', 'الشهور')}
    ${op.map(row).join('')}${!unp.length ? `<div class="row" style="margin-top:8px"><b>الراتب</b><span class="badge">${I('check', 12, 3)} كل الرواتب مصروفة</span></div>` : ''}
    ${cl.length > 1 ? `<button class="dtog" style="padding:10px 0 6px" onclick="S.fx.cm=!S.fx.cm;renderFin()" aria-expanded="${!fold}">شهور مسددة (${cl.length})${fold ? '' : ' · إخفاء'}</button>` : ''}${fold ? '' : cl.map(row).join('')}
    ${e.loans.length ? `<div class="hair"></div><div class="lbl" style="margin-top:0">${I('hand-coins', 14)}السلف</div>
      ${e.loans.map(l => `<div class="row"><span>سلفة ${sar(l.amount)} <span class="sub">· ${dmy(l.date)}</span></span><span class="sub">المتبقي ${sar(l.remaining)}</span></div>`).join('')}` : ''}</div>`;
  return h;
}
/* الإصدار 83: كشف المستحقات والدفعات. للمدير: تسجيل دفعة وحذف آخر دفعة. للموظف: عرض بس */

    <div class="slms">${nCl > 1 ? `<button class="dtog" style="padding:10px 0 6px" onclick="S.fx.cm=!S.fx.cm;renderFin()" aria-expanded="${!fold}">شهور مسددة (${nCl})${fold ? '' : ' · إخفاء'}</button>` : ''}${st.months.filter(m => !(fold && isCl(m))).map(m => {
      const pc = m.due > 0 ? Math.round(m.paid / m.due * 100) : 100, stc = m.closed || m.left <= 0 ? ['g', m.closed ? 'مسدد' : 'لا شيء'] : m.paid > 0 ? ['a', 'جزئي'] : ['', 'غير مسدد'];
      return `<div class="slm"><div class="h"><b>راتب ${esc(m.label)}</b><span class="sltg ${stc[0]}">${stc[1]}</span></div>
        <div class="s"><span>مستحق ${M(m.due, '', 't')} · مدفوع ${M(m.paid, '', 't')}</span><span>${m.closed ? (m.via ? 'سُدّد بالدفعات' : 'صُرف') + (m.date ? ' ' + dmy(m.date) : '') : 'المتبقي ' + M(m.left, '', 't')}</span></div>

  if (st.parts.length) h += `<div class="hair"></div><div class="lbl" style="margin-top:0">${I('history', 14)}سجل الدفعات<span class="sp">${st.parts.length}</span></div>` + salPartsHtml(st, admin);
  return h + '</div>';

/* الإصدار 131: سجل الدفعات صار دالة لحاله: يطلع في الكشف عند الموظف، وقسم مطوي في صفحة الراتب عندي */
function salPartsHtml(st, admin) {
  const n = x => Math.round(x * 100) / 100;
  return st.parts.map(x => {
    const al = x.al.map(q => q.done ? `${q.rest ? 'غطّت المتبقي من' : 'غطّت كامل'} راتب ${esc(q.label)} (${n(q.take).toLocaleString('en-US')}) <span class="pos">سُدّد</span>` : `${n(q.take).toLocaleString('en-US')} من راتب ${esc(q.label)}${q.rest ? ' (تكملة)' : ''}`).join('<br>');
    const arm = S.armed === 'pt_' + x.id, can = admin && x.id === st.lastPart;

      <div class="al">${al || 'لم تُوزَّع'}<div class="sub" style="margin-top:3px">المتبقي له بعدها ${M(x.after, '', 't')}</div></div></div>`;
  }).join('');
}
/* الإصدار 85: أزرار الراتب: «دفعة راتب» (جزء من الراتب، تتوزع وتنعرض قبل الحفظ) و«راتب شهر سابق» (شهر قبل بداية الحساب) وتصحيح شهر حركة صرف */
function salActHtml(e) {
  const f = S.form && S.form.emp === e.id && ['part', 'prev', 'move'].includes(S.form.kind) ? S.form : null, today = S.data.today, sal = e.sal || {};
  if (f && f.kind === 'part') {

      <div class="field" style="margin-top:10px"><span>المبلغ</span><input id="sp_amt" class="qtt" inputmode="decimal" value="${esc(f.amount || '')}" oninput="S.form.amount=this.value;partPrev('${e.id}');amtPv(this.value,'apv_sp')">${amtPvHtml(f.amount || '', 'apv_sp')}</div>
      <div class="dprops pdate" style="margin:0 0 10px"><label class="dp"><span>تخص شهر</span><select id="sp_mon" onchange="S.form.month=this.value;partPrev('${e.id}')"><option value="">الأقدم أولاً</option>${opts}</select></label>
        <label class="dp"><span>تاريخ التسليم</span>${f.nodate ? `<button class="lnk" style="padding:0" onclick="S.form.nodate=false;renderFin()">غير محدد · حدّده</button>` : `<input id="sp_date" type="date" value="${esc(f.date || today)}" max="${today}" onchange="S.form.date=this.value">`}</label></div>
      ${f.nodate ? '' : `<button class="lnk" style="padding:0 2px 8px" onclick="S.form.nodate=true;renderFin()">التاريخ غير معروف</button>`}

      ${mv ? '<div class="sub" style="margin-top:4px">تنتقل الحركة نفسها إلى الشهر الذي تختاره، دون حركة جديدة</div>' : ''}
      <div class="dprops pdate" style="margin:10px 0"><label class="dp"><span>شهر الراتب</span><select id="mv_mon" onchange="S.form.month=this.value;if(S.form.kind==='prev')S.form.amount='';renderFin()">${ms.map(m => `<option value="${m.month}" ${sel === m.month ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</select></label>
        <label class="dp"><span>تاريخ التسليم</span><input id="mv_date" type="date" value="${esc(f.date || today)}" max="${today}" onchange="S.form.date=this.value"></label></div>
      <div class="field"><span>المبلغ</span><input id="mv_amt" class="qtt" inputmode="decimal" value="${esc(f.amount !== '' && f.amount != null ? f.amount : net != null ? Math.max(0, net) : '')}" oninput="S.form.amount=this.value;amtPv(this.value,'apv_mv')">${amtPvHtml('', 'apv_mv')}</div>

  }
  const b = [];
  if ((sal.open || []).length) b.push(`<button onclick="S.form={emp:'${e.id}',kind:'part',month:'',date:'',amount:''};S.armed=null;renderFin()">${I('hand-coins', 15)}دفعة</button>`);

function monthLbl(mk) { return mk ? MONTHS_AR[+mk.slice(5, 7) - 1] + ' ' + mk.slice(0, 4) : ''; }

/* ---------- التوجيهات: عند المدير ---------- */
function gDur(s) { return s < 60 ? s + ' ثانية' : Math.round(s / 60) + ' ' + (Math.round(s / 60) <= 10 ? 'دقائق' : 'دقيقة'); }
function gReadLine(r, hasQ) {
  if (r.done) return `<span class="badge">قرأه</span><div class="gst">${dmy(r.done.slice(0, 10))} ${t12(r.done)} · ${gDur(r.secs)}${hasQ ? ' · ' + (r.wrong ? 'أجاب إجابة خاطئة ' + (r.wrong === 1 ? 'مرة' : r.wrong + ' مرات') + ' ثم صحيحة' : 'أجاب إجابة صحيحة') : ''}</div>`;
  if (r.opened) return `<span class="badge wait">فتحه ولم يُكمله</span><div class="gst">فتحه ${t12(r.opened)}${r.wrong ? ' · أجاب إجابة خاطئة ' + (r.wrong === 1 ? 'مرة' : r.wrong + ' مرات') : ''}</div>`;
  return `<span class="badge late">لم يفتحه</span><div class="gst">أُرسل ${dmy(r.sent.slice(0, 10))} ${t12(r.sent)}</div>`;
}
function guidesHtml(d) {
  const on = d.employees.filter(e => e.guide), gs = d.guides || [];
  if (!on.length && !gs.length) return '<div class="card" style="margin-top:12px">' + emptyHtml('clipboard-list', 'فعّل «التوجيهات» لموظف من إعداداته في الفريق أولاً') + '</div>';
  const f = S.gform;
  let h = '<div style="height:10px"></div>';
  if (f) h += gFormHtml(d, on, f);
  if (!gs.length && !f) return h + '<div class="card">' + emptyHtml('clipboard-list', 'لا توجد توجيهات بعد، اضغط + لإرسال أول توجيه') + '</div>';
  h += gs.map(g => {
    const arm = S.armed === 'gd_' + g.id;
    return `<div class="card gcard">
      <div class="gch"><div class="gti"><b>${esc(g.title)}</b><small>${dmy(g.ts.slice(0, 10))} · ${g.points.length} ${g.points.length === 1 ? 'نقطة' : g.points.length === 2 ? 'نقطتين' : 'نقاط'}${g.q ? ' · يتضمن سؤالاً' : ''}</small></div>
        <button class="del ${arm ? 'arm' : ''}" onclick="delGuide('${g.id}')">${arm ? 'تأكيد الحذف' : I('trash-2', 15)}</button></div>
      ${g.reads.map(r => `<div class="grd"><div class="grn"><b>${esc(r.name)}</b>${gReadLine(r, !!g.q)}</div></div>`).join('')}
      <details class="gpts"><summary>النقاط${g.q ? ' والسؤال' : ''}</summary><ol>${g.points.map(p => `<li>${esc(p)}</li>`).join('')}</ol>
        ${g.q ? `<div class="gq"><b>${esc(g.q.text)}</b>${g.q.opts.map((o, i) => `<div class="${String(i) === String(g.q.ok) ? 'ok' : ''}">${String(i) === String(g.q.ok) ? I('check', 13, 3) : ''}${esc(o)}</div>`).join('')}</div>` : ''}</details>
    </div>`;
  }).join('');
  return h;
}
function gFormHtml(d, on, f) {
  return `<div class="card gform">
    ${ctitle('clipboard-list', 'توجيه جديد')}
    <div class="field" style="margin-top:12px"><span>العنوان</span><input id="g_title" value="${esc(f.title)}" oninput="S.gform.title=this.value" placeholder="عنوان التوجيه"></div>
    <div class="field"><span>النقاط (كل نقطة سطر قصير)</span>
      ${f.points.map((p, i) => `<div class="gpi"><i>${i + 1}</i><input value="${esc(p)}" oninput="S.gform.points[${i}]=this.value">${f.points.length > 1 ? `<button onclick="gPt(${i})" aria-label="إزالة">${I('x', 15)}</button>` : ''}</div>`).join('')}
      ${f.points.length < 20 ? `<button class="lnk gadd" onclick="gPt(-1)">${I('plus', 14)}نقطة</button>` : ''}</div>
    <div class="trow"><div class="n"><b>سؤال في الآخر</b><small>للتوجيهات المهمة، ويجب أن يجيب إجابة صحيحة</small></div><button class="tg ${f.q ? 'on' : ''}" onclick="S.gform.q=!S.gform.q;renderTasks()" aria-label="سؤال"></button></div>
    ${f.q ? `<div class="field"><span>السؤال</span><input value="${esc(f.qt)}" oninput="S.gform.qt=this.value"></div>
      <div class="field"><span>الخيارات (اضغط الدائرة على الإجابة الصحيحة)</span>
      ${f.opts.map((o, i) => `<div class="gpi go ${f.ok === i ? 'on' : ''}"><button class="gr" onclick="S.gform.ok=${i};renderTasks()" aria-label="الإجابة الصحيحة">${f.ok === i ? I('check', 13, 3) : ''}</button><input value="${esc(o)}" oninput="S.gform.opts[${i}]=this.value"></div>`).join('')}</div>` : ''}
    <div class="field"><span>لمن</span><div class="dedch">${on.map(e => `<button class="${f.emps.indexOf(e.id) >= 0 ? 'on' : ''}" onclick="gEmp('${e.id}')">${esc(e.name)}</button>`).join('')}</div></div>
    <div class="grid2"><button class="btn2 cu" onclick="sendGuide()">${I('send', 16)}أرسل</button><button class="btn2" onclick="S.gform=null;renderTasks()">إلغاء</button></div>
    <div class="err" id="gerr"></div>
  </div>`;
}
function openGForm() {
  S.gform = {title: '', points: ['', ''], q: false, qt: '', opts: ['', '', ''], ok: -1, emps: S.data.employees.filter(e => e.guide).map(e => e.id)};
  S.armed = null; renderTasks();
  setTimeout(() => { const x = $('#g_title'); if (x) x.focus(); }, 50);
}
function gPt(i) { const p = S.gform.points; if (i < 0) p.push(''); else p.splice(i, 1); renderTasks(); }
function gEmp(id) { const a = S.gform.emps, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); renderTasks(); }
async function sendGuide() {
  const f = S.gform;
  const x = {title: f.title, points: f.points, emps: f.emps, q: f.q ? {text: f.qt, opts: f.opts, ok: f.ok} : null};
  if (!f.title.trim()) return $('#gerr').textContent = 'اكتب عنوان التوجيه';
  if (!f.points.some(p => p.trim())) return $('#gerr').textContent = 'اكتب نقطة واحدة على الأقل';
  if (f.q && f.ok < 0) return $('#gerr').textContent = 'اضغط الدائرة بجانب الإجابة الصحيحة';
  const un = lockBtn('جاري الإرسال…');
  try { S.data = await call('apiGuideAdd', BOOT.key, x); S.gform = null; renderAdmin(); toast('تم إرسال التوجيه'); }
  catch (e) { un(); $('#gerr').textContent = e; }
}
async function delGuide(id) {
  if (S.armed !== 'gd_' + id) { S.armed = 'gd_' + id; renderTasks(); return; }
  try { S.data = await call('apiGuideDel', BOOT.key, id); S.armed = null; renderAdmin(); toast('تم حذف التوجيه'); }
  catch (e) { S.armed = null; renderTasks(); toastErr(e); }
}
function payDue(e, mk) {
  if (!mk) return '';
  let y = +mk.slice(0, 4), m = +mk.slice(5, 7);
  if (e.payNext) { m++; if (m > 12) { m = 1; y++; } }
  return y + '-' + String(m).padStart(2, '0') + '-' + String(e.payDay || 28).padStart(2, '0');
}
async function setPayday(id) {
  const dd = $('#pdd_' + id), dn = $('#pdn_' + id);
  if (!dd || !dn) return;
  dd.disabled = dn.disabled = true;
  try { S.data = await call('apiEmpPayday', BOOT.key, id, +dd.value, dn.value === '1'); renderAdmin(); toast('تم حفظ موعد الصرف'); }
  catch (err) { renderAdmin(); toastErr(err); }
}
async function setLang(id, lang, sel) {
  const e = empById(id), old = e.lang || 'ar';
  if (sel) sel.disabled = true;
  try { S.data = await call('apiEmpLang', BOOT.key, id, lang); renderAdmin(); lgAdminContent(); toast('أصبحت صفحته بـ' + ((LANGS.find(l => l[0] === lang) || [])[1] || lang)); }
  catch (err) { if (sel) { sel.value = old; sel.disabled = false; } $('#e_' + id).textContent = err; }
}
async function toggleGuide(id) {
  const e = empById(id);
  try { S.data = await call('apiGuideToggle', BOOT.key, id, !e.guide); renderAdmin(); toast(!e.guide ? 'فُعّلت التوجيهات له' : 'أُوقفت التوجيهات له'); }
  catch (err) { $('#e_' + id).textContent = err; }
}

/* ---------- التوجيهات: عند الموظف ---------- */
function guideBannerHtml(d) {
  if (!d.guideOn) return '';
  return (d.guides || []).filter(g => !g.done).map(g => `<button class="gban" onclick="openGuide('${g.id}')">
    <span class="gbi">${I('clipboard-list', 20)}</span><span class="gbt"><small>توجيه جديد من المدير العام</small><b>${esc(g.title)}</b></span>${I('chevron-left', 18)}</button>`).join('');
}
function guideDoneHtml(d) {
  const done = (d.guides || []).filter(g => g.done);
  if (!d.guideOn || !done.length) return '';
  return `<div class="sech">التوجيهات</div><div class="card" style="padding:4px 14px">${done.map(g => `<button class="grow" onclick="openGuide('${g.id}')">
    ${I('circle-check', 17)}<span>${esc(g.title)}</span>${I('chevron-left', 16)}</button>`).join('')}</div>`;
}
function gWait(p) { return Math.max(3, Math.min(12, Math.ceil(String(p).length / 12) + 2)); }
function openGuide(id) {
  const g = (S.empData.guides || []).find(x => x.id === id);
  if (!g) return;
  S.gr = {id: id, i: 0, stage: 'points', t0: Date.now(), review: !!g.done};
  if (!g.done && !S.empPreview) API.apiGuideOpen(BOOT.token, id).catch(() => {});
  renderGuide(); toTop();
}
function closeGuide() { clearInterval(S.grT); S.gr = null; rerenderEmp(); toTop(); }
function renderGuide() {
  clearInterval(S.grT);
  const r = S.gr, g = (S.empData.guides || []).find(x => x.id === r.id);
  if (!g) { S.gr = null; return rerenderEmp(); }
  const n = g.points.length;
  let body;
  if (r.review) {
    body = `<ol class="gall">${g.points.map(p => `<li>${esc(p)}</li>`).join('')}</ol><button class="clsb" onclick="closeGuide()">إغلاق</button>`;
  } else if (r.stage === 'q') {
    body = `<div class="gbar"><div style="width:100%"></div></div>
      <div class="gqt">${esc(g.q.text)}</div>
      <div class="gopts">${g.q.opts.map((o, i) => `<button onclick="answerGuide(${i})">${esc(o)}</button>`).join('')}</div>`;
  } else {
    r.left = gWait(g.points[r.i]);
    body = `<div class="gbar"><div style="width:${Math.round(r.i / (n + (g.q ? 1 : 0)) * 100)}%"></div></div>
      ${g.points.slice(0, r.i).map(p => `<div class="gdone">${I('check', 15, 3)}<span>${esc(p)}</span></div>`).join('')}
      <div class="gcur"><small>${r.i + 1} من ${n}</small>${esc(g.points[r.i])}</div>
      <button class="ackb gok" id="gok" disabled onclick="nextPoint()">فهمت (بعد ${r.left} ثواني)</button>`;
    S.grT = setInterval(() => {
      r.left--;
      const b = $('#gok');
      if (!b) return clearInterval(S.grT);
      if (r.left > 0) b.textContent = 'فهمت (بعد ' + r.left + ' ثواني)';
      else { clearInterval(S.grT); b.disabled = false; b.innerHTML = I('check', 16, 2.5) + 'فهمت'; }
    }, 1000);
  }
  $('#app').innerHTML = `<button class="back" onclick="closeGuide()">${I('arrow-right', 17)}رجوع</button>
    <div class="card gread"><div class="gtag">${I('clipboard-list', 14)}توجيه من المدير العام</div><h2>${esc(g.title)}</h2>${body}</div>`;
}
function nextPoint() {
  const r = S.gr, g = (S.empData.guides || []).find(x => x.id === r.id);
  if (r.left > 0) return;
  r.i++;
  if (r.i < g.points.length) return renderGuide();
  if (g.q) { r.stage = 'q'; return renderGuide(); }
  finishGuide(null);
}
function answerGuide(i) { finishGuide(i); }
async function finishGuide(ans) {
  const r = S.gr;
  if (S.empPreview) { toast('هذه معاينة، لن يُحفظ شيء', null, 'in'); return closeGuide(); }
  const secs = Math.round((Date.now() - r.t0) / 1000);
  try {
    const res = await call('apiGuideDone', BOOT.token, r.id, secs, ans);
    S.empData = res.data;
    if (res.ok) { S.gr = null; rerenderEmp(); toTop(); toast('تم، يعطيك العافية'); }
    else { r.i = 0; r.stage = 'points'; r.t0 = Date.now(); renderGuide(); toTop(); toastErr('الإجابة غير صحيحة، اقرأ النقاط مرة أخرى'); }
  } catch (e) { toastErr(e); }
}

function resizeImg(file, maxD, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, (maxD || 1280) / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q || 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej('تعذّرت قراءة الصورة، جرّب صورة أخرى'); };
    img.src = url;
  });
}

async function rpPick(inp) {

    const ty = String(file.type || ''), ext = ((String(file.name || '').match(/\.(\w{2,5})$/) || [])[1] || '').toLowerCase();
    try {
      if (ty.indexOf('image') === 0 || /^(jpe?g|png|heic|heif|webp)$/.test(ext)) f.files.push({t: 'i', d: await resizeImg(file, 1600, 0.78), n: file.name || 'صورة'});

      const p = await callT(180000, 'apiRepUpload', x, pr => { f.prog = 'جاري رفع المرفقات ' + (i + 1) + ' من ' + f.files.length + ' · ' + Math.round(pr * 100) + '%'; rpProg(f); });
      files.push({p: p, t: x.t, n: x.n});
    }
    f.prog = 'جاري الإرسال…'; rpProg(f);
    if (!f.tried) { f.tried = true; f.trySig = rpSig(f); }
    const res = await call('apiRepAdd', {proj: f.proj, cid: f.cid, cur: cur, done: done, later: keep.map(x => ({t: x.t, after: x.after || ''})), ask: f.admin ? [] : keep.filter(x => x.ask).map(x => x.t), up: moved.map(x => x.t), removed: gone, decide: dec, files: files});

  try { await rpTickReload(); } catch (e) { RP.need = true; }

  rpRerender();
}

/* نفس due_warn_at في القاعدة: قبل الموعد بساعة، ولو طاحت برا الدوام (7 ص إلى 9 م، والجمعة إجازة) تنتقل 9 م اليوم اللي قبله */

  }).join('') + `</ul><div class="rhint" style="margin-top:6px">${I('info', 13)}${isAdmin ? 'اضغط السهم لنقل العمل إلى الأعمال الحالية' : 'اضغط السهم لطلب نقل العمل للحالية، وينتقل بعد موافقة المدير العام'}</div>`;
}
/* الإصدار 88: حالة طلب النقل على العمل اللاحق */
function rpReqTag(x) { return x && (x.req || x.areq) ? '<span class="tg2 a">بانتظار الاعتماد</span>' : x && x.rej ? '<span class="tg2 r">مرفوض</span>' : rpArejShow(x) ? `<span class="tg2 r">${x.arej.auto ? 'أُلغي الطلب' : 'مرفوض'}</span>` : ''; }
function rpReqLine(x) {
  if (!x) return '';
  if (x.areq) { const mine = BOOT.page === 'emp' && S.empData && x.areq.by === S.empData.id, w = mine ? 'طلبت' : 'طلب ' + esc(shortName(x.areq.name || '')); return `<small class="tkt">${w} ${x.areq.after ? 'أن تبدأ بعد: ' + esc(x.areq.after) : 'فكّ ربطها بأي عمل'} · ${esc(rpTickWhen(x.areq.at))}</small>`; }
  if (rpArejShow(x) && !x.req && !x.rej) { const a = x.arej; return `<small class="retn">${I('x', 12)}${a.auto ? 'أُلغي طلب تغيير البداية: لم يعد «' + esc(a.after) + '» في الأعمال الحالية' : a.note ? 'ملاحظة المدير العام: ' + esc(a.note) : 'لم يعتمد المدير العام تغيير بدايته'} · ${esc(rpTickWhen(a.at))}</small>`; }
  if (x.req) { const mine = BOOT.page === 'emp' && S.empData && x.req.by === S.empData.id; return `<small class="tkt">${mine ? 'طلبت' : 'طلب ' + esc(shortName(x.req.name || ''))} نقله للحالية · ${esc(rpTickWhen(x.req.at))}</small>`; }
  if (x.rej) return `<small class="retn">${I('x', 12)}${x.rej.note ? 'ملاحظة المدير العام: ' + esc(x.rej.note) : 'لم يعتمد المدير العام نقله للحالية'} · ${esc(rpTickWhen(x.rej.at))}</small>`;
  return '';
}
function rpReqItem(r, x) {
  const i = rpArr(r.later).indexOf(x), rv = RP.lrv && RP.lrv.id === r.id && RP.lrv.t === x.t;
  const act = !rpCanTick(r, true) ? '' : rv ? `<div class="rvf"><textarea id="lrv_note" class="rta sm" placeholder="سبب الرفض (اختياري)، يظهر للموظف على العمل" oninput="RP.lrv.note=this.value;rpGrow(this)">${esc(RP.lrv.note || '')}</textarea><div class="grid2"><button class="btn2 rd" onclick="rpLaterRev('${r.id}',${i},false,this)">${I('x', 15)}رفض</button><button class="btn2" onclick="RP.lrv=null;rpRerender()">إلغاء</button></div></div>`
    : `<div class="grid2 pdb"><button class="btn2 cu" onclick="rpLaterRev('${r.id}',${i},true,this)">${I('check', 16, 2.5)}اعتماد النقل</button><button class="btn2 rd" onclick="rpLrvOpen('${r.id}',${i})">${I('x', 15)}رفض</button></div>`;
  return `<li><div class="pt">${esc(x.t)}</div><div class="pm"><b>طلب نقل للحالية</b> · ${esc(shortName(x.req.name || ''))} · ${esc(rpTickWhen(x.req.at))}</div>${act}</li>`;
}
/* الإصدار 123: طلب تغيير «تبدأ بعد» في بطاقة «بانتظار الاعتماد» عندي */
function rpAreqItem(r, x) {
  const i = rpArr(r.later).indexOf(x), rv = RP.aqv && RP.aqv.id === r.id && RP.aqv.t === x.t;
  const act = !rpCanTick(r, true) ? '' : rv ? `<div class="rvf"><textarea id="aqv_note" class="rta sm" placeholder="سبب الرفض (اختياري)، يظهر للموظف على العمل" oninput="RP.aqv.note=this.value;rpGrow(this)">${esc(RP.aqv.note || '')}</textarea><div class="grid2"><button class="btn2 rd" onclick="rpAqRev('${r.id}',${i},false,this)">${I('x', 15)}رفض</button><button class="btn2" onclick="RP.aqv=null;rpRerender()">إلغاء</button></div></div>`
    : `<div class="grid2 pdb"><button class="btn2 cu" onclick="rpAqRev('${r.id}',${i},true,this)">${I('check', 16, 2.5)}اعتماد التغيير</button><button class="btn2 rd" onclick="rpAqvOpen('${r.id}',${i})">${I('x', 15)}رفض</button></div>`;
  return `<li><div class="pt">${esc(x.t)}</div><div class="pm"><b>طلب تغيير بداية العمل</b> · ${esc(shortName(x.areq.name || ''))} · ${esc(rpTickWhen(x.areq.at))}</div><div class="pm">الحالي: ${x.after ? 'تبدأ بعد ' + esc(x.after) : 'غير مرتبطة بعمل'}</div><div class="pm">المطلوب: ${x.areq.after ? 'تبدأ بعد ' + esc(x.areq.after) : 'غير مرتبطة بعمل'}</div>${act}</li>`;
}
function rpAqvOpen(id, i) { const r = (RP.reps || []).find(x => x.id === id); if (!r) return; RP.aqv = {id: id, t: (rpArr(r.later)[i] || {}).t, note: ''}; rpRerender(); setTimeout(() => { const t = document.getElementById('aqv_note'); if (t) t.focus(); }, 50); }
async function rpAqRev(id, i, ok, btn) {
  if (RP.busy) return;
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const x = rpArr(r.later)[i]; if (!x) return;
  const note = ok ? '' : String((RP.aqv && RP.aqv.note) || '').trim();
  RP.busy = true;
  if (btn) { btn.disabled = true; btn.innerHTML = ok ? 'جاري الاعتماد…' : 'جاري الرفض…'; }
  try {
    await call('apiRepAfterReview', id, x.t, ok, note);
    RP.aqv = null;
    await rpTickReload();
    RP.busy = false; rpRerender();
    toast(ok ? 'تغيّرت بداية العمل، ووصل الموظف إشعار' : 'تم رفض الطلب، ووصل الموظف إشعار');
  } catch (e) { RP.busy = false; toastErr(e); rpRerender(); }
}
/* الإصدار 123: نافذة طلب تغيير البداية عند الموظف: الأعمال الحالية و«غير مرتبطة بعمل» */
function rpAqOpen(id, i) {
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const x = rpArr(r.later)[i]; if (!x) return;
  const cur = rpArr(r.cur), cut = s => s.length > 34 ? s.slice(0, 34) + '…' : s, ci = x.after ? cur.indexOf(x.after) : -1;
  RP.aq = {id: id, t: x.t, after: x.after || ''};
  ovOpen(`<label class="shh" for="aq_aft">تغيير بداية العمل</label>
    <div class="sub" style="margin:-6px 0 12px">${esc(x.t)}</div>
    <div class="field"><span>تبدأ بعد</span><select id="aq_aft"><option value="">غير مرتبطة بعمل</option>${cur.map((c, n) => `<option value="${n}" ${n === ci ? 'selected' : ''}>${esc(cut(c))}</option>`).join('')}</select></div>
    <div class="sub" style="margin:0 0 12px">يُرسل الطلب إلى المدير العام، ويُطبَّق بعد اعتماده.</div>
    <div class="err" id="aqerr"></div>
    <button class="btn2 cu qbig" onclick="rpAqSend()">${I('send', 17)}إرسال الطلب</button>
    <button class="btn2" style="width:100%;margin-top:8px" onclick="RP.aq=null;ovClose()">إلغاء</button>`);
}
async function rpAqSend() {
  const f = RP.aq; if (!f || RP.busy) return;
  const r = (RP.reps || []).find(x => x.id === f.id); if (!r) return;
  const ai = $('#aq_aft').value, aft = ai === '' ? '' : (rpArr(r.cur)[+ai] || '');
  const er = $('#aqerr');
  if (aft === f.after) { if (er) er.textContent = 'اختر عملاً مختلفاً عن الربط الحالي'; return; }
  RP.busy = true; const un = lockBtn('جاري الإرسال…');
  try {
    const res = await call('apiRepAfterReq', f.id, f.t, aft, false) || {};
    RP.aq = null; ovClose(); await rpTickReload(); RP.busy = false; rpRerender();
    toast(res.dup ? 'الطلب مرسل من قبل، بانتظار الاعتماد' : 'أُرسل الطلب للمدير العام', res.dup ? null : () => rpAqUndo(f.id, rpArr(((RP.reps || []).find(x => x.id === f.id) || {}).later).findIndex(y => y.t === f.t)), res.dup ? 'in' : undefined);
  } catch (e) { RP.busy = false; if (un) un(); if (er) er.textContent = e; else toastErr(e); }
}
async function rpAqUndo(id, i, btn) {
  if (RP.busy) return;
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const x = rpArr(r.later)[i]; if (!x) return;
  RP.busy = true;
  if (btn) { btn.disabled = true; btn.textContent = 'جاري الإلغاء…'; }
  try { await call('apiRepAfterReq', id, x.t, '', true); await rpTickReload(); RP.busy = false; rpRerender(); toast('أُلغي الطلب'); }
  catch (e) { RP.busy = false; toastErr(e); rpRerender(); }
}
function rpLrvOpen(id, i) { const r = (RP.reps || []).find(x => x.id === id); if (!r) return; RP.lrv = {id: id, t: (rpArr(r.later)[i] || {}).t, note: ''}; rpRerender(); setTimeout(() => { const t = document.getElementById('lrv_note'); if (t) t.focus(); }, 50); }
async function rpLaterRev(id, i, ok, btn) {
  if (RP.busy) return;
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const x = rpArr(r.later)[i]; if (!x) return;
  const note = ok ? '' : String((RP.lrv && RP.lrv.note) || '').trim();
  RP.busy = true;
  if (btn) { btn.disabled = true; btn.innerHTML = ok ? 'جاري النقل…' : 'جاري الرفض…'; }
