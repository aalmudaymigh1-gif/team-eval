    await call('apiRepLaterReview', id, x.t, ok, note);
    RP.lrv = null;
    await rpTickReload();
    RP.busy = false; rpRerender();
    toast(ok ? 'انتقل إلى الأعمال الحالية، ووصل الموظف إشعار' : 'تم رفض الطلب، ووصل الموظف إشعار');
  } catch (e) { RP.busy = false; toastErr(e); rpRerender(); }
}
/* الإصدار 94: المدير يأجّل عملاً حالياً إلى الأعمال اللاحقة، مع سبب و«يبدأ بعد» اختياريين */
function rpDefOpen(id, i) {
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const item = rpArr(r.cur)[i]; if (!item) return;
  RP.df = {id: id, t: item};
  const cur = rpArr(r.cur).filter(x => x !== item), cut = s => s.length > 34 ? s.slice(0, 34) + '…' : s;
  ovOpen(`<label class="shh" for="df_why">تأجيل العمل</label>
    <div class="sub" style="margin:-6px 0 12px">${esc(item)}</div>
    <div class="field"><span>سبب التأجيل (اختياري)</span><input id="df_why" maxlength="150" onkeydown="if(event.key==='Enter')rpDefSave()"></div>
    <div class="field"><span>يبدأ بعد (اختياري)</span><select id="df_aft"><option value="">غير مرتبط بعمل</option>${cur.map((x, n) => `<option value="${n}">${esc(cut(x))}</option>`).join('')}</select></div>
    <div class="sub" style="margin:0 0 12px">ينتقل إلى الأعمال اللاحقة، ويصل الموظف إشعار بالسبب.</div>
    <div class="err" id="dferr"></div>
    <button class="btn2 cu qbig" onclick="rpDefSave()">${I('clock', 17)}أجّل العمل</button>
    <button class="btn2" style="width:100%;margin-top:8px" onclick="RP.df=null;ovClose()">إلغاء</button>`);
}
async function rpDefSave() {
  const f = RP.df; if (!f || RP.busy) return;
  const r = (RP.reps || []).find(x => x.id === f.id); if (!r) return;
  const why = ($('#df_why').value || '').trim(), ai = $('#df_aft').value, aft = ai === '' ? '' : (rpArr(r.cur).filter(x => x !== f.t)[+ai] || '');
  RP.busy = true; const un = lockBtn('جاري التأجيل…');
  try {
    await call('apiRepLaterPut', f.id, f.t, why, aft);
    RP.df = null; ovClose(); await rpTickReload(); RP.busy = false; rpRerender();
    toast('انتقل إلى الأعمال اللاحقة', () => rpDefUndo(f.id, f.t));
  } catch (e) { RP.busy = false; if (un) un(); const x = $('#dferr'); if (x) x.textContent = e; else toastErr(e); }
}
async function rpDefUndo(id, t) {
  if (RP.busy) return; RP.busy = true;
  try { await call('apiRepNow', id, t, false); await rpTickReload(); RP.busy = false; rpRerender(); toast('أُعيد إلى الأعمال الحالية'); }
  catch (e) { RP.busy = false; toastErr(e); }
}
async function rpNoteDel(id, at) {
  if (RP.narm !== at) { RP.narm = at; rpRerender(); setTimeout(() => { if (RP.narm === at) { RP.narm = null; rpRerender(); } }, 4000); return; }
  if (RP.busy) return; RP.busy = true;
  const r = (RP.reps || []).find(x => x.id === id), n = r && rpArr(r.notes).find(x => x.at === at);
  try { await call('apiRepNoteDel', id, at, n ? n.text : ''); RP.narm = null; await rpTickReload(); RP.busy = false; rpRerender(); toast('تم حذف الملاحظة'); }
  catch (e) { RP.busy = false; RP.narm = null; rpRerender(); toastErr(e); }
}
async function rpNow(id, i, btn) {
  if (RP.busy) return;
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const x = rpArr(r.later)[i]; if (!x) return;
  RP.busy = true;
  if (btn) btn.classList.add('on');
  try {
    const res = await call('apiRepNow', id, x.t, false) || {};
    await rpTickReload();
    RP.busy = false; rpRerender();
    if (res.req && res.dup) toast('الطلب مرسل من قبل، بانتظار الاعتماد', null, 'in');
    else if (res.req) toast('أُرسل طلب النقل للمدير العام', () => rpUnnow(id, x.t, true));
    else toast('انتقل إلى الأعمال الحالية', () => rpUnnow(id, x.t));
  } catch (e) { RP.busy = false; toastErr(e); rpRerender(); }
}
async function rpUnnow(id, item, req) {
  if (RP.busy) return;
  RP.busy = true;
  try { await call('apiRepNow', id, item, true); await rpTickReload(); RP.busy = false; rpRerender(); toast(req ? 'أُلغي طلب النقل' : 'أُعيد إلى الأعمال اللاحقة'); }
  catch (e) { RP.busy = false; toastErr(e); }
}
function rpDecList(r, dec) {
  return '<ul class="rpi">' + dec.map((x, i) => { const arm = RP.armDec === r.id + '|' + i; return `<li class="decx"><span>${esc(x)}</span><button class="dx ${arm ? 'arm' : ''}" onclick="rpDecDel('${r.id}',${i})" aria-label="حذف القرار">${arm ? 'تأكيد الحذف' : I('x', 14, 2.5)}</button></li>`; }).join('') + '</ul>';
}
let rpDecT;
async function rpDecDel(id, i) {
  const k = id + '|' + i;
  if (RP.armDec !== k) { RP.armDec = k; rpRerender(); clearTimeout(rpDecT); rpDecT = setTimeout(() => { if (RP.armDec === k) { RP.armDec = null; rpRerender(); } }, 4000); return; }
  RP.armDec = null;
  const r = (RP.reps || []).find(x => x.id === id); if (!r) return;
  const item = rpArr(r.decide)[i]; if (!item) return;
  try { await call('apiRepDecDel', id, item); await rpTickReload(); rpRerender(); toast('حُذف القرار'); }
  catch (e) { toastErr(e); rpRerender(); }
}

/* الإصدار 53: الصفحة الفرعية عنوانها الكبير اسمها، والرجوع رابط صغير فوقه */
function subHead() {
  const v = document.getElementById('view'), top = document.querySelector('#app .top');
  if (!v || !top) return;
  const h1 = top.querySelector('h1');
  top.querySelectorAll('.back').forEach(b => b.remove());
  top.classList.remove('subp');
  h1.textContent = ({rec:'التقييم', team:'الفريق', task:'الأعمال', fin:'المالية', set:'الإعدادات'})[S.view] || 'إدارة العمل';
  const back = v.querySelector(':scope > .back');
  if (!back) return;
  const h2 = v.querySelector(':scope > .fxh h2, :scope > h2');
  if (h2) {
    h1.textContent = h2.textContent;
    const fx = h2.parentNode.classList.contains('fxh') ? h2.parentNode : null, sp = fx && fx.querySelector('span');
    if (fx && (!sp || /^\d*$/.test(sp.textContent.trim()))) fx.remove(); else h2.remove();
  }
  top.classList.add('subp');
  h1.parentNode.insertBefore(back, h1);
}
/* الإصدار 96: الرسم المتداخل (الفريق يعرض صفحات الراتب والإعدادات) يرتب العنوان مرة وحدة في الآخر */
let SHD = 0;
['renderTeam', 'renderTasks', 'renderFin', 'renderSet'].forEach(n => { const o = window[n]; window[n] = function () { SHD++; let r; try { r = o.apply(this, arguments); } finally { SHD--; } if (!SHD) subHead(); return r; }; });

if (BOOT.page === 'admin') loadAdmin();
else if (BOOT.page === 'emp') loadEmp();
else $('#app').innerHTML = '<div class="load"><div class="ei">' + I('link', 28) + '</div><b style="color:var(--text);font-size:17px">الرابط غير صالح</b><br>تأكد من الرابط الذي وصلك، أو اطلب رابطاً جديداً.</div>';
</script>
