<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3A5F">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>تقييم الفريق</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>
(function () {
  var emp = /[?&]e=/.test(location.search);
  document.write('<link rel="manifest" href="manifest-' + (emp ? 'emp' : 'admin') + '.json">' +
    '<meta name="apple-mobile-web-app-title" content="' + (emp ? 'تقييمي' : 'الفريق') + '">');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--fill:#F3F4F6;--fill2:#EBEDF0;--line:#EDEFF2;--line2:#E3E6EA;--text:#0F1419;--muted:#6B7280;--faint:#9CA3AF;
--acc:#1F3A5F;--acc-2:#2C5282;--acc-ink:#FFFFFF;--acc-soft:#EEF3F9;--acc-ring:#DCE6F2;
--green:#1E7A4B;--green-soft:#ECF7F0;--green-line:#BFE3CC;--red:#B42318;--red-soft:#FEF0EF;--red-line:#F6C9C4;--red-row:#FFFAF9;
--amber:#E8A317;--amber-soft:#FDF5E4;--slate:#5E6B7D;
--r:12px;--r2:16px;--sh:0 1px 2px rgba(15,20,25,.04),0 4px 14px rgba(15,20,25,.04);--sh2:0 10px 30px rgba(15,20,25,.10);
--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 170px)}
button{font:inherit;color:inherit}
svg.i{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:520px;margin:0 auto;padding:12px 18px 0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:30px 2px 4px}
h1{font-size:27px;font-weight:700;letter-spacing:-.5px;margin:0;line-height:1.25}
.top .sub{margin-top:2px}
.sub{color:var(--muted);font-size:13px}
.rf,.ibtn{background:var(--surface);border:1px solid var(--line2);color:var(--text);width:42px;height:42px;border-radius:var(--r);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s var(--ease),background .15s}
.rf:active,.ibtn:active{transform:scale(.94);background:var(--fill)}
.rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:6px;margin:16px -18px 4px;padding:2px 18px 6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;border-radius:var(--r);font-size:12px;color:#4B5563;background:var(--fill);border:0;white-space:nowrap;cursor:pointer;transition:background .2s var(--ease),color .2s,transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs button.on{background:var(--text);color:#fff;font-weight:600}

#view{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.blk{animation:cardIn .4s var(--ease) both}
.card:nth-child(2),.blk:nth-child(2){animation-delay:.04s}.card:nth-child(3),.blk:nth-child(3){animation-delay:.08s}
.card:nth-child(4),.blk:nth-child(4){animation-delay:.12s}.card:nth-child(n+5),.blk:nth-child(n+5){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.blk{margin-top:20px}
.lab,.lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;margin:18px 0 9px}
.blk>.lab{margin-top:0}
.lab svg,.lbl svg{color:var(--faint)}
.grp{color:var(--muted);font-size:12px;margin:10px 0 6px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ctitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.ctitle .ci{width:30px;height:30px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.ctitle .sp{margin-right:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row+.row{margin-top:4px}
.hair{border-top:1px solid var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.emp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empc{border:1.5px solid var(--line2);background:var(--surface);border-radius:var(--r2);padding:12px 14px;text-align:right;cursor:pointer;transition:all .2s var(--ease)}
.empc:active{transform:scale(.98)}
.empc b{display:block;font-size:15px;font-weight:600}.empc small{color:var(--muted);font-size:12px}
.empc.on{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 3px var(--acc-ring)}

.segc{display:flex;background:var(--fill);border-radius:var(--r);padding:3px;gap:2px}
.segc button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-size:14px;color:#4B5563;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.segc button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(15,20,25,.10)}

.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.gr{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;position:relative;width:100%;background:none;border:0;text-align:right;cursor:pointer;transition:background .2s}
.gr+.gr:before{content:"";position:absolute;top:0;right:58px;left:0;height:1px;background:var(--line)}
.gr:active{background:var(--fill)}
.gi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--acc);flex:none}
.gi.b{background:var(--slate)}.gi.s{background:var(--amber)}
.gr .n{flex:1;font-size:15.5px}
.gr .n small{display:block;font-size:12px;color:var(--muted)}
.gr.off{background:var(--red-row)}
.mk{flex:none;display:flex;transition:transform .2s var(--ease)}
.mk.ok{color:#22A45D}.mk.no{color:#E5484D}
.gr:active .mk{transform:scale(.85)}
.pill,.badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);color:var(--green)}
.pill.r,.badge.late{background:var(--red-soft);color:var(--red)}
.badge.wait{background:var(--acc-soft);color:var(--acc)}
.badge.n{background:var(--fill);color:#374151}
.badge.a{background:var(--amber-soft);color:#9A6A00}

.tg{width:50px;height:30px;border-radius:999px;background:var(--fill2);position:relative;flex:none;border:0;padding:0;cursor:pointer;transition:background .25s var(--ease)}
.tg:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:right .25s var(--ease)}
.tg.on{background:var(--acc)}.tg.on:after{right:23px}
.tg.st.on{background:var(--amber)}

textarea,input{width:100%;background:var(--fill);border:1.5px solid transparent;color:var(--text);font:inherit;border-radius:var(--r);padding:12px 14px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 3px var(--acc-ring)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:60px;resize:none}
input[type=date]{color-scheme:light;margin-top:8px}
.field{margin-bottom:12px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600}

.btn,.btn2{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);cursor:pointer;text-decoration:none;font-weight:600;transition:transform .12s var(--ease),opacity .2s,background .2s}
.btn:active,.btn2:active{transform:scale(.97)}
.btn{width:100%;max-width:484px;margin:0 auto;background:var(--acc);color:var(--acc-ink);border:0;font-size:16px;padding:15px;box-shadow:0 8px 20px rgba(31,58,95,.22)}
.btn2{background:transparent;color:var(--text);border:1.5px solid var(--line2);font-size:14px;padding:10px 12px;font-weight:500}
.btn2.cu{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn2.arm{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn2.soft{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.btn:disabled,.btn2:disabled{opacity:.45}

.dock,.save{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(15,20,25,.06)}
.dock .in{max-width:484px;margin:0 auto}
.sum{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sum .badge:last-child{margin-right:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--fill);border:1.5px solid transparent;color:var(--text);font-size:14px;border-radius:var(--r);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.chip .ck{display:inline-flex}
.chip.add{background:transparent;border:1.5px dashed var(--line2);color:var(--acc)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kpi{background:var(--fill);border-radius:var(--r);padding:12px 14px}
.kpi .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.3px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi.hero{background:linear-gradient(150deg,var(--acc),var(--acc-2));color:#fff}
.kpi.hero .k,.kpi.hero .v small{color:rgba(255,255,255,.75)}

.note{border-radius:var(--r);padding:10px 12px;font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.note svg{margin-top:2px}
.note.good{background:var(--green-soft);color:#14532D}
.note.bad{background:var(--red-soft);color:#7A1C14}
.note.info{background:var(--acc-soft);color:#1E3354}
.note.warn{background:#FEF3E2;color:#854F0B}
.note b{font-weight:600}

.ent{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ent:first-child{border-top:0}
.ico{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.ico.s{background:var(--amber-soft);color:var(--amber)}
.ico.m{background:var(--red-soft);color:var(--red)}
.ico.f{background:var(--acc-soft);color:var(--acc)}
.ent .t{flex:1;min-width:0}
.ent .d{color:var(--muted);font-size:12px}
.ent .p{font-size:13px;font-weight:700;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.ent .p.amt{direction:rtl}
.del{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;padding:4px;display:inline-flex;align-items:center;gap:4px;border-radius:8px}
.del:active{background:var(--fill)}
.del.arm{color:var(--red);font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}.cu{color:var(--acc)}

.tbl{width:100%;font-size:14px;border-collapse:collapse}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:left;white-space:nowrap;font-weight:600}
.tbl tr.tot td{font-weight:700;font-size:16px;border-top:1.5px solid var(--line2);padding-top:11px}
.hist{display:grid;grid-template-columns:1.4fr auto auto auto;gap:8px 14px;font-size:14px;align-items:center}
.hist .h{color:var(--muted);font-size:12px;font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}

.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.load{color:var(--muted);text-align:center;padding:90px 20px}
.load .ei{width:64px;height:64px;border-radius:20px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.link{direction:ltr;font-size:12px;word-break:break-all;color:var(--muted);background:var(--fill);border-radius:10px;padding:10px;margin:10px 0}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:4px 0;cursor:pointer;margin:18px 0 0;display:inline-flex;align-items:center;gap:6px}

.task{border-top:1px solid var(--line);padding:13px 0}
.task:first-of-type{border-top:0}
.task.late b{color:var(--red)}
.task.done b{color:var(--muted);font-weight:500}
.task b{font-weight:600}
.tact{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ph{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:var(--r);margin-top:10px;background:var(--fill)}
.upl{margin-top:10px}
.pgh{color:var(--acc);font-size:13px;font-weight:700;margin:16px 0 2px;display:flex;align-items:center;gap:6px}
.pgh+.task{border-top:0;padding-top:6px}
.mst{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mi{position:relative;width:74px;height:74px;border-radius:12px;background:var(--fill);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.mi img{width:100%;height:100%;object-fit:cover}
.mi .x{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.mi.up{outline:1.5px dashed var(--acc)}
.madd{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--acc);font-size:11.5px;cursor:pointer;text-align:center;line-height:1.3}
.vid{display:block;width:100%;height:440px;border:0;border-radius:var(--r);margin-top:10px;background:var(--fill)}
.mbtn{background:var(--acc-soft);border:0;color:var(--acc);font-size:13px;font-weight:600;border-radius:10px;padding:7px 11px;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.titem{border-top:1px solid var(--line);margin-top:16px;padding-top:2px}
.titem-h{margin:12px 0 8px}
.titem-h b{font-size:14px;color:var(--acc)}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;min-width:0}
.inrow .btn2{flex:none;padding:0 16px}
.prow{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow input{flex:1;min-width:0;padding:10px 12px}
.trow{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.trow .n{flex:1}.trow .n b{display:block;font-size:14.5px;font-weight:600}.trow .n small{color:var(--muted);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;background:#0F1419;color:#fff;border-radius:14px;padding:11px 16px;display:flex;gap:14px;align-items:center;transition:all .25s var(--ease);z-index:30;pointer-events:none;font-weight:500;white-space:nowrap;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#A9C1E0;font-weight:700;cursor:pointer}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:200% 0}to{background-position:-200% 0}}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:height .15s}
.hide{display:none}
input,textarea,select{font-size:16px}
select{width:100%;background:var(--fill);border:1.5px solid transparent;color:var(--text);font:inherit;font-size:16px;border-radius:var(--r);padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.tqs{margin-top:14px}
.scards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sc{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;border-radius:14px;border:2px solid transparent;cursor:pointer;text-align:right;min-height:66px;background:var(--acc-soft);color:var(--acc);transition:transform .12s var(--ease)}
.sc:active{transform:scale(.97)}
.sc b{font-size:24px;line-height:1.2;font-weight:700}.sc span{font-size:12px;font-weight:600}
.sc.a{background:var(--amber-soft);color:#8A5A00}.sc.r{background:var(--red-soft);color:var(--red)}
.sc.on{border-color:currentColor}.sc.z{opacity:.55}
.tfil{display:flex;gap:6px;align-items:center;margin:12px 0 0}
.tfil select{flex:1;min-width:0;width:auto;padding:8px 12px;font-size:14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line2)}
.tfil select.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.tfil .chip{flex:none;border-radius:999px;padding:8px 12px}
.chip.on.u{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.tfil .ibtn{width:40px;height:40px}
.lnk{background:none;border:0;font:inherit;font-size:13.5px;font-weight:600;color:var(--acc);padding:8px 0 0;cursor:pointer;align-self:flex-start}
.sech{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:20px 0 2px}
.sech span{font-size:12px;font-weight:700;color:#4B5563;background:var(--fill);border-radius:999px;padding:0 8px}
.sech.a{color:#8A5A00}.sech.r{color:var(--red)}.sech.m{color:var(--muted)}
.tli{border-bottom:1px solid var(--line)}
.tli.dn{display:flex;justify-content:space-between;gap:8px;padding:10px 0}
.trow2{display:flex;gap:11px;align-items:flex-start;width:100%;background:none;border:0;text-align:right;padding:12px 0;cursor:pointer}
.trow2:active{background:var(--fill)}
.ring{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:2px;background:#fff}
.ring.r{border-color:var(--red)}.ring.a{border-color:var(--amber);background:var(--amber-soft)}.ring.g{border-color:var(--green);background:var(--green)}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.th .badge{flex:none}
.tt{font-size:15px;font-weight:600;line-height:1.45}.tt.l{color:var(--red)}.tt.d{color:var(--muted);font-weight:500;text-decoration:line-through}
.tm{font-size:12.5px;color:var(--muted)}
.mbs{display:flex;gap:6px;flex-wrap:wrap}
.mb{font-size:11.5px;border-radius:6px;padding:0 7px;background:var(--fill);color:#374151}.mb.u{background:var(--red-soft);color:var(--red);font-weight:700}
.racts{margin:0 33px 12px 0}

function I(n, s, sw) { return '<svg class="i" width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || '') + '</svg>'; }
const CRIT_IC = {'الحضور والمواعيد':'clock','جودة الشغل':'hammer','إدارة العمال':'users','حل المشاكل':'wrench','الأمانة والمصداقية':'shield-check','الاحترام وحسن التعامل':'handshake','الالتزام بالتعليمات':'clipboard-list','النظافة':'sparkles','الانضباط والمظهر':'shirt'};
function emptyHtml(icon, text) { return '<div class="empty"><div class="ei">' + I(icon, 24) + '</div>' + text + '</div>'; }
function ctitle(icon, text, extra) { return '<div class="ctitle"><span class="ci">' + I(icon, 17) + '</span>' + text + (extra ? '<span class="sp">' + extra + '</span>' : '') + '</div>'; }
function segc(items, cur, fn) { return '<div class="segc">' + items.map(x => '<button class="' + (cur === x[0] ? 'on' : '') + '" onclick="' + fn + '(\'' + x[0] + '\')">' + x[1] + '</button>').join('') + '</div>'; }
const ACC_IMG = 'image/' + '*', ACC_MEDIA = ACC_IMG + ',video/' + '*';
const SL2 = '/' + '/', DRV_URL = 'https:' + SL2 + 'drive.google.com/file/d/', WA_URL = 'https:' + SL2 + 'wa.me/?text=';
const PUSH = {
  ok: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  ios: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  standalone: window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches),
  busy: false
};
function pushLater() { try { localStorage.setItem('pushLater', String(Date.now())); } catch (e) {} redrawAny(); }
function pushSnoozed() { try { return Date.now() - Number(localStorage.getItem('pushLater') || 0) < 3 * 864e5; } catch (e) { return false; } }
function pushHtml() {
  if (PUSH.ok) {
    if (Notification.permission !== 'default') return '';
    return `<div class="pushb"><div class="ph1">${I('bell', 20)}<div><b>فعّل الإشعارات</b><p>${BOOT.page === 'admin' ? 'عشان يوصلك الإثبات والفواتير أول بأول' : 'عشان توصلك المهام الجديدة أول بأول'}</p></div></div>
      <button class="bigdo" onclick="enablePush()">${PUSH.busy ? 'لحظة…' : 'فعّلها'}</button></div>`;
  }
  if (!PUSH.ios || PUSH.standalone || pushSnoozed()) return '';
  return `<div class="pushb"><div class="ph1">${I('bell', 20)}<div><b>عشان توصلك الإشعارات</b><p>من Safari اضغط زر المشاركة، بعدها «إضافة إلى الشاشة الرئيسية»، وافتح التطبيق من الأيقونة.</p></div></div>
    <button class="later" onclick="pushLater()">لاحقاً</button></div>`;
}
function b64u(s) {
  const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function pushSubscribe() {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(await API.pushKey())});
  await API.pushSave(BOOT.page === 'admin' ? BOOT.key : BOOT.token, BOOT.page, sub.toJSON());
}
async function enablePush() {
  if (PUSH.busy) return;
  PUSH.busy = true;
  try {
    const p = await Notification.requestPermission();
    if (p !== 'granted') throw new Error('ما انسمح بالإشعارات. تقدر تفعّلها من إعدادات الجوال');
    redrawAny();
    await pushSubscribe();
    toast('تفعّلت الإشعارات');
  } catch (e) { toast(e && e.message ? e.message : String(e)); }
  PUSH.busy = false;
  redrawAny();
}
if ('serviceWorker' in navigator && BOOT.page !== 'denied') {
  navigator.serviceWorker.register('sw.js').then(() => {
    if (PUSH.ok && Notification.permission === 'granted') pushSubscribe().catch(() => {});
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'refresh' && typeof refresh === 'function') refresh(); });
}

function t12(s) { if (!s) return ''; const h = Number(s.slice(11, 13)), m = s.slice(14, 16); return (h % 12 || 12) + ':' + m + (h < 12 ? ' ص' : ' م'); }
function hrs(ms) { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }
function nowHM() { return new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', hour12: false}).format(new Date()); }
function addMin(hm, n) { const t = Number(hm.slice(0, 2)) * 60 + Number(hm.slice(3, 5)) + n; return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function distM(a1, o1, a2, o2) {
  const R = 6371000, r = x => x * Math.PI / 180, da = r(a2 - a1), dn = r(o2 - o1);
  const h = Math.sin(da / 2) ** 2 + Math.cos(r(a1)) * Math.cos(r(a2)) * Math.sin(dn / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
function mapUrl(lat, lng) { return 'https:' + SL2 + 'maps.google.com/?q=' + lat + ',' + lng; }
function projOf(ps, id) { return (ps || []).find(p => p.id === id) || null; }
function isOff(day) { return new Date(day + 'T12:00:00Z').getUTCDay() === 5; }
function attFlag(r, ps) {
  if (r.inLat == null) return '<span class="badge a">بدون موقع</span>';
  const p = projOf(ps, r.project);
  if (p && p.lat != null) { const m = distM(r.inLat, r.inLng, p.lat, p.lng); if (m > 300) return `<span class="badge late">بعيد عن المشروع ${m > 999 ? (m / 1000).toFixed(1) + ' كم' : m + ' م'}</span>`; }
  return '';
}

/* عند الموظف */
function attCardHtml(d, isPreview) {
  if (!d.attend) return '';
  const r = (d.att || []).find(x => x.date === d.today);
  if (!r) return isPreview ? '<div class="note info" style="margin-top:12px">ما سجّل وصوله اليوم</div>'
    : `<button class="attgo" onclick="openCam('in')">${I('map-pin', 26)}<b>وصلت</b><span>صورة سيلفي + موقعك</span></button>`;
  const p = projOf(d.projects, r.project), pn = p ? p.name : '';
  if (!r.out) return `<div class="attc"><div class="r1"><span>وصلت ${t12(r.in)}</span><span>${esc(pn)}</span></div>
    <div class="el" id="attEl" data-ms="${r.inMs}">${hrs(Date.now() - r.inMs)} ساعة</div>
    ${isPreview ? '' : `<button class="attout" onclick="openCam('out')">طلعت</button>`}</div>`;
  return `<div class="attc done"><div class="r1"><span>وصلت ${t12(r.in)} · طلعت ${t12(r.out)}</span><span>${esc(pn)}</span></div><div class="el">${hrs(r.outMs - r.inMs)} ساعة</div></div>`;
}
setInterval(() => { const el = document.getElementById('attEl'); if (el) el.textContent = hrs(Date.now() - Number(el.dataset.ms)) + ' ساعة'; }, 30000);

const CAM = {stream: null, mode: 'in', shot: null, pos: null, posErr: '', posWait: false, proj: '', manual: false};
function camStop() { if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; } }
function getPos() {
  CAM.pos = null; CAM.posErr = '';
  if (!navigator.geolocation) { CAM.posErr = 'الجوال ما يدعم تحديد الموقع'; return; }
  CAM.posWait = true;
  navigator.geolocation.getCurrentPosition(
    p => { CAM.posWait = false; CAM.pos = {lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy}; camRefresh(); },
    e => { CAM.posWait = false; CAM.posErr = e.code === 1 ? 'ما سمحت بالموقع' : 'ما قدرنا نحدد الموقع'; camRefresh(); },

    return `<button class="gr ${miss ? 'off' : ''}" onclick="togMiss(${d.criteria.indexOf(c)})">
      <span class="gi ${cls}">${I(CRIT_IC[c.n] || 'check', 17, 2.2)}</span><span class="n">${esc(c.n)}</span>
      ${miss ? `<span class="pill r">تقصير${trk ? '' : ' · <bdi dir="ltr">−' + amt + '</bdi>'}</span>` : ''}
      <span class="mk ${miss ? 'no' : 'ok'}">${I(miss ? 'circle-x' : 'circle-check', 26, 2)}</span></button>`;
  };
  let ded = 0;
  S.misses.forEach(c => { ded += c === TRUST ? st.trust : st.miss; });
  const net = (S.star ? st.star : 0) - ded;
  const label = !S.misses.length && !S.star ? 'كل شي تمام' : 'حفظ التقييم';
  const empSub = e => e.track ? 'متابعة فقط' : 'حافز الشهر ' + num(e.month.bonus) + ' ريال';
  $('#view').innerHTML = `
    <div class="blk"><div class="lab">${I('user', 14)}الموظف</div>
      <div class="emp">${d.employees.map(e => `<button class="empc ${S.emp===e.id?'on':''}" onclick="setEmp('${e.id}')"><b>${esc(e.name)}</b><small>${esc(empSub(e))}</small></button>`).join('')}</div></div>
    <div class="blk"><div class="lab">${I('calendar', 14)}اليوم</div>
      ${segc([['today','اليوم'],['yest','أمس'],['other','تاريخ ثاني']], S.dateMode, 'setDate')}
      ${S.dateMode==='other' ? `<input type="date" value="${S.date}" max="${d.today}" onchange="S.date=this.value">` : ''}</div>
    <div class="blk"><div class="lab">${I('sparkles', 14)}الأداء — اضغط على اللي قصّر فيه</div><div class="gcard">${perf.map(c => row(c, '')).join('')}</div></div>
    <div class="blk"><div class="lab">${I('users', 14)}السلوك</div><div class="gcard">${beh.map(c => row(c, 'b')).join('')}</div></div>
    ${S.misses.length ? `<div class="blk"><input placeholder="وش صار؟ (اختياري)" value="${esc(S.note)}" oninput="S.note=this.value"></div>` : ''}
    <div class="blk"><div class="gcard"><div class="gr" onclick="togStar()"><span class="gi s">${I('star', 17, 2.4)}</span>
      <span class="n">موقف مميز <small>فوق الواجب${trk ? '' : ' · <bdi dir="ltr">+' + st.star + '</bdi> ريال'}</small></span>
      <span class="tg st ${S.star ? 'on' : ''}"></span></div></div>
      ${S.star ? `<input placeholder="وش سوّى؟ مثل: خلّص التشطيب قبل الموعد" value="${esc(S.starNote)}" oninput="S.starNote=this.value" style="margin-top:10px">` : ''}</div>
    <div class="err" id="err"></div>
    <div class="dock"><div class="in">
      <div class="sum">
        <span class="badge ${S.misses.length ? 'late' : 'n'}">${I('x', 13, 3)} تقصير ${S.misses.length}</span>
        <span class="badge ${S.star ? '' : 'n'}">${I('star', 13, 2.4)} مميز ${S.star ? 1 : 0}</span>
        ${trk ? '<span class="badge n">متابعة فقط</span>' : `<span class="badge n">صافي اليوم <bdi dir="ltr">${net > 0 ? '+' : net < 0 ? '−' : ''}${Math.abs(net)}</bdi> ريال</span>`}
      </div>
      <button class="btn" id="saveBtn" onclick="save()">${I('check', 19, 2.5)}${label}</button></div></div>`;
}

function setEmp(id) { S.emp = id; renderRec(); }
function togMiss(i) { const n = S.data.criteria[i].n; S.misses = S.misses.includes(n) ? S.misses.filter(x => x !== n) : S.misses.concat(n); renderRec(); }
function togStar() { S.star = !S.star; renderRec(); }
function setType(t) { S.type = t; renderRec(); }
function togCrit(i) {
  const n = S.data.criteria[i].n;
  S.crits = S.crits.includes(n) ? S.crits.filter(x => x !== n) : S.crits.concat(n);
  renderRec();
}
function setDate(m) {
  S.dateMode = m;
  if (m === 'today') S.date = S.data.today;
  if (m === 'yest') S.date = S.data.yesterday;
  renderRec();
}

async function save() {
  const err = $('#err');
  err.textContent = '';
  if (!S.emp) return err.textContent = 'اختر الموظف';
  if (!S.misses.length && !S.star) { toast('تمام، ما عليه تقصير'); return; }
  if (S.star && !S.starNote.trim()) return err.textContent = 'اكتب وش سوّى عشان الموقف المميز';
  if (S.busy) return;
  S.busy = true;
  const b = $('#saveBtn'); b.disabled = true; b.textContent = 'جاري الحفظ…';
  try {
    const name = empById(S.emp).name;
    const res = await call('apiAdd', BOOT.key, {emp:S.emp, date:S.date, misses:S.misses, note:S.note, star: S.star ? {note:S.starNote} : null});
    S.data = res; S.lastId = res.lastId;
    S.misses = []; S.star = false; S.starNote = ''; S.note = ''; S.dateMode = 'today'; S.date = S.data.today;
    S.busy = false;
    renderAdmin();
    toast(res.skipped ? 'انحفظ لـ ' + name + ' (' + res.skipped + ' متسجل اليوم من قبل)' : 'انحفظ لـ ' + name, undoLast);
  } catch (e) {
    S.busy = false; renderRec(); $('#err').textContent = e;
  }
}

async function undoLast() {
  if (!S.lastId) return;
  $('#toast').classList.remove('show');
  try { S.data = await call('apiDelete', BOOT.key, S.lastId); S.lastId = null; renderAdmin(); toast('انحذف'); }
  catch (e) { toast(e); }
}

/* ---------- المهام (المدير) ---------- */

function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function dueLabel(t, today) {
  if (!t.due) return 'بدون موعد';
  if (t.due === today) return 'اليوم';
  if (t.due === addDays(today, 1)) return 'بكرة';
  if (t.due === addDays(today, -1)) return 'أمس';
  return dmy(t.due);
}
function statusBadge(t) {
  if (t.status === 'done') return `<span class="badge">${t.lateDone ? 'خلصت متأخرة' : 'خلصت'}</span>`;
  if (t.late) return '<span class="badge late">متأخرة</span>';
  if (t.status === 'returned') return '<span class="badge late">رجعت</span>';
  return '<span class="badge wait">مطلوبة</span>';
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function activeProjects() { return (S.data.projects || []).filter(p => !p.archived); }

function allTasks() {
  const out = [];
  S.data.employees.forEach(e => (e.tasks || []).forEach(t => out.push(Object.assign({}, t, {emp: e.id, ename: e.name}))));
  return out;
}
function tBucket(t, today) {
  if (t.status === 'review') return 'review';
  if (t.status === 'done') return 'done';
  return 'open';
}
function pillOf(t, b, emp) {
  if (t.status === 'review') return ['a', emp ? 'انرسلت' : 'تنتظر مراجعتك'];
  if (t.status === 'done') return ['', t.lateDone ? 'خلصت متأخرة' : 'خلصت'];
  if (t.status === 'returned') return ['late', emp ? 'رجعت لك' : 'رجعت'];
  return null;
}
function pillHtml(p) { return p ? `<span class="badge ${p[0]}">${p[1]}</span>` : ''; }
function dueHtml(t, today) {
  if (!t.due) return '';
  return `<span class="${t.due < today ? 'dlate' : ''}">موعدها ${dueLabel(t, today)}</span>`;
}
function byUrgent(a, b) {
  const x = a.due || '9', y = b.due || '9';
  return ((b.urgent ? 1 : 0) - (a.urgent ? 1 : 0)) || ((b.status === 'returned' ? 1 : 0) - (a.status === 'returned' ? 1 : 0)) || (x < y ? -1 : x > y ? 1 : 0);
}
function projGroups(list) {
  const order = (S.data && S.data.projects ? S.data.projects : []).map(p => p.id);
  const by = {}, keys = [];
  list.forEach(t => { const k = t.project || ''; if (!by[k]) { by[k] = {key: k, name: t.pname || 'عام', items: []}; keys.push(k); } by[k].items.push(t); });
  const rank = k => k === '' ? 1e6 : (order.indexOf(k) < 0 ? 1e5 : order.indexOf(k));
  return keys.sort((a, b) => rank(a) - rank(b)).map(k => { by[k].items.sort(byUrgent); return by[k]; });
}
function loadTq() {
  if (S.tqLoaded) return;
  S.tqLoaded = true;
  try { const v = JSON.parse(lsGet('tq') || '{}'); if (typeof v.emp === 'string') S.tq.emp = v.emp; if (typeof v.proj === 'string') S.tq.proj = v.proj; S.tq.urg = !!v.urg; } catch (e) {}
  const d = S.data;
  if (S.tq.emp !== 'all' && !d.employees.some(e => e.id === S.tq.emp)) S.tq.emp = 'all';
  if (S.tq.proj !== 'all' && S.tq.proj !== 'gen' && !(d.projects || []).some(p => p.id === S.tq.proj)) S.tq.proj = 'all';
}
function saveTq() { lsSet('tq', JSON.stringify({emp: S.tq.emp, proj: S.tq.proj, urg: S.tq.urg})); }
function tqActive() { const q = S.tq; return !!(q.f || q.emp !== 'all' || q.proj !== 'all' || q.urg || (q.q || '').trim()); }
function clearTq() { Object.assign(S.tq, {f: '', emp: 'all', proj: 'all', urg: false, q: ''}); saveTq(); renderTasks(); }
function togSearch() { S.tq.search = !S.tq.search; if (!S.tq.search) S.tq.q = ''; renderTasks(); const i = $('#tqs'); if (i) i.focus(); }
function tqMatch(t) {
  const q = S.tq, s = (q.q || '').trim();
  if (q.emp !== 'all' && t.emp !== q.emp) return false;
  if (q.proj === 'gen' && t.project) return false;
  if (q.proj !== 'all' && q.proj !== 'gen' && t.project !== q.proj) return false;
  if (q.urg && !t.urgent) return false;
  if (s && (t.title + ' ' + (t.note || '') + ' ' + (t.pname || '')).indexOf(s) < 0) return false;
  return true;
}

function renderTasks() {
  if (S.td) return renderTaskDetail();
  loadTq();
  const d = S.data, q = S.tq;
  const empOpts = '<option value="all">كل الموظفين</option>' + d.employees.map(e => `<option value="${e.id}" ${q.emp === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('');
  const projOpts = `<option value="all">كل المشاريع</option><option value="gen" ${q.proj === 'gen' ? 'selected' : ''}>عام</option>` + (d.projects || []).map(p => `<option value="${p.id}" ${q.proj === p.id ? 'selected' : ''}>${esc(p.name)}${p.archived ? ' (مؤرشف)' : ''}</option>`).join('');
  $('#view').innerHTML = `
    ${q.search ? `<input id="tqs" class="tqs" type="search" placeholder="ابحث بالعنوان أو الوصف أو المشروع" value="${esc(q.q)}" oninput="S.tq.q=this.value;drawTaskList()">` : ''}
    <div class="scards" id="tcards"></div>
    <div class="tfil">
      <select aria-label="الموظف" class="${q.emp !== 'all' ? 'on' : ''}" onchange="S.tq.emp=this.value;saveTq();renderTasks()">${empOpts}</select>
      <select aria-label="المشروع" class="${q.proj !== 'all' ? 'on' : ''}" onchange="S.tq.proj=this.value;saveTq();renderTasks()">${projOpts}</select>
      <button class="chip ${q.urg ? 'on u' : ''}" onclick="S.tq.urg=!S.tq.urg;saveTq();renderTasks()">عاجلة</button>
      <button class="ibtn" onclick="togSearch()" aria-label="بحث">${I(q.search ? 'x' : 'search', 18)}</button>
    </div>
    ${tqActive() && !q.f ? '<button class="lnk" onclick="clearTq()">مسح الفلاتر</button>' : ''}
    <div id="tlist"></div>`;
  const fb = $('#fab'); fb.innerHTML = I('plus', 26, 2.5); fb.classList.remove('hide');
  drawTaskList();
}

function drawTaskList() {
  const el = $('#tlist'); if (!el) return;
  const today = S.data.today, q = S.tq;
  const list = allTasks().filter(tqMatch);
  list.forEach(t => { t.b = tBucket(t, today); });
  const cnt = k => list.filter(t => t.b === k).length;
  $('#tcards').innerHTML = [['review', 'تنتظر مراجعتك', 'a'], ['open', 'مفتوحة', 'n']].map(c => {
    const n = cnt(c[0]);
    return `<button class="sc ${c[2]} ${q.f === c[0] ? 'on' : ''} ${n ? '' : 'z'}" onclick="S.tq.f=S.tq.f==='${c[0]}'?'':'${c[0]}';drawTaskList()"><b>${n}</b><span>${c[1]}</span></button>`;
  }).join('');
  let h = '';
  const rv = list.filter(t => t.b === 'review').sort(byUrgent);
  if (rv.length && q.f !== 'open') h += `<div class="sech a">تنتظر مراجعتك<span>${rv.length}</span></div>` + rv.map(t => taskRowHtml(t, true)).join('');
  if (q.f !== 'review') projGroups(list.filter(t => t.b === 'open')).forEach(g => {
    h += `<div class="pgrp"><div class="pgh2"><span>${esc(g.name)}</span><span class="n">${g.items.length === 1 ? 'مهمة وحدة' : g.items.length === 2 ? 'مهمتين' : g.items.length + ' مهام'}</span></div>${g.items.map(t => taskRowHtml(t, false)).join('')}</div>`;
  });
  const done = list.filter(t => t.b === 'done');
  if (!h && !(done.length && !q.f)) h = emptyHtml('check-check', tqActive() ? 'ما فيه مهام بهالفلاتر' : 'ما فيه مهام مفتوحة. اضغط + وأضف أول مهمة');
  if (done.length && !q.f) h += `<button class="dtog" onclick="S.tq.showDone=!S.tq.showDone;drawTaskList()">${q.showDone ? 'إخفاء اللي خلصت' : 'خلصت مؤخرًا (' + done.length + ')'}</button>` + (q.showDone ? done.map(t => taskRowHtml(t, true)).join('') : '');
  el.innerHTML = h;
}

function taskRowHtml(t, showProj) {
  const today = S.data.today, p = pillOf(t, t.b, false);
  const ring = t.status === 'done' ? 'g' : t.status === 'review' ? 'a' : t.status === 'returned' ? 'r' : '';
  const nm = (t.media || []).length, np = (t.proofs || []).length;
  const mini = (t.urgent && t.status !== 'done' ? '<span class="mb u">عاجلة</span>' : '') + (nm ? `<span class="mb">شرح ${nm}</span>` : '') + (np ? `<span class="mb">إثبات ${np}</span>` : '');
  const when = t.status === 'done' ? 'خلصت ' + dmy(t.doneAt) : t.status === 'review' ? 'انرسلت ' + dmy(t.doneAt) : dueHtml(t, today);
  const meta = [esc(t.ename), showProj ? esc(t.pname || 'عام') : '', when].filter(Boolean).join(' · ');
  return `<div class="tli"><button class="trow2" onclick="openTask('${t.id}')"><span class="ring ${ring}"></span>
    <span class="tb"><span class="th"><span class="tt ${t.status === 'done' ? 'd' : ''}">${esc(t.title)}</span>${pillHtml(p)}</span>
    <span class="tm">${meta}</span>${mini ? `<span class="mbs">${mini}</span>` : ''}</span></button>
    ${t.status === 'review' ? `<div class="racts">${t.comment ? `<div class="note good" style="margin:0 0 8px">${esc(t.comment)}</div>` : ''}<div class="grid2"><button class="btn2 cu" onclick="approveTask('${t.id}')">${I('check', 16, 2.5)}اعتمدها</button><button class="btn2 rd" onclick="askReturn('${t.id}')">رجّعها</button></div></div>` : ''}</div>`;
}

function closeTask() { S.td = null; S.armed = null; renderAdmin(); window.scrollTo(0, 0); }

function askReturn(id) {

/* ---------- مرفقات المهمة الجديدة ---------- */

function tfFilled() { return S.tf.items.filter(it => it.title.trim() || it.note.trim() || it.media.length); }
function tfBtnLabel() { return 'إضافة'; }

function tfMediaHtml(k) {
  const it = S.tf.items[k], m = it.media;
  const up = m.some(x => x.st === 'up');
  return `<div class="mst">
    ${m.map((x, i) => `<div class="mi ${x.st === 'up' ? 'up' : ''}">
      ${x.t === 'i' && x.prev ? `<img src="${x.prev}" alt="">` : x.t === 'v' ? `<span>▶<br>فيديو${x.mb ? '<br>' + x.mb + ' م.ب' : ''}</span>` : ''}
      ${x.st === 'up' ? `<span style="position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;padding:2px 0">يرفع…</span>` : ''}
      ${x.st === 'up' ? '' : `<button class="x" onclick="rmMedia(${k},${i})" aria-label="حذف">×</button>`}
    </div>`).join('')}
    ${m.length < 5 ? `<label class="madd">${I('camera', 20)}صورة أو فيديو<input type="file" accept="${ACC_MEDIA}" multiple style="display:none" onchange="pickMedia(this, ${k})"></label>` : ''}
  </div>${up ? '<div class="sub" style="margin-top:6px">جاري الرفع… خلك بالصفحة لين يخلص</div>' : ''}<div class="err">${esc(it.merr || '')}</div>`;
}
function drawTfMedia(k) {
  const el = $('#tfMedia_' + k); if (el) el.innerHTML = tfMediaHtml(k);
  const b = $('#tfBtn'); if (b && !b.disabled) b.textContent = tfBtnLabel();
}

async function pickMedia(input, k) {
  const it = S.tf.items[k];
  const files = Array.from(input.files || []);
  input.value = '';
  const room = 5 - it.media.length;
  const errs = [];
  if (files.length > room) errs.push('الحد ٥ مرفقات للمهمة');
  const items = [];
  files.slice(0, room).forEach(f => {
    const isV = f.type.indexOf('video' + '/') === 0 || /\.(mov|mp4|m4v|3gp|webm)$/i.test(f.name);
    const isI = f.type.indexOf('image' + '/') === 0;
    if (!isV && !isI) { errs.push('الملف ' + f.name + ' مو صورة ولا فيديو'); return; }
    if (isV && f.size > 45 * 1024 * 1024) { errs.push('الفيديو كبير (' + Math.round(f.size / 1048576) + ' م.ب)، الحد ٤٥ م.ب تقريبًا دقيقة. صوّره أقصر'); return; }
    const x = {t: isV ? 'v' : 'i', st: 'up', file: f, mb: isV ? Math.max(1, Math.round(f.size / 1048576)) : 0};
    it.media.push(x); items.push(x);
  });
  it.merr = errs.join(' · ');
  const kk = () => S.tf.items.indexOf(it);
  drawTfMedia(kk());
  for (const x of items) {
    S.upN++;
    try {
      if (x.t === 'i') {
        const data = await resizeImg(x.file, 1600, 0.8);
        x.prev = data; drawTfMedia(kk());
        x.id = await callT(120000, 'apiUploadImg', BOOT.key, data);
        S.mc[x.id] = data;
      } else {
        x.id = await callT(600000, 'apiUploadVid', BOOT.key, x.file);
      }
      x.st = 'ok'; delete x.file;
    } catch (e) {
      it.media = it.media.filter(y => y !== x);
      errs.push((x.t === 'v' ? 'ما ارتفع الفيديو: ' : 'ما ارتفعت الصورة: ') + e);
      it.merr = errs.join(' · ');
    }
    S.upN--;
    if (kk() >= 0) drawTfMedia(kk());
    else if (x.id) call('apiMediaDiscard', BOOT.key, x.id).catch(() => {});
  }
}

function rmMedia(k, i) {
  const it = S.tf.items[k], x = it && it.media[i];
  if (!x || x.st === 'up') return;
  it.media.splice(i, 1); drawTfMedia(k);
  if (x.id) call('apiMediaDiscard', BOOT.key, x.id).catch(() => {});
}

function itemDue(it) {
  const t = S.data.today;
  return it.dueMode === 'today' ? t : it.dueMode === 'tom' ? addDays(t, 1) : it.dueMode === 'other' ? (it.due || t) : '';
}

async function addTask() {
  const tf = S.tf, it = tf.items[0], err = $('#tferr');
  if (err) err.textContent = '';
  if (!tf.emps.length) { if (err) err.textContent = 'اختر الموظف'; return; }
  if (!it.title.trim()) { if (err) err.textContent = 'اكتب المهمة'; const i = $('#qtTitle'); if (i) i.focus(); return; }
  if (S.upN) { if (err) err.textContent = 'انتظر لين يخلص رفع المرفقات'; return; }
  if (S.busy) return;
  S.busy = true;
  const b = $('#tfBtn'); if (b) { b.disabled = true; b.textContent = 'جاري الإضافة…'; }
  try {
    const items = [{title: it.title, due: itemDue(it), note: it.note, urgent: !!it.urgent, media: it.media.filter(x => x.id).map(x => ({id: x.id, t: x.t}))}];
    S.data = await call('apiTasksAdd', BOOT.key, {emps: tf.emps, project: tf.project || '', items});
    const keep = newItem(it.dueMode); if (it.dueMode === 'other') keep.due = it.due;
    S.tf = {emps: tf.emps, project: tf.project, newP: false, items: [keep]};
    S.busy = false;
    renderAdmin(); drawSheet();
    toast(tf.emps.length > 1 ? 'انضافت للكل' : 'انضافت');
    setTimeout(() => { const i = $('#qtTitle'); if (i) i.focus(); }, 80);
  } catch (e) {
    S.busy = false;
    if (err) err.textContent = e;
    if (b) { b.disabled = false; b.textContent = 'إضافة'; }
  }
}

function redrawTasks(admin) { admin ? renderTasks() : rerenderEmp(); }

  const admin = S.view === 'task' && !S.preview && BOOT.page === 'admin';
  if (!S.mopen[t.id]) return `<button class="mbtn" onclick="openMedia('${t.id}', ${admin})">${I('paperclip', 15)}شوف الشرح (${what})</button>`;
  return `<div>${m.map(x => x.t === 'i'

async function openMedia(id, admin) {
  S.mopen[id] = true;
  const t = findTask(id);
  const need = t ? (t.media || []).filter(x => !S.mc[x.id]) : [];
  need.forEach(x => { S.mc[x.id] = 'loading'; });
  redrawTasks(admin);
  await Promise.all(need.map(async x => {
    try { S.mc[x.id] = BOOT.page === 'admin' ? await call('apiMediaAdmin', BOOT.key, id, x.id) : await call('apiMediaEmp', BOOT.token, id, x.id); }
    catch (e) { delete S.mc[x.id]; toast(e); }
  }));
  redrawTasks(admin);
}

function findTask(id) {
  const lists = BOOT.page === 'admin' ? S.data.employees.map(e => e.tasks).concat(S.preview ? [S.preview.tasks] : []) : [S.empData ? S.empData.tasks : []];
  for (const l of lists) { const t = (l || []).find(x => x.id === id); if (t) return t; }

/* ---------- الفواتير (المدير) ---------- */

const money = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US', {maximumFractionDigits: 2});
function addMonths(d, m) {
  const x = new Date(d.slice(0, 10) + 'T12:00:00Z'); const day = x.getUTCDate();
  x.setUTCMonth(x.getUTCMonth() + m); if (x.getUTCDate() < day) x.setUTCDate(0);
  return x.toISOString().slice(0, 10);
}
function wLeft(until, today) {
  const n = Math.round((new Date(until + 'T12:00:00Z') - new Date(today + 'T12:00:00Z')) / 864e5);
  if (n < 0) return ['end', 'انتهى'];
  if (n <= 30) return ['soon', n === 0 ? 'ينتهي اليوم' : 'باقي ' + n + ' يوم'];
  const m = Math.floor(n / 30.4);
  return ['ok', 'باقي ' + (m === 1 ? 'شهر' : m === 2 ? 'شهرين' : m + (m <= 10 ? ' أشهر' : ' شهر'))];
}
function wBadge(x) {
  const me = BOOT.page === 'admin' && !S.preview;
  let b = '';
  if (x.kind === 'inv' && x.paidBy === 'card') b = '<span class="cb">' + (me ? 'بطاقتي' : 'بطاقة المدير') + '</span>';
  else if (x.kind === 'inv' && x.paidBy === 'own') b = '<span class="ob">' + (me ? 'من جيبه' : 'من جيبي') + '</span>';
  return b + (x.warrantyUntil ? '<span class="wb">ضمان</span>' : '');
}

function invSt(x, emp) {
  if (x.kind === 'give') return ['', x.paidBy === 'own' ? (emp ? 'رجعت لك' : 'سداد') : (emp ? 'استلمت عهدة' : 'عهدة')];
  if (x.status === 'review') return ['a', emp ? 'تنتظر' : 'تنتظر مراجعتك'];
  if (x.status === 'returned') return ['late', 'رجعت'];
  return ['', 'انعتمدت'];
}

let pfT;
function prefetchImgs() {
  clearTimeout(pfT);
  pfT = setTimeout(async () => {
    try {
      const admin = BOOT.page === 'admin';
      const d = admin ? S.data : S.empData;
      if (!d) return;
      const invs = admin ? ((d.inv || {}).items || []) : ((d.inv || {}).items || []);
      const tasks = admin ? (d.employees || []).flatMap(e => e.tasks || []) : (d.tasks || []);
      const invP = invs.slice(0, 80).flatMap(x => x.photos || []).filter(f => !S.ic[f]);
      const prP = tasks.filter(t => t.status !== 'done' || admin).slice(0, 60).flatMap(t => t.proofs || []).filter(f => !S.pc[f]);
      if (!invP.length && !prP.length) return;
      const m = await API.prefetch(invP.concat(prP));
      invP.forEach(f => { if (m[f] && !S.ic[f]) S.ic[f] = m[f]; });
      prP.forEach(f => { if (m[f] && !S.pc[f]) S.pc[f] = m[f]; });
    } catch (e) {}
  }, 250);
}

function renderInv() {

  const name = id => { const e = d.employees.find(x => x.id === id); return e ? e.name : ''; };
  const items = iv.items.map(x => Object.assign({}, x, {ename: name(x.emp)}));
  const rv = items.filter(x => x.kind === 'inv' && x.status === 'review');
  const okM = items.filter(x => x.kind === 'inv' && x.status === 'ok' && x.ts.slice(0, 7) === mk);
  const tot = okM.reduce((s, x) => s + x.amount, 0);

  }).join('') + '</div>';
  const okList = items.filter(x => x.kind === 'inv' && x.status === 'ok');
  if (okList.length) {
    const showAll = !!S.iopen.allinv, list = showAll ? okList : okList.slice(0, 8);
    h += `<div class="sech">آخر الفواتير<span>${okList.length}</span></div><div class="card" style="margin-top:6px;padding-top:2px;padding-bottom:2px">${list.map(x => invMiniRow(x, true)).join('')}
      ${okList.length > 8 ? `<button class="dtog" style="margin:4px 0 8px" onclick="S.iopen.allinv=!S.iopen.allinv;renderInv()">${showAll ? 'أقل' : 'كل الفواتير (' + okList.length + ')'}</button>` : ''}</div>`;
  }
  const ws = items.filter(x => x.kind === 'inv' && x.status !== 'returned' && x.warrantyUntil).sort((a, b) => a.warrantyUntil < b.warrantyUntil ? -1 : 1);
  if (ws.length) {
    const live = ws.filter(x => x.warrantyUntil >= d.today), old = ws.filter(x => x.warrantyUntil < d.today);
    const wrow = x => { const w = wLeft(x.warrantyUntil, d.today); return `<div class="str"><span><b style="font-weight:600">${esc(x.desc)}</b><div class="tm">${esc(x.pname || 'عام')} · ${esc(x.ename)} · ${dmy(x.ts)}</div>${invPhotosHtml(x, true)}</span><span class="wl ${w[0]}">${w[1]}</span></div>`; };
    h += `<div class="sech">الضمانات<span>${live.length}</span></div><div class="card" style="margin-top:6px;padding-top:2px;padding-bottom:2px">${live.map(wrow).join('') || '<div class="sub" style="padding:12px 0">ما فيه ضمان شغال</div>'}
      ${old.length ? `<button class="dtog" style="margin:4px 0 8px" onclick="S.iopen.wold=!S.iopen.wold;renderInv()">${S.iopen.wold ? 'إخفاء المنتهية' : 'المنتهية (' + old.length + ')'}</button>${S.iopen.wold ? old.map(wrow).join('') : ''}` : ''}</div>`;
  }
  const okAll = items.filter(x => x.kind === 'inv' && x.status === 'ok');
  const groups = {}, keys = [], order = (d.projects || []).map(p => p.id);
  okAll.forEach(x => { const k = x.project || ''; if (!groups[k]) { groups[k] = {name: x.pname || 'عام', all: 0, m: 0, list: []}; keys.push(k); } const g = groups[k]; g.all += x.amount; if (x.ts.slice(0, 7) === mk) { g.m += x.amount; g.list.push(x); } });
  keys.sort((a, b) => (a === '' ? 1e6 : order.indexOf(a)) - (b === '' ? 1e6 : order.indexOf(b)));
  if (keys.length) h += `<div class="sech">مصاريف المشاريع<span>${money(tot)} ${esc(d.month)}</span></div>` + keys.map(k => {
    const g = groups[k], on = !!S.iopen['p_' + k];
    return `<div class="pgrp"><button class="pgh2" onclick="S.iopen['p_${k}']=${on ? 'false' : 'true'};renderInv()"><span>${esc(g.name)}</span><span class="n">${money(g.m)} هالشهر<span class="chev ${on ? 'up' : ''}">${I('arrow-right', 15, 2.5)}</span></span></button>
      <div class="ivtot">الإجمالي من البداية: <b>${money(g.all)}</b> ريال</div>
      ${on ? (g.list.length ? g.list.map(x => invRowHtml(x, true)).join('') : '<div class="ivtot">ما فيه فواتير هالشهر</div>') : ''}</div>`;
  }).join('');
  const other = items.filter(x => x.kind === 'inv' && x.status === 'returned').slice(0, 20);
  if (other.length) h += `<button class="dtog" onclick="S.iv.f=S.iv.f?'':'o';renderInv()">${S.iv.f ? 'إخفاء' : 'الفواتير المرجّعة (' + other.length + ')'}</button>` + (S.iv.f ? other.map(x => invRowHtml(x, true)).join('') : '');
  if (!items.length) h += emptyHtml('receipt', 'ما فيه فواتير للحين. الموظف يرسلها من صفحته');
  $('#view').innerHTML = h;
}

      ${e.tx.length ? `<div class="hair"></div><div class="lbl" style="margin-top:0">${I('receipt', 14)}آخر الحركات</div>${e.tx.map(t => txHtml(t, true)).join('')}` : ''}

}

function payHtml(e, u) {
  const armed = S.armed === 'pay_' + e.id + u.month;
  return `<div class="hair"></div>
    <div class="row" style="margin-bottom:6px"><b>راتب ${esc(u.label)}</b><span class="badge a">ما انصرف</span></div>
    ${salaryTable(u)}
    ${u.warn10 ? `<div class="note bad">${I('triangle-alert', 16)}قسط السلفة أكثر من 10% من الراتب. نظام العمل يطلب موافقة مكتوبة من الموظف على الخصم.</div>` : ''}
    ${u.net < 0 ? `<div class="note bad">الخصومات أكبر من الراتب.</div>` : ''}
    <div class="grid2" style="margin-top:10px;align-items:center">
      <input id="pay_${e.id}${u.month}" type="number" inputmode="numeric" value="${Math.max(0,u.net)}">
      <button class="btn2 ${armed?'arm':'cu'}" onclick="pay('${e.id}','${u.month}')">${armed?'تأكيد الصرف':I('check', 16, 2.5) + 'تم الصرف'}</button>
    </div>
    <div class="err" id="perr_${e.id}${u.month}"></div>`;
}

function salaryTable(u) {
  return `<table class="tbl">
    <tr><td class="sub">الراتب الأساسي</td><td>${sar(u.base)}</td></tr>
    ${u.track ? '' : `<tr><td class="sub">الحافز</td><td class="pos">${sarS(u.bonus,'+')}</td></tr>`}
    ${u.advance ? `<tr><td class="sub">راتب مقدم</td><td class="neg">${sarS(u.advance,'−')}</td></tr>` : ''}
    ${u.inst ? `<tr><td class="sub">قسط السلفة</td><td class="neg">${sarS(u.inst,'−')}</td></tr>` : ''}
    <tr class="tot"><td>الصافي</td><td>${sar(u.net)}</td></tr>
  </table>`;
}

function formHtml(e, f) {
  const loan = f.kind === 'loan';
  return `<div class="ctitle" style="font-size:15px"><span class="ci">${I(loan ? 'hand-coins' : 'banknote', 16)}</span>${loan ? 'سلفة جديدة' : 'راتب مقدم'}</div>
    <div class="grid2" style="margin-top:10px">
      <div class="field"><span>المبلغ (ريال)</span><input id="f_amount" type="number" inputmode="numeric"></div>
      ${loan ? `<div class="field"><span>عدد الأقساط (شهور)</span><input id="f_months" type="number" inputmode="numeric" value="3"></div>` : '<div></div>'}
    </div>
    ${loan ? `<div class="field"><span>يبدأ الخصم من</span><div class="segc">
      <button class="${f.start==='next'?'on':''}" onclick="S.form.start='next';renderFin()">الشهر الجاي</button>
      <button class="${f.start==='now'?'on':''}" onclick="S.form.start='now';renderFin()">هالشهر</button></div></div>`
      : `<div class="sub" style="margin-bottom:10px">ينخصم كامل من راتب هالشهر.</div>`}
    <div class="field"><span>ملاحظة (اختياري)</span><input id="f_note"></div>
    <div class="grid2"><button class="btn2 cu" onclick="saveFin()">${I('check', 16, 2.5)}حفظ</button><button class="btn2" onclick="S.form=null;renderFin()">إلغاء</button></div>
    <div class="err" id="ferr"></div>`;
}

function openForm(emp, kind) { S.form = {emp, kind, start:'next'}; S.armed = null; renderFin(); }

async function saveFin() {
  const x = {emp:S.form.emp, kind:S.form.kind, start:S.form.start, amount:$('#f_amount').value, note:$('#f_note').value};
  if (S.form.kind === 'loan') x.months = $('#f_months').value;
  if (!(Number(x.amount) > 0)) return $('#ferr').textContent = 'اكتب المبلغ';
  try { S.data = await call('apiFinAdd', BOOT.key, x); S.form = null; renderAdmin(); toast('انحفظ'); }
  catch (e) { $('#ferr').textContent = e; }
}

async function pay(emp, month) {
  const k = 'pay_' + emp + month;
  if (S.armed !== k) { S.armed = k; renderFin(); return; }
  const v = $('#pay_' + emp + month).value;
  try { S.data = await call('apiPay', BOOT.key, {emp, month, amount: v}); S.armed = null; renderAdmin(); toast('تسجل الصرف'); }
  catch (e) { S.armed = null; renderFin(); toast(e); }
}

function txText(t) {
  if (t.kind === 'loan') return 'سلفة على ' + t.months + ' ' + (t.months <= 10 ? 'شهور' : 'شهر') + ' · الخصم من ' + t.label;
  if (t.kind === 'adv') return 'راتب مقدم من راتب ' + t.label;
  return 'صرف راتب ' + t.label;
}

function txHtml(t, canDelete) {
  const id = 'tx_' + t.id;
  const del = canDelete ? `<button class="del ${S.armed===id?'arm':''}" onclick="armTx('${t.id}')">${S.armed===id?'تأكيد الحذف':I('trash-2', 15)}</button>` : '';
  return `<div class="ent"><div class="ico f">${I(t.kind==='pay' ? 'check' : t.kind==='loan' ? 'hand-coins' : 'banknote', 15, 2.2)}</div>
    <div class="t"><div>${esc(txText(t))}${t.note ? ' — ' + esc(t.note) : ''}</div><div class="d">${dmy(t.date)}</div></div>
    <div class="p amt">${sar(t.amount)}</div>${del}</div>`;
}

async function armTx(id) {
  if (S.armed !== 'tx_' + id) { S.armed = 'tx_' + id; renderFin(); return; }
  try { S.data = await call('apiFinDelete', BOOT.key, id); S.armed = null; renderAdmin(); toast('انحذف'); }
  catch (e) { S.armed = null; renderFin(); toast(e); }
}

async function saveProj(id) {
  try { S.data = await call('apiProjectSave', BOOT.key, {id, name: $('#pn_' + id).value}); renderAdmin(); toast('انحفظ'); }
  catch (e) { $('#perr').textContent = e; }
}

async function archProj(id, a) {
  try { S.data = await call('apiProjectSave', BOOT.key, {id, archived: a}); renderAdmin(); toast(a ? 'انأرشف المشروع' : 'رجع المشروع'); }
  catch (e) { $('#perr').textContent = e; }
}

async function saveTarget() {
  const x = {};
  ['miss', 'trust', 'star', 'starCap', 'clean'].forEach(k => { x[k] = $('#st_' + k).value; });
  try { S.data = await call('apiSaveSettings', BOOT.key, x); renderAdmin(); toast('انحفظ'); }
  catch (e) { $('#terr').textContent = e; }
}

async function saveEmp(id) {
  const k = id || 'new';
  const x = {id, name: $('#n_'+k).value, salary: $('#s_'+k).value, max: $('#m_'+k).value};
  try { S.data = await call('apiSaveEmp', BOOT.key, x); renderAdmin(); toast(id ? 'انحفظ' : 'انضاف الموظف'); }
  catch (e) { $('#e_'+k).textContent = e; }
}

async function toggleTrack(id) {
  const e = empById(id);
  try { S.data = await call('apiSaveEmp', BOOT.key, {id, name:e.name, salary:e.salary, max:e.max, track: !e.track}); renderAdmin(); toast(!e.track ? 'صار متابعة فقط' : 'رجع له الحافز'); }
  catch (err) { $('#e_'+id).textContent = err; }
}

async function newToken(id) {
  const e = empById(id);
  if (S.armed !== 'tok_'+id) { S.armed = 'tok_'+id; renderSet(); return; }
  try { S.data = await call('apiSaveEmp', BOOT.key, {id, name:e.name, salary:e.salary, max:e.max, newToken:true}); S.armed = null; renderAdmin(); toast('انعمل رابط جديد'); }
  catch (err) { $('#e_'+id).textContent = err; }
}

async function newAdmin() {
  if (S.armed !== 'admin') { S.armed = 'admin'; renderSet(); return; }
  try {
    const r = await call('apiNewAdminLink', BOOT.key);
    BOOT.key = r.key; S.armed = null;
    $('#view').innerHTML = `<div class="card"><b>رابطك الجديد</b><div class="sub" style="margin-top:6px">احذف الأيقونة القديمة من الشاشة الرئيسية، وافتح هذا الرابط وأضفه من جديد.</div>
      <div class="link">${esc(adminLink(r.key))}</div><a class="btn2" href="${esc(adminLink(r.key))}">افتح الرابط الجديد</a></div>`;
  } catch (e) { toast(e); }
}

}

async function loadEmp() {
  try { renderEmp(await call('apiEmp', BOOT.token), false); }
  catch (e) { $('#app').innerHTML = '<div class="load">' + esc(e) + '</div>'; }
}

function renderEmp(d, isPreview) {
  S.empData = d; S.empPreview = isPreview;
  const nOpen = (d.tasks || []).filter(t => t.status === 'open' || t.status === 'returned').length;
  if (!['tasks', 'inv', 'pay'].includes(S.etab)) S.etab = 'tasks';
  const tasksTab = S.etab === 'tasks';
  $('#app').innerHTML = `
    ${isPreview ? `<button class="back" onclick="closePreview()">${I('arrow-right', 17)}رجوع للفريق</button><div class="note info">${I('eye', 16)}هذي معاينة، والموظف يشوف نفس الصفحة.</div>` : ''}
    <div class="top"><div><h1>${esc(d.name)}</h1><div class="sub">${esc(S.etab === 'pay' ? d.month.label : dayLabel(d.today))}</div></div>${isPreview ? '' : `<button class="rf" onclick="refresh()" aria-label="تحديث">${I('refresh-cw', 18)}</button>`}</div>${isPreview ? '' : pushHtml()}${tasksTab ? attCardHtml(d, isPreview) : ''}
    <div class="segc etabs"><button class="${S.etab === 'tasks' ? 'on' : ''}" onclick="S.etab='tasks';rerenderEmp()">مهامي${nOpen ? ' (' + nOpen + ')' : ''}</button><button class="${S.etab === 'inv' ? 'on' : ''}" onclick="S.etab='inv';rerenderEmp()">فواتيري</button><button class="${S.etab === 'pay' ? 'on' : ''}" onclick="S.etab='pay';rerenderEmp()">حافزي</button></div>
    ${S.etab === 'inv' ? empInvHtml(d, isPreview) : tasksTab ? empTasksHtml(d, isPreview) : empPayHtml(d)}`;
  if (!isPreview) prefetchImgs();
}

function empPayHtml(d) {
  const m = d.month, f = d.fin;
  const st = m.settings;
  const next = m.track
    ? (!m.misses ? `<div class="note good">ما عليك ولا تقصير هالشهر، كمّل كذا</div>` : `<div class="note info">عليك ${m.misses} تقصير هالشهر، ركّز عليها.</div>`)
    : !m.misses
    ? `<div class="note good">ما عليك ولا تقصير هالشهر، كمّل كذا وتاخذ مكافأة ${st.clean} ريال</div>`
    : `<div class="note info">كل تقصير ينقص ${st.miss} ريال (الأمانة ${st.trust})، وكل موقف مميز يزيد ${st.star} ريال.</div>`;
  const paidRows = d.history.filter(h => h.month !== m.month);
  return `
    <div class="card" style="margin-top:16px">
      <div class="kpis" style="margin-top:0">
        ${m.track ? `<div class="kpi"><div class="k">${I('x', 13, 2.5)}التقصير هالشهر</div><div class="v">${m.misses}</div></div>
        <div class="kpi"><div class="k">${I('star', 13)}مواقف مميزة</div><div class="v">${m.stars}</div></div>` : `<div class="kpi hero"><div class="k">${I('sparkles', 13)}حافزك الحين</div><div class="v">${num(m.bonus)}<small> ريال</small></div></div>
        <div class="kpi"><div class="k">${I('history', 13)}تقصير · مميز</div><div class="v">${m.misses}<small> ✕</small> ${m.stars}<small> ★</small></div></div>`}
      </div>
      ${m.track ? '' : bonusTable(m)}
      ${next}
    </div>
    <div class="card">
      ${ctitle('banknote', 'راتب ' + esc(f.label), f.paid ? `<span class="badge">${I('check', 12, 3)} انصرف ${dmy(f.paidDate)}</span>` : `<span class="badge a">ما انصرف</span>`)}<div style="height:6px"></div>
      ${salaryTable(f)}
      ${f.paid && f.paidAmount !== f.net ? `<div class="sub" style="margin-top:6px">المبلغ المصروف: ${sar(f.paidAmount)}</div>` : ''}
    </div>
    ${m.strength || m.improve ? `<div class="card">
      ${m.strength ? `<div class="note good" style="margin-top:0">${I('circle-check', 17)}<div><b>نقطة قوتك — ${esc(m.strength.crit)}</b><br>${esc(m.strength.text)}</div></div>` : ''}
      ${m.improve ? `<div class="note bad">${I('triangle-alert', 17)}<div><b>ركّز على — ${esc(m.improve.crit)}</b><br>${esc(m.improve.text)}</div></div>` : ''}
    </div>` : ''}
    <div class="card">${ctitle('history', 'مواقف هالشهر')}<div style="margin-top:6px">
      ${d.entries.length ? d.entries.map(x => entryHtml(x, false, m.track)).join('') : emptyHtml('inbox', 'ما فيه مواقف مسجلة هالشهر')}
    </div></div>
    ${d.loans.length ? `<div class="card">${ctitle('hand-coins', 'السلف')}<div style="margin-top:10px">
      ${d.loans.map(l => `<div class="row"><span>سلفة ${sar(l.amount)} <span class="sub">· ${dmy(l.date)}</span></span><span>باقي ${sar(l.remaining)}</span></div><div class="sub">القسط الشهري ${sar(l.per)}</div>`).join('<div class="hair"></div>')}
    </div></div>` : ''}
    ${paidRows.length ? `<div class="card">${ctitle('calendar', 'الشهور السابقة')}<div class="hist" style="margin-top:12px;grid-template-columns:${m.track ? '1.4fr auto' : '1.4fr auto auto'}">
      <div class="h">الشهر</div>${m.track ? '' : '<div class="h">الحافز</div>'}<div class="h">الصافي</div>
      ${paidRows.map(h => `<div>${esc(h.label)} ${h.paid ? '<span class="pos">' + I('check', 14, 3) + '</span>' : ''}</div>${m.track ? '' : `<div class="cu">${num(h.bonus)}</div>`}<div>${num(h.paid ? h.paidAmount : h.net)}</div>`).join('')}
    </div></div>` : ''}
    ${d.tx.length ? `<div class="card">${ctitle('receipt', 'كشف الحساب')}<div style="margin-top:6px">${d.tx.map(t => txHtml(t, false)).join('')}</div></div>` : ''}
    ${m.track ? '' : `<div class="card"><details><summary>${I('info', 16)}طريقة الحساب</summary>${rulesHtml(d.rules)}</details></div>`}`;
}

/* ---------- المهام (الموظف) ---------- */

function empTasksHtml(d, isPreview) {
  const today = d.today, mode = isPreview ? 'preview' : 'emp';
  const ts = (d.tasks || []).map(t => Object.assign({}, t, {b: tBucket(t, today)}));
  const open = ts.filter(t => t.status === 'open' || t.status === 'returned'), ret = ts.filter(t => t.status === 'returned').sort(byUrgent);
  const cnt = open.length === 1 ? 'عندك مهمة وحدة' : open.length === 2 ? 'عندك مهمتين' : 'عندك ' + open.length + ' مهام';
  let h = `<div class="note info" style="margin-top:14px">${open.length ? cnt + (ret.length ? ' · ' + (ret.length === 1 ? 'وحدة رجعت لك' : ret.length + ' رجعت لك') : '') : 'ما عليك مهام الحين، يعطيك العافية'}</div>`;
  if (ret.length) h += `<div class="sech r">رجعت لك</div>` + ret.map(t => empCardHtml(t, mode, false)).join('');
  projGroups(ts.filter(t => t.status === 'open')).forEach((g, i) => {
    const k = g.key || 'gen', on = S.eopen[k] !== undefined ? S.eopen[k] : i === 0;
    h += `<div class="pgrp"><button class="pgh2" aria-expanded="${on}" onclick="S.eopen['${k}']=${on ? 'false' : 'true'};rerenderEmp()"><span>${esc(g.name)}</span><span class="n">${g.items.length === 1 ? 'مهمة وحدة' : g.items.length === 2 ? 'مهمتين' : g.items.length + ' مهام'}<span class="chev ${on ? 'up' : ''}">${I('arrow-right', 15, 2.5)}</span></span></button>${on ? g.items.map(t => empCardHtml(t, mode, true)).join('') : ''}</div>`;
  });
  const rv = ts.filter(t => t.status === 'review');
  if (rv.length) h += `<div class="sech a">انرسلت، تنتظر المدير</div>` + rv.map(t => empCardHtml(t, mode, false)).join('');
  const done = ts.filter(t => t.status === 'done').slice(0, 10);
  if (done.length) h += `<button class="dtog" onclick="S.eShowDone=!S.eShowDone;rerenderEmp()">${S.eShowDone ? 'إخفاء اللي خلصت' : 'خلصت (' + done.length + ')'}</button>` + (S.eShowDone ? done.map(t => `<div class="tli dn"><span class="tt d">${esc(t.title)}</span><span class="tm">${dmy(t.doneAt)}</span></div>`).join('') : '');
  return h;
}

function empCardHtml(t, mode, inGroup) {
  const today = S.empData.today, p = pillOf(t, t.b, true), open = t.status === 'open' || t.status === 'returned';
  let act = '';
  if (open && mode === 'emp') act = S.doing === t.id ? proofFormHtml(t) : `<label class="bigdo">${I('camera', 15, 2.2)}أنجزتها<input type="file" accept="${ACC_IMG}" capture="environment" style="display:none" onchange="startDone('${t.id}', this)"></label>`;
  const meta = [inGroup ? '' : (t.pname ? esc(t.pname) : ''), t.status === 'review' ? 'انرسلت ' + dmy(t.doneAt) : dueHtml(t, today)].filter(Boolean).join(' · ');
  return `<div class="ecard ${inGroup ? 'in' : ''} ${t.status === 'returned' ? 'rt' : ''}">
    <div class="th"><span class="tt">${esc(t.title)}</span>${pillHtml(p)}</div>
    ${meta ? `<div class="tm">${meta}</div>` : ''}
    ${t.urgent && open ? '<span class="mb u" style="display:inline-block;margin-top:6px">عاجلة</span>' : ''}
    ${t.status === 'returned' && t.reason ? `<div class="note bad"><div><b>المدير يقول:</b> ${esc(t.reason)}</div></div>` : ''}
    ${t.note && open ? `<div class="enote">${esc(t.note)}</div>` : ''}
    ${open ? mediaHtml(t) : ''}
    ${act}</div>`;
}

function proofFormHtml(t) {
  return `<div class="pform">
    <div class="shots">${S.shots.map((s, i) => `<div class="shot"><img src="${s}" alt="صورة إثبات"><button class="x" onclick="S.shots.splice(${i},1);rerenderEmp()" aria-label="حذف الصورة">×</button></div>`).join('')}
    ${S.shots.length < 5 ? `<label class="madd">${I('camera', 20)}صورة<input type="file" accept="${ACC_IMG}" multiple style="display:none" onchange="startDone('${t.id}', this)"></label>` : ''}</div>
    ${S.shotLoading ? '<div class="sub">جاري تجهيز الصورة…</div>' : ''}
    <input placeholder="تعليق (اختياري)" value="${esc(S.cm || '')}" oninput="S.cm=this.value">
    <button class="btn" ${S.shots.length && !S.busy && !S.shotLoading ? '' : 'disabled'} onclick="sendDone('${t.id}')">${S.busy ? 'جاري الإرسال…' : I('send', 17) + 'إرسال'}</button>
    <button class="btn2" style="width:100%;border:0" onclick="S.doing=null;S.shots=[];rerenderEmp()">إلغاء</button>
    <div class="err" id="uperr"></div></div>`;
}

async function startDone(id, input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  if (S.doing !== id) { S.doing = id; S.shots = []; S.cm = ''; }
  S.shotLoading = true; rerenderEmp();
  for (const f of files.slice(0, Math.max(0, 5 - S.shots.length))) {
    try { S.shots.push(await resizeImg(f)); } catch (e) { toast(e); }
  }
  S.shotLoading = false; rerenderEmp();
}

function empInvHtml(d, isPreview) {
  const iv = d.inv || {balance: 0, owed: 0, items: []}, c = iv.c != null ? iv.c : (iv.balance || 0), t = iv.owed != null ? iv.owed : Math.max(0, -c);
  let h = `<div class="ivbal"><span>العهدة اللي معك</span><b>${money(Math.max(0, c))} <small>ريال</small></b></div>`;
  if (t > 0) h += `<div class="ivbal" style="background:#A32D2D;margin-top:8px"><span>لك عند المدير</span><b>${money(t)} <small>ريال</small></b></div>`;
  if (!isPreview) h += S.invForm ? invFormHtml(d) : `<button class="bigdo" onclick="S.invForm=true;S.ishots=[];rerenderEmp()">${I('receipt', 15, 2.2)}أرسل فاتورة</button>`;
  const items = iv.items || [];
  if (!items.length) return h + emptyHtml('receipt', 'ما أرسلت فواتير للحين');
  return h + '<div class="card" style="margin-top:14px;padding-top:4px;padding-bottom:4px">' + items.map(x => {
    const st = invSt(x, true), give = x.kind === 'give';
    return `<div class="ivr"><div class="th"><span class="tt">${esc(x.desc)}${wBadge(x)}</span><b class="iva ${give ? 'g' : ''}"><bdi dir="ltr">${give ? '+' : ''}${money(x.amount)}</bdi></b></div>
      <div class="tm">${give ? (x.method ? esc(x.method) + ' · ' : '') : esc(x.pname || 'عام') + ' · '}${dmy(x.ts)} · <span class="badge ${st[0]}">${st[1]}</span>${x.warrantyUntil ? ' · ضمان لين ' + dmy(x.warrantyUntil) : ''}</div>
      ${x.status === 'returned' && x.reason ? `<div class="note bad" style="margin-top:6px"><div><b>المدير يقول:</b> ${esc(x.reason)}</div></div>` : ''}
      ${invPhotosHtml(x, BOOT.page === 'admin')}</div>`;
  }).join('') + '</div>';
}

function invFormHtml(d) {
  const f = S.inv, ps = d.projects || [];
  return `<div class="pform" style="margin-top:12px">
    <b>فاتورة جديدة</b>
    <div class="shots">${S.ishots.map((s, i) => `<div class="shot"><img src="${s}" alt="صورة الفاتورة"><button class="x" onclick="S.ishots.splice(${i},1);rerenderEmp()" aria-label="حذف الصورة">×</button></div>`).join('')}
    ${S.ishots.length < 3 ? `<label class="madd">${I('camera', 20)}صوّر الفاتورة<input type="file" accept="${ACC_IMG}" multiple style="display:none" onchange="pickInv(this)"></label>` : ''}</div>
    ${S.ishotLoading ? '<div class="sub">جاري تجهيز الصورة…</div>' : ''}
    <input class="qtt" inputmode="decimal" placeholder="المبلغ بالريال" value="${esc(f.amount)}" oninput="S.inv.amount=this.value">
    <input placeholder="وش اشتريت؟ مثلاً: أفياش وأسلاك" value="${esc(f.desc)}" oninput="S.inv.desc=this.value">
    <select aria-label="المشروع" onchange="S.inv.project=this.value">${ps.map(p => `<option value="${p.id}" ${f.project === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="" ${f.project === '' ? 'selected' : ''}>عام</option></select>
    <div class="sub" style="margin:4px 0 -2px">دفعت من؟</div>
    <div class="segc">${[['cash', 'العهدة'], ['own', 'من جيبي'], ['card', 'بطاقة المدير']].map(o => `<button class="${(f.paidBy || 'cash') === o[0] ? 'on' : ''}" onclick="S.inv.paidBy='${o[0]}';rerenderEmp()">${o[1]}</button>`).join('')}</div>
    <div class="sub" style="margin-top:-4px">${f.paidBy === 'card' ? 'ما تنخصم من عهدتك' : f.paidBy === 'own' ? 'ترجع لك بعد ما يعتمدها المدير' : 'تنخصم من العهدة اللي معك'}</div>
    <label class="tgl"><span>عليها ضمان؟</span><input type="checkbox" ${f.wOn ? 'checked' : ''} onchange="S.inv.wOn=this.checked;if(this.checked&&!S.inv.w)S.inv.w=12;rerenderEmp()"></label>
    ${f.wOn ? `<div class="wchips">${[[6, '6 أشهر'], [12, 'سنة'], [24, 'سنتين']].map(c => `<button class="${!f.wc && f.w === c[0] ? 'on' : ''}" onclick="S.inv.w=${c[0]};S.inv.wc=false;rerenderEmp()">${c[1]}</button>`).join('')}<button class="${f.wc ? 'on' : ''}" onclick="S.inv.wc=true;rerenderEmp()">غيره</button></div>
      ${f.wc ? `<input inputmode="numeric" placeholder="كم شهر؟" value="${f.w || ''}" oninput="S.inv.w=Number(String(this.value).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)))||0">` : ''}` : ''}
    <button class="btn" ${S.busy || S.ishotLoading ? 'disabled' : ''} onclick="sendInv()">${S.busy ? 'جاري الإرسال…' : I('send', 17) + 'إرسال'}</button>
    <button class="btn2" style="width:100%;border:0" onclick="S.invForm=false;S.ishots=[];rerenderEmp()">إلغاء</button>
    <div class="err" id="ierr"></div></div>`;
}

async function pickInv(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  S.ishotLoading = true; rerenderEmp();
  for (const f of files.slice(0, Math.max(0, 3 - S.ishots.length))) {
    try { S.ishots.push(await resizeImg(f, 1600, 0.8)); } catch (e) { toast(e); }
  }
  S.ishotLoading = false; rerenderEmp();
}

async function sendInv() {
  const f = S.inv, err = () => $('#ierr');
  if (!S.ishots.length) { err().textContent = 'صوّر الفاتورة'; return; }
  if (!(Number(String(f.amount).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[^\d.]/g, '')) > 0)) { err().textContent = 'اكتب المبلغ'; return; }
  if (!f.desc.trim()) { err().textContent = 'اكتب وش اشتريت'; return; }
  if (f.wOn && !(f.w >= 1 && f.w <= 120)) { err().textContent = 'اكتب مدة الضمان بالأشهر'; return; }
  if (S.busy) return;
  S.busy = true; rerenderEmp();
  try {
    const d = await callT(120000, 'apiInvAdd', BOOT.token, {amount: f.amount, desc: f.desc, project: f.project, warranty: f.wOn ? f.w : 0, paidBy: f.paidBy || 'cash'}, S.ishots);
    S.busy = false; S.invForm = false; S.ishots = []; S.inv = {amount: '', desc: '', project: f.project};
    renderEmp(d, false); toast('انرسلت الفاتورة');
  } catch (e) {
    S.busy = false; rerenderEmp(); const el = $('#ierr'); if (el) el.textContent = e;
  }
}

function rerenderEmp() { if (S.empData) renderEmp(S.empData, S.empPreview); }

function resizeImg(file, maxD, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, (maxD || 1280) / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q || 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej('ما قدرت أقرأ الصورة، جرّب صورة ثانية'); };
    img.src = url;
  });
}

async function sendDone(id) {
  if (!S.shots.length || S.busy) return;
  S.busy = true; rerenderEmp();
  try {
    const d = await callT(120000, 'apiTaskDone', BOOT.token, id, S.cm || '', S.shots);
    S.busy = false; S.doing = null; S.shots = []; S.cm = '';
    renderEmp(d, false); toast('انرسلت، يعطيك العافية');
  } catch (e) {
    S.busy = false; rerenderEmp(); const el = $('#uperr'); if (el) el.textContent = e;
  }
}

/* ---------- التحديث ---------- */

let lastLoad = Date.now(), refreshing = false;
async function refresh(silent) {
  if (refreshing || S.busy) return;
  if (S.upN) { if (!silent) toast('انتظر لين يخلص الرفع'); return; }
  if (silent && (S.doing || S.invForm || S.form || S.ret || S.sheet || tfFilled().length || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || ''))) return;
  refreshing = true;
  document.querySelectorAll('.rf').forEach(b => b.classList.add('spin'));
  try {
    if (BOOT.page === 'admin') {
      S.data = await call('apiAdmin', BOOT.key);
      S.armed = null; S.preview = null;
      renderAdmin();
    } else if (BOOT.page === 'emp') {
      const d = await call('apiEmp', BOOT.token);
      S.doing = null; S.upload = null; S.shots = [];
      renderEmp(d, false);
    }
    lastLoad = Date.now();
    if (!silent) toast('تحدّثت');
  } catch (e) {
    toast('ما قدرت أحدّث، تأكد من النت');
  } finally {
    refreshing = false;
    document.querySelectorAll('.rf').forEach(b => b.classList.remove('spin'));
  }
}

(function () {
  let y0 = null, pulled = 0;
  const ind = document.getElementById('ptr');
  window.addEventListener('touchstart', e => { y0 = window.scrollY <= 0 ? e.touches[0].clientY : null; pulled = 0; }, {passive: true});
  window.addEventListener('touchmove', e => {
    if (y0 === null) return;
    pulled = e.touches[0].clientY - y0;
    if (pulled > 0) {
      ind.style.height = Math.min(pulled * 0.45, 56) + 'px';
      ind.textContent = pulled > 110 ? 'اترك عشان تحدّث' : 'اسحب للتحديث';
    }
  }, {passive: true});
  window.addEventListener('touchend', () => {
    if (y0 !== null && pulled > 110) refresh();
    y0 = null; pulled = 0; ind.style.height = '0';
  }, {passive: true});
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastLoad > 60000) refresh(true);
  });
  window.addEventListener('error', () => toast('صار خطأ، اسحب الصفحة لتحت عشان تحدّث'));
})();

if (BOOT.page === 'admin') loadAdmin();
else if (BOOT.page === 'emp') loadEmp();
else $('#app').innerHTML = '<div class="load"><div class="ei">' + I('link', 28) + '</div><b style="color:var(--text);font-size:17px">الرابط غير صالح</b><br>تأكد من الرابط اللي وصلك، أو اطلب رابط جديد.</div>';
</script>
